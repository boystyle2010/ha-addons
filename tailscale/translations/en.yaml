configuration:
  auth_key:
    name: "Auth key"
    description: "Optional key to sign in automatically. Create one in the Tailscale admin console (reusable keys are recommended). Leave empty to sign in through the Web UI instead."
  hostname:
    name: "Hostname"
    description: "The name this device shows in your tailnet."
  accept_dns:
    name: "Accept DNS"
    description: "This option allows you to accept DNS settings of your tailnet that are configured on the DNS page of the admin console. Disabled by default."
  accept_routes:
    name: "Accept routes"
    description: "This option allows you to accept subnet routes advertised by other nodes in your tailnet. This option is disabled by default."
  advertise_connector:
    name: "Advertise as an app connector"
    description: "When you use an app connector, you specify which applications you wish to make accessible over your tailnet, and the domains for those applications. This option is disabled by default."
  advertise_exit_node:
    name: "Advertise as an exit node"
    description: "This option allows you to advertise this Tailscale instance as an exit node. By setting a device on your network as an exit node, you can use it to route all your public internet traffic as needed."
  advertise_routes:
    name: "Advertise subnet routes"
    description: "This option allows you to advertise routes to subnets (accessible on the network your device is connected to) to other clients on your tailnet."
  advertise_tags:
    name: "Advertise tags"
    description: "This option allows you to specify specific ACL tags for this Tailscale instance. They need to start with 'tag:'."
  always_use_derp:
    name: "Always use DERP connection"
    description: "When enabled forces all peer communication over DERP by disabling the use of UDP. This option is disabled by default."
  enable_ssh:
    name: "Tailscale SSH"
    description: "Allow Tailscale SSH access to this device, controlled by your tailnet policy. Disabled by default."
  exit_node:
    name: "Use an exit node"
    description: "Tailscale IP address of an exit node to route this device's traffic through. Cannot be combined with advertising this device as an exit node."
  log_suppression:
    name: "Log suppression"
    description: "This option allows you to suppress Tailscale's log messages in the app's log after 200 lines. Turn it off only in case you are troubleshooting, because Tailscale is quite chatty. This option is enabled by default."
  log_upload:
    name: "Log upload"
    description: "Controls Tailscale's client log upload to log.tailscale.com. Enable it if your tailnet policy/Admin Console requires client log upload. This option is disabled by default."
  login_server:
    name: "Login server"
    description: "This option allows you to specify a custom control server for this Tailscale instance, for example, a self-host Headscale instance. By default, it uses the control server provided by Tailscale."
  share_homeassistant:
    name: "Share Home Assistant with Serve or Funnel"
    description: "This option allows you to enable Tailscale Serve or Funnel features to present your Home Assistant instance with a valid certificate on your tailnet or on the internet."
  share_on_port:
    name: "Share on port"
    description: "This option allows you to specify the port the Tailscale Serve and Funnel features will use to present your Home Assistant instance. Only ports 443, 8443, and 10000 are allowed."
  snat_subnet_routes:
    name: "Source NAT subnet routes"
    description: "This option allows subnet devices to see the traffic originating from the subnet router, and this simplifies routing configuration. This option is enabled by default."
  stateful_filtering:
    name: "Stateful packet filtering"
    description: "This option enables stateful packet filtering on packet-forwarding nodes (exit nodes, subnet routers, and app connectors), to only allow return packets for existing outbound connections. This option is disabled by default."
  taildrive:
    name: "Taildrive shares"
    description: "This option allows you to share directories with other Tailscale nodes using Taildrive."
    fields:
      addons:
        name: "addons"
        description: "Share the local add-ons directory with other Tailscale nodes."
      addon_configs:
        name: "addon_configs"
        description: "Share the add-on configuration directory with other Tailscale nodes."
      backup:
        name: "backup"
        description: "Share the backup directory with other Tailscale nodes."
      config:
        name: "config"
        description: "Share the Home Assistant configuration directory with other Tailscale nodes."
      media:
        name: "media"
        description: "Share the media directory with other Tailscale nodes."
      share:
        name: "share"
        description: "Share the share directory with other Tailscale nodes."
      ssl:
        name: "ssl"
        description: "Share the SSL directory with other Tailscale nodes."
  taildrop:
    name: "Taildrop"
    description: "This option allows you to enable Taildrop, a file sharing service that allows you to share files with other Tailscale nodes (saved to /share/taildrop). This option is disabled by default."
  userspace_networking:
    name: "Userspace networking mode"
    description: "When enabled, Tailscale will not create a 'tailscale0' network interface on your host, i.e. you get one-way access from tailnet clients to your Home Assistant instance. This option is disabled by default."
  extra_args:
    name: "Extra arguments"
    description: "Additional arguments passed to tailscale up. For advanced use only."
