configuration:
  auth_key:
    name: "Khóa xác thực (Auth Key)"
    description: "Mã tskey-auth-... lấy từ trang quản trị Tailscale để tự động đăng nhập (để trống nếu muốn đăng nhập qua Web UI)."
  hostname:
    name: "Tên thiết bị (Hostname)"
    description: "Tên máy chủ hiển thị trên bảng điều khiển Tailscale của bạn."
  advertise_exit_node:
    name: "Chạy làm Exit Node"
    description: "Cho phép định tuyến toàn bộ lưu lượng Internet từ xa đi qua mạng gia đình của bạn."
  advertise_routes:
    name: "Quảng bá dải mạng LAN (Subnet Routes)"
    description: "Các lớp mạng nội bộ muốn truy cập từ xa (mặc định: 192.168.68.0/24)."
  accept_routes:
    name: "Chấp nhận dải mạng từ nơi khác (Accept Routes)"
    description: "Nhận các dải mạng nội bộ do thiết bị Tailscale khác quảng bá tới."
  accept_dns:
    name: "Chấp nhận DNS (MagicDNS)"
    description: "Nên TẮT (false) trên Home Assistant để tránh xung đột với DNS nội bộ và làm chậm mạng."
  enable_ssh:
    name: "Bật Tailscale SSH"
    description: "Cho phép truy cập SSH vào container thông qua xác thực của Tailscale."
  snat_subnet_routes:
    name: "Bật SNAT cho Subnet Routes"
    description: "Giữ BẬT (true) để các thiết bị trong mạng LAN phản hồi gói tin về đúng Pi 5 mà không cần chỉnh định tuyến trên Router Deco."
  extra_args:
    name: "Tham số nâng cao (Extra Flags)"
    description: "Các cờ CLI bổ sung truyền vào lệnh 'tailscale up' nếu cần (ví dụ: --stateful-filtering=false)."
