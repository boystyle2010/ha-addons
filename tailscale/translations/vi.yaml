configuration:
  auth_key:
    name: "Khóa xác thực (Auth key)"
    description: "Khóa tùy chọn để tự động đăng nhập (nên dùng loại Reusable). Để trống nếu bạn muốn đăng nhập trực tiếp qua giao diện Web UI."
  hostname:
    name: "Tên thiết bị (Hostname)"
    description: "Tên hiển thị của thiết bị này trên mạng Tailnet của bạn."
  accept_dns:
    name: "Chấp nhận DNS (Accept DNS)"
    description: "Cho phép áp dụng cài đặt DNS (MagicDNS) từ trang quản trị Tailscale lên thiết bị này. Mặc định tắt."
  accept_routes:
    name: "Chấp nhận dải mạng (Accept routes)"
    description: "Cho phép nhận các dải mạng nội bộ (subnet routes) do các thiết bị khác trong Tailnet quảng bá. Mặc định tắt."
  advertise_connector:
    name: "Quảng bá làm App Connector"
    description: "Cho phép thiết bị này đóng vai trò làm cầu nối ứng dụng (App Connector) định tuyến các tên miền chỉ định qua Tailnet. Mặc định tắt."
  advertise_exit_node:
    name: "Chạy làm Exit Node"
    description: "Cho phép thiết bị này làm điểm thoát Internet (Exit Node) để các thiết bị ở xa định tuyến toàn bộ lưu lượng mạng qua mạng gia đình của bạn."
  advertise_routes:
    name: "Quảng bá dải mạng LAN (Advertise subnet routes)"
    description: "Danh sách các lớp mạng nội bộ muốn chia sẻ cho các thiết bị khác trong Tailnet truy cập (ví dụ: 192.168.68.0/24)."
  advertise_tags:
    name: "Gắn thẻ phân quyền (Advertise tags)"
    description: "Các thẻ ACL dành riêng cho thiết bị này. Bắt buộc phải bắt đầu bằng 'tag:' (ví dụ: tag:home-assistant)."
  always_use_derp:
    name: "Luôn dùng kết nối trạm trung chuyển DERP"
    description: "Khi bật sẽ ép toàn bộ kết nối đi qua máy chủ trung chuyển DERP và tắt kết nối trực tiếp UDP (chỉ dùng khi cần chẩn đoán lỗi mạng). Mặc định tắt."
  enable_ssh:
    name: "Tailscale SSH"
    description: "Cho phép truy cập SSH vào thiết bị này thông qua chính sách xác thực của Tailnet. Mặc định tắt."
  exit_node:
    name: "Sử dụng Exit Node khác"
    description: "Địa chỉ IP Tailscale của một Exit Node khác mà bạn muốn hướng lưu lượng của thiết bị này đi qua (Không thể dùng chung khi đang bật làm Exit Node)."
  log_suppression:
    name: "Rút gọn nhật ký (Log suppression)"
    description: "Tự động ẩn bớt các dòng nhật ký liên tục của Tailscale sau 200 dòng đầu tiên để tránh tràn log. Chỉ nên tắt khi bạn cần kiểm tra lỗi. Mặc định bật."
  log_upload:
    name: "Tải nhật ký lên máy chủ (Log upload)"
    description: "Kiểm soát việc tải nhật ký client lên log.tailscale.com. Chỉ bật nếu chính sách Tailnet của bạn bắt buộc. Mặc định tắt."
  login_server:
    name: "Máy chủ điều khiển (Login server)"
    description: "Chỉ định máy chủ điều phối tùy chỉnh (ví dụ máy chủ Headscale tự dựng). Mặc định sử dụng máy chủ chính thức của Tailscale."
  share_homeassistant:
    name: "Chia sẻ Home Assistant qua Serve hoặc Funnel"
    description: "Bật tính năng Tailscale Serve (nội bộ Tailnet) hoặc Funnel (ra Internet công cộng) kèm chứng chỉ bảo mật HTTPS hợp lệ cho Home Assistant."
  share_on_port:
    name: "Cổng chia sẻ (Share on port)"
    description: "Chỉ định cổng HTTPS sử dụng cho tính năng Serve hoặc Funnel. Chỉ hỗ trợ các cổng 443, 8443 và 10000."
  snat_subnet_routes:
    name: "Bật Source NAT cho Subnet Routes"
    description: "Giúp các thiết bị trong mạng LAN thấy lưu lượng đi tới từ chính địa chỉ của Pi 5, giúp định tuyến đơn giản mà không cần cấu hình thêm trên Router. Mặc định bật."
  stateful_filtering:
    name: "Lọc gói tin theo trạng thái (Stateful packet filtering)"
    description: "Chỉ cho phép các gói tin phản hồi từ những kết nối đã được khởi tạo trước đó trên các nút chuyển tiếp (Exit Node, Subnet Router). Mặc định tắt."
  taildrive:
    name: "Chia sẻ thư mục qua Taildrive"
    description: "Cho phép chia sẻ các thư mục của Home Assistant với các thiết bị khác trên mạng Tailnet thông qua Taildrive."
    fields:
      addons:
        name: "addons"
        description: "Chia sẻ thư mục chứa các tiện ích bổ sung cục bộ (local add-ons)."
      addon_configs:
        name: "addon_configs"
        description: "Chia sẻ thư mục cấu hình của các tiện ích bổ sung (addon_configs)."
      backup:
        name: "backup"
        description: "Chia sẻ thư mục sao lưu (backup)."
      config:
        name: "config"
        description: "Chia sẻ thư mục cấu hình gốc của Home Assistant (config)."
      media:
        name: "media"
        description: "Chia sẻ thư mục đa phương tiện (media)."
      share:
        name: "share"
        description: "Chia sẻ thư mục dùng chung (share)."
      ssl:
        name: "ssl"
        description: "Chia sẻ thư mục chứng chỉ bảo mật (ssl)."
  taildrop:
    name: "Nhận tệp qua Taildrop"
    description: "Bật dịch vụ nhận tệp nhanh Taildrop từ các thiết bị khác trong Tailnet (Tệp nhận được sẽ tự động lưu vào thư mục /share/taildrop). Mặc định tắt."
  userspace_networking:
    name: "Chế độ mạng Userspace"
    description: "Khi bật, Tailscale sẽ không tạo card mạng ảo 'tailscale0' trên máy chủ (chỉ cho phép truy cập một chiều từ Tailnet vào Home Assistant). Mặc định tắt."
  extra_args:
    name: "Tham số bổ sung (Extra arguments)"
    description: "Các cờ lệnh nâng cao truyền thêm vào 'tailscale up'. Chỉ dành cho người dùng nâng cao."
