configuration:
  auth_key:
    name: "Auth Key (tskey-auth-...)"
    description: "Authentication key from Tailscale Admin Console for headless login (leave blank to log in via Web UI)."
  hostname:
    name: "Device Hostname"
    description: "The machine name shown on your Tailscale Admin Console."
  advertise_exit_node:
    name: "Advertise as Exit Node"
    description: "Allow routing all remote internet traffic through your home network."
  advertise_routes:
    name: "Advertise Subnet Routes (LAN)"
    description: "Local IP subnets to expose to your Tailnet (e.g., 192.168.68.0/24)."
  accept_routes:
    name: "Accept Subnet Routes"
    description: "Accept subnet routes advertised by other nodes on your Tailnet."
  accept_dns:
    name: "Accept MagicDNS"
    description: "Keep OFF (false) on Home Assistant to prevent local DNS resolution loops or slowdowns."
  enable_ssh:
    name: "Tailscale SSH"
    description: "Enable SSH access to the container managed via Tailscale authentication."
  snat_subnet_routes:
    name: "SNAT Subnet Routes"
    description: "Keep ON (true) so LAN devices respond back to the Pi 5 properly without configuring static routes on your Deco router."
  extra_args:
    name: "Extra CLI Flags"
    description: "Additional optional flags passed to 'tailscale up' (e.g., --stateful-filtering=false)."
