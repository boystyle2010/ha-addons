name: "Tailscale Pro"
description: "High-stability, upstream-synced Tailscale mesh VPN & Subnet Router with full UI"
version: "1.104.4"
slug: "tailscale_pro"
init: false
arch:
  - aarch64
  - amd64
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_MODULE
devices:
  - /dev/net/tun
ingress: true
ingress_port: 5252
watchdog: "tcp://[HOST]:5252"
panel_icon: mdi:vpn
panel_title: "Tailscale Pro"
map:
  - config:rw
options:
  auth_key: ""
  hostname: "hass-pi5-pro"
  advertise_exit_node: true
  advertise_routes:
    - "192.168.68.0/24"
  accept_routes: false
  accept_dns: false
  enable_ssh: false
  snat_subnet_routes: true
  extra_args: ""
schema:
  auth_key: password?
  hostname: str
  advertise_exit_node: bool
  advertise_routes:
    - str
  accept_routes: bool
  accept_dns: bool
  enable_ssh: bool
  snat_subnet_routes: bool
  extra_args: str?

