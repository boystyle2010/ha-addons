name: "Tailscale Pro"
description: "Zero-config mesh VPN, subnet router and exit node with a built-in health monitor"
version: "1.104.4.2"
slug: "tailscale_pro"
url: "https://github.com/boystyle2010/ha-addons/tree/main/tailscale"
stage: stable
startup: services
boot: auto
apparmor: true
init: false
arch:
  - aarch64
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_MODULE
devices:
  - /dev/net/tun
ingress: true
ingress_port: 5252
watchdog: "tcp://[HOST]:5252"
panel_icon: mdi:vpn
panel_title: "Tailscale Pro"
map:
  - config:rw
options:
  auth_key: ""
  hostname: "hass-pi5-pro"
  login_server: "https://controlplane.tailscale.com"
  accept_dns: false
  accept_routes: false
  advertise_exit_node: true
  advertise_connector: false
  advertise_routes:
    - "192.168.68.0/24"
  advertise_tags: []
  exit_node: ""
  always_use_derp: false
  enable_ssh: false
  snat_subnet_routes: true
  stateful_filtering: false
  userspace_networking: false
  log_upload: false
  share_homeassistant: "disabled"
  share_on_port: 443
  extra_args: ""
schema:
  auth_key: password?
  hostname: str
  login_server: str
  accept_dns: bool
  accept_routes: bool
  advertise_exit_node: bool
  advertise_connector: bool
  advertise_routes:
    - str
  advertise_tags:
    - str
  exit_node: str?
  always_use_derp: bool
  enable_ssh: bool
  snat_subnet_routes: bool
  stateful_filtering: bool
  userspace_networking: bool
  log_upload: bool
  share_homeassistant: list(disabled|serve|funnel)
  share_on_port: port
  extra_args: str?
