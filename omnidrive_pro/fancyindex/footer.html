  function injectTopBarAndFixHassBg() {

          var el = nodes[i];

            }
          }
        }
        var all = root.querySelectorAll ? root.querySelectorAll('*') : [];

  function renderMinimap() {
    if (!aceEditor || !minimapEnabled || !minimapWrap.classList.contains('show')) return;
    var rect = minimapWrap.getBoundingClientRect();
    if (rect.height <= 0) return;
    minimapCanvas.width = 58;
    minimapCanvas.height = rect.height;
    var ctx = minimapCanvas.getContext('2d');
    ctx.clearRect(0, 0, 58, rect.height);
    var lines = aceEditor.session.getDocument().getAllLines();
    var total = Math.max(lines.length, 1);
    var step = Math.max(2, Math.min(4, rect.height / total));
    for (var i = 0; i < lines.length; i++) {
      var y = i * step;
      if (y > rect.height) break;
      var ln = lines[i];
      if (!ln || !ln.trim()) continue;
      var indent = ln.search(/\S|$/);
      var len = Math.min(48, Math.ceil((ln.length - indent) * 0.65));
      var trimmed = ln.trim();
      ctx.fillStyle = trimmed.indexOf('#') === 0 ? '#484f58' : (trimmed.indexOf(':') !== -1 ? '#58a6ff' : '#8b949e');
      ctx.fillRect(Math.min(18, 4 + indent * 1.5), y, Math.max(4, len), Math.max(1.2, step - 0.8));
    }
    var firstVis = aceEditor.getFirstVisibleRow();
    var lastVis = aceEditor.getLastVisibleRow();
    var vpTop = Math.min(rect.height - 20, (firstVis / total) * rect.height);
    var vpH = Math.max(20, ((lastVis - firstVis + 1) / total) * rect.height);
    minimapVp.style.top = vpTop + 'px';
    minimapVp.style.height = Math.min(rect.height, vpH) + 'px';
  }

          edPreview.innerHTML = '<div class="arch-list">' + (items.join('') || '<div class="arch-item">Empty archive</div>') + '</div>';
        });
      } else {
        var view = new Uint8Array(buf), pos = 0, items = [];
        while (pos + 512 <= view.length && items.length < 300) {
          var name = '';
          for (var i = 0; i < 100 && view[pos + i] !== 0; i++) name += String.fromCharCode(view[pos + i]);
          if (!name) break;
          var sizeOct = '';
          for (var j = 124; j < 136 && view[pos + j] !== 0 && view[pos + j] !== 32; j++) sizeOct += String.fromCharCode(view[pos + j]);
          var size = parseInt(sizeOct, 8) || 0;
          items.push('<div class="arch-item"><span>' + esc(name) + '</span><span>' + (size ? (size / 1024).toFixed(1) + ' KB' : '') + '</span></div>');
          pos += 512 + Math.ceil(size / 512) * 512;
        }
        edPreview.innerHTML = '<div class="arch-list">' + (items.join('') || '<div class="arch-item">Compressed TAR archive — Download to extract</div>') + '</div>';
      }
    }).catch(function (e) { edPreview.innerHTML = '<div style="color:var(--red)">Could not inspect archive: ' + esc(e.message) + '</div>'; });
  }

      var R = 70, C = 2 * Math.PI * R, offset = 0;
      var circles = '', legend = '';

  var fileInput = document.getElementById('fileInput'), uploadProg = document.getElementById('uploadProg'), uploadText = document.getElementById('uploadText'), progBar = document.getElementById('progBar');
  function uploadFileList(files) {
    if (!files || !files.length) return;
    uploadProg.classList.add('show'); var idx = 0;
    function next() {
      if (idx >= files.length) { showToast('Uploaded ' + files.length + ' file(s)!'); setTimeout(function () { location.reload(); }, 400); return; }
      var f = files[idx++], xhr = new XMLHttpRequest();
      xhr.open('PUT', buildWebdavUrl(encodeURIComponent(f.name)), true);
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) { var pct = Math.round((e.loaded / e.total) * 100); uploadText.textContent = 'Uploading ' + f.name + ' (' + pct + '%)'; progBar.style.width = pct + '%'; }
      };
      xhr.onload = next; xhr.onerror = function () { showToast('Failed uploading ' + f.name); next(); };
      xhr.send(f);
    }
    next();
  }

  });

  // 10. Search, Sort & Grid/List View
  var qInput = document.getElementById('q'), clearBtn = document.getElementById('clearBtn'), emptyEl = document.getElementById('empty');
  function filterRows() {
    var v = qInput.value.trim().toLowerCase(); clearBtn.classList.toggle('show', v.length > 0); var c = 0;
    rows.forEach(function (tr) { var n = tr.getAttribute('data-n'); if (n === null) return; var m = !v || n.indexOf(v) !== -1; tr.style.display = m ? '' : 'none'; if (m) c++; });
    emptyEl.classList.toggle('show', c === 0 && (nd + nf) > 0);
  }
  qInput.addEventListener('input', filterRows);
  clearBtn.addEventListener('click', function () { qInput.value = ''; filterRows(); qInput.focus(); });

  var s = document.getElementById('sort'), cur = location.search.replace(/^\?/, '');
  if (cur) for (var i = 0; i < s.options.length; i++) if (s.options[i].value === cur) s.selectedIndex = i;
  s.addEventListener('change', function () { location.search = '?' + this.value; });

  var viewBtn = document.getElementById('viewBtn'), viewIcon = document.getElementById('viewIcon');
  var gridSvg = '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>';
  var listSvg = '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>';
  function applyView(mode) { var g = mode === 'grid'; document.body.classList.toggle('grid-mode', g); viewIcon.innerHTML = g ? listSvg : gridSvg; }
  var savedView = localStorage.getItem('wpro_view') || 'list'; applyView(savedView);
  viewBtn.addEventListener('click', function () { savedView = document.body.classList.contains('grid-mode') ? 'list' : 'grid'; localStorage.setItem('wpro_view', savedView); applyView(savedView); });
})();
</script>
