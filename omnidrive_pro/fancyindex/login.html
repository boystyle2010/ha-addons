<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1933">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sign In • OmniDrive Pro</title>
<link rel="icon" type="image/png" href="/.fancyindex/icon.png">
<link rel="apple-touch-icon" href="/.fancyindex/apple-touch-icon.png">
<style>
:root {
  --bg:#0b1933; --card:rgba(24,28,38,.74); --input:rgba(38,44,58,.82);
  --sep:rgba(255,255,255,.1); --text:#fff; --muted:#94a3b8;
  --blue:#0a84ff; --green:#30d158; --red:#ff453a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;width:100%;min-height:100%;
  background-color:#0b1933!important;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
body{
  min-height:100vh;min-height:100dvh;display:grid;place-items:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
  position:relative;z-index:1;
}
.ambient-bg{
  position:fixed;top:-120px;left:-120px;right:-120px;bottom:-120px;
  z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 50% 8%,rgba(14,165,233,.32),transparent 60%),
    radial-gradient(circle at 18% 35%,rgba(10,132,255,.28),transparent 58%),
    radial-gradient(circle at 82% 85%,rgba(139,92,246,.32),transparent 60%),
    radial-gradient(circle at 50% 100%,rgba(30,58,138,.45),transparent 65%),
    linear-gradient(180deg,#0b1933 0%,#0d1f42 50%,#12163b 100%);
  transform:translateZ(0);-webkit-transform:translateZ(0);
}
.login-card{
  width:100%;max-width:390px;background:var(--card);
  -webkit-backdrop-filter:saturate(190%) blur(28px);backdrop-filter:saturate(190%) blur(28px);
  border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:30px 24px 26px;
  box-shadow:0 24px 60px rgba(0,0,0,.65);text-align:center;
  animation:popIn .32s cubic-bezier(.2,.9,.3,1);
}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.logo-wrap{
  width:68px;height:68px;margin:0 auto 16px;border-radius:18px;
  background:linear-gradient(145deg,#0f172a,#1e293b);border:1px solid rgba(56,189,248,.5);
  box-shadow:0 10px 28px rgba(10,132,255,.32);display:grid;place-items:center;
}
.logo-wrap svg{width:38px;height:38px}
h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.02em}
.host-pill{
  display:inline-flex;align-items:center;gap:5px;margin:7px 0 22px;padding:4px 11px;
  border-radius:12px;background:rgba(10,132,255,.16);border:.5px solid rgba(56,189,248,.38);
  color:#5ac8fa;font-size:12px;font-weight:600;
}
.field-group{text-align:left;margin-bottom:14px}
.field-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px 4px;text-transform:uppercase;letter-spacing:.04em}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap svg.ic-left{position:absolute;left:13px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.inp{
  width:100%;height:46px;padding:0 42px 0 40px;border-radius:13px;border:1px solid rgba(255,255,255,.1);
  background:var(--input);color:var(--text);font-size:16px;outline:none;transition:border-color .15s,background .15s;
}
.inp:focus{border-color:var(--blue);background:rgba(48,56,74,.95)}
.eye-btn{
  position:absolute;right:8px;width:32px;height:32px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;
}
.eye-btn svg{width:18px;height:18px}
.rem-row{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 18px;font-size:13.5px;color:var(--muted)}
.rem-row label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:#e5e5ea}
.rem-row input{width:17px;height:17px;accent-color:var(--blue)}
.err-box{
  display:none;margin-bottom:14px;padding:10px 12px;border-radius:11px;
  background:rgba(255,69,58,.16);border:.5px solid var(--red);color:#ff6961;font-size:13px;font-weight:500;
}
.err-box.show{display:block}
.btn-submit{
  width:100%;height:48px;border:0;border-radius:14px;background:var(--blue);color:#fff;
  font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(10,132,255,.38);
  transition:transform .12s,opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-submit:active{transform:scale(.98)}
.btn-submit:disabled{opacity:.55}
.proto-foot{
  margin-top:20px;padding-top:15px;border-top:.5px solid var(--sep);
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
}
.proto-badge{font-size:11px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.06);padding:3px 8px;border-radius:6px}
</style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="login-card">
    <div class="logo-wrap">
      <svg viewBox="0 0 36 36" fill="none">
        <circle cx="18" cy="18" r="14" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="3 2.5" stroke-opacity="0.75"/>
        <circle cx="18" cy="4" r="2" fill="#38bdf8"/>
        <circle cx="32" cy="18" r="2" fill="#30d158"/>
        <circle cx="18" cy="32" r="2" fill="#a855f7"/>
        <circle cx="4" cy="18" r="2" fill="#ff9f0a"/>
        <rect x="9.5" y="10.5" width="17" height="6.5" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
        <circle cx="12.8" cy="13.7" r="1" fill="#30d158"/>
        <line x1="16" y1="13.7" x2="23" y2="13.7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="9.5" y="19" width="17" height="6.5" rx="2" fill="#0f172a" stroke="#0a84ff" stroke-width="1.8"/>
        <circle cx="12.8" cy="22.2" r="1" fill="#38bdf8"/>
        <line x1="16" y1="22.2" x2="23" y2="22.2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>OmniDrive Pro</h1>
    <div class="host-pill">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span id="hostLabel">Home Assistant Storage Gateway</span>
    </div>

    <div id="errBox" class="err-box">Invalid username or password</div>

    <form id="loginForm">
      <div class="field-group">
        <span class="field-label">Username</span>
        <div class="input-wrap">
          <svg class="ic-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="inpUser" class="inp" type="text" placeholder="Enter username" autocomplete="username" required autofocus>
        </div>
      </div>

      <div class="field-group">
        <span class="field-label">Password</span>
        <div class="input-wrap">
          <svg class="ic-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="inpPass" class="inp" type="password" placeholder="Enter password" autocomplete="current-password" required>
          <button id="btnEye" class="eye-btn" type="button" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="rem-row">
        <label><input id="inpRem" type="checkbox" checked> Keep me signed in (30 days)</label>
      </div>

      <button id="btnSubmit" class="btn-submit" type="submit">
        <span>Sign In</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>

    <div class="proto-foot">
      <span class="proto-badge">WebDAV</span>
      <span class="proto-badge">SMB / Samba</span>
      <span class="proto-badge">SFTP</span>
      <span class="proto-badge">FTP</span>
    </div>
  </div>

<script>
(function () {
  document.getElementById('hostLabel').textContent = location.host || 'Protected Gateway';
  var inpPass = document.getElementById('inpPass');
  document.getElementById('btnEye').addEventListener('click', function () {
    inpPass.type = inpPass.type === 'password' ? 'text' : 'password';
  });

  var form = document.getElementById('loginForm'), errBox = document.getElementById('errBox'), btn = document.getElementById('btnSubmit');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errBox.classList.remove('show');
    btn.disabled = true;
    btn.querySelector('span').textContent = 'Signing in...';

    fetch('/__wpro_api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-WPro-CSRF': '1' },
      body: JSON.stringify({
        username: document.getElementById('inpUser').value.trim(),
        password: inpPass.value,
        remember: document.getElementById('inpRem').checked
      })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res && res.ok) {
        var params = new URLSearchParams(location.search);
        location.replace(params.get('rd') || '/');
      } else {
        errBox.textContent = (res && res.error) || 'Invalid username or password';
        errBox.classList.add('show');
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Sign In';
      }
    }).catch(function () {
      errBox.textContent = 'Connection error. Please try again.';
      errBox.classList.add('show');
      btn.disabled = false;
      btn.querySelector('span').textContent = 'Sign In';
    });
  });
})();
</script>
</body>
</html>
