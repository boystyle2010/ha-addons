configuration:
  unified_root:
    name: Gom tất cả vào 1 đường dẫn gốc (Unified Root)
    description: Khi bật, bạn chỉ cần kết nối vào địa chỉ gốc "/" là thấy toàn bộ các thư mục (config, addon_configs, addons, backup, media, share, ssl) và di chuyển file qua lại giữa chúng.
  smb_enabled:
    name: Kích hoạt giao thức SMB / Samba (Cổng 445)
    description: Cho phép gắn ổ đĩa mạng trực tiếp vào ứng dụng Tệp (Files) gốc của iPhone/iPad, macOS Finder (smb://), Windows Explorer (\\\\ip\\) và phát video trực tiếp lên Infuse / VLC.
  sftp_enabled:
    name: Kích hoạt giao thức SFTP (Cổng 2222)
    description: Bật truyền tải file mã hóa qua giao thức SSH (SFTP) chuyên dụng cho FileZilla, Cyberduck, WinSCP, Termius và FE File Explorer.
  ftp_enabled:
    name: Kích hoạt giao thức FTP (Cổng 2121)
    description: Bật máy chủ FTP tiêu chuẩn tốc độ cao trong mạng LAN (kèm dải cổng Passive 21000–21002) cho các thiết bị mạng, camera hoặc ứng dụng quản lý file cổ điển.
  ssl:
    name: Kích hoạt SSL (HTTPS)
    description: Bật mã hóa trực tiếp bằng chứng chỉ trong thư mục /ssl (Đặt là Tắt nếu bạn dùng qua Cloudflare Tunnel hoặc Reverse Proxy).
  certfile:
    name: File chứng chỉ (Certificate)
    description: Tên file chứng chỉ nằm trong thư mục /ssl (mặc định là fullchain.pem).
  keyfile:
    name: File khóa riêng (Private Key)
    description: Tên file khóa riêng nằm trong thư mục /ssl (mặc định là privkey.pem).
  max_upload_size:
    name: Giới hạn dung lượng tải lên tối đa
    description: Đặt là "0" để không giới hạn dung lượng (hỗ trợ tải file Backup nhiều GB), hoặc điền ví dụ "5G".
  fancy_ui:
    name: Giao diện iOS Dark Web UI & Cloud IDE
    description: Hiển thị giao diện duyệt file chuẩn iOS kèm trình sửa code Ace IDE, Web Terminal, biểu đồ dung lượng ổ đĩa và tạo link chia sẻ nhanh.
  show_dotfiles:
    name: Hiển thị file ẩn (Dotfiles)
    description: Cho phép nhìn thấy và chỉnh sửa các thư mục ẩn như .storage, .cloud, .git trong Home Assistant.
  log_level:
    name: Mức độ ghi nhật ký (Log Level)
    description: Độ chi tiết của log hệ thống.
  root_access:
    name: Quyền Root (Root Access)
    description: Khi bật, các tác vụ file (như nén, xoá) sẽ chạy dưới quyền root. Khi tắt, chạy dưới quyền user thường.
  enable_terminal:
    name: Kích hoạt Web Terminal
    description: Cho phép chạy các lệnh shell ẩn trong giao diện web (Chỉ bật nếu bạn tin tưởng thiết bị truy cập).
  lock_root:
    name: Khoá thư mục gốc (Root Lock)
    description: Ngăn chặn việc vô tình tạo hoặc xoá file ngay tại thư mục gốc (Bắt buộc phải vào bên trong thư mục con mới được sửa).
  lan_ip:
    name: Địa chỉ IP LAN (tuỳ chọn)
    description: IP LAN của Home Assistant hiển thị trong Connect Hub cho SMB, SFTP và FTP (ví dụ 192.168.1.10). Để trống để tự động phát hiện.
  public_url:
    name: Địa chỉ WebDAV công khai (tuỳ chọn)
    description: Tên miền WebDAV hiển thị trong Connect Hub, ví dụ https://drive.example.com (Cloudflare Tunnel hoặc Reverse Proxy). Để trống để dùng địa chỉ đang truy cập.
  ftp_pasv_address:
    name: Địa chỉ FTP Passive (tuỳ chọn)
    description: IP LAN báo cho FTP client ở chế độ Passive (ví dụ 192.168.1.10). Để trống để dùng IP LAN tự phát hiện. Nếu sai, FTP client có thể bị treo khi liệt kê thư mục.
  ftp_tls:
    name: Mã hoá FTP (FTPS)
    description: "optional = mã hoá khi client yêu cầu, FTP thường vẫn dùng được. required = từ chối FTP không mã hoá. off = không mã hoá. Chứng chỉ được tạo tự động (hoặc lấy từ /ssl)."
  trusted_proxies:
    name: Proxy tin cậy (IP thật của client)
    description: IP hoặc dải IP (cách nhau bằng dấu phẩy) của reverse proxy hoặc Cloudflare Tunnel đi vào cổng 8090, để nhật ký, giới hạn tốc độ và khoá đăng nhập dùng IP thật của client. Điền "none" để tắt.
  share_zip_max_mb:
    name: Dung lượng thư mục tối đa khi chia sẻ dạng zip (MB)
    description: Thư mục lớn nhất được phép tải xuống dạng zip qua link chia sẻ.
  users:
    name: Danh sách tài khoản (Users)
    description: Khai báo tài khoản và mật khẩu dùng chung cho tất cả giao thức (Web UI, WebDAV, SMB, SFTP và FTP).
  shares:
    name: Danh sách thư mục hệ thống (Shares)
    description: Các phân vùng của Home Assistant được chia sẻ qua OmniDrive Pro.
network:
  8090/tcp: Cổng Web UI, WebDAV Server & Link chia sẻ tạm thời
  445/tcp: Cổng SMB / Samba Server (iOS Files, macOS Finder, Windows)
  2222/tcp: Cổng SFTP Server (Truyền file bảo mật qua SSH)
  2121/tcp: Cổng điều khiển FTP Server
  21000/tcp: Cổng dữ liệu FTP Passive 1
  21001/tcp: Cổng dữ liệu FTP Passive 2
  21002/tcp: Cổng dữ liệu FTP Passive 3
