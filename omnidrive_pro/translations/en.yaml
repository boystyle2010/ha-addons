configuration:
  unified_root:
    name: Unified Root Directory
    description: When enabled, mounts all shares under a single root path "/" so you can browse and move files across all Home Assistant directories (config, addon_configs, addons, backup, media, share, ssl) from a single connection. Disable this if you want per-folder Read-Only or per-user access control.
  ssl:
    name: Enable SSL (HTTPS)
    description: Encrypt WebDAV connections using SSL certificates from the /ssl directory (Keep disabled if routing through Cloudflare Tunnel or a Reverse Proxy).
  certfile:
    name: Certificate File
    description: Certificate file name located in /ssl (default is fullchain.pem).
  keyfile:
    name: Private Key File
    description: Private key file name located in /ssl (default is privkey.pem).
  max_upload_size:
    name: Maximum Upload Size
    description: Set to "0" for unlimited file upload size (recommended for large Home Assistant backups), or specify a limit like "5G" or "500M".
  fancy_ui:
    name: FancyIndex Dark Web UI
    description: Enables a modern dark-mode web directory browser with instant search when accessed via a web browser or the Home Assistant Ingress sidebar.
  show_dotfiles:
    name: Show Hidden Files (Dotfiles)
    description: Allows viewing and editing hidden files and folders starting with a dot (e.g., .storage, .cloud).
  log_level:
    name: Log Level
    description: Controls the verbosity of Nginx server logs.
  users:
    name: User Accounts
    description: List of usernames and passwords authorized to connect to the WebDAV server (hashed with Bcrypt).
  shares:
    name: Shared Directories
    description: Configure Home Assistant system directories exposed via WebDAV, including read-only mode and allowed users per share.
network:
  8080/tcp: WebDAV Server Port (HTTP/HTTPS)
