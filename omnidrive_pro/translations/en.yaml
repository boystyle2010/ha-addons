configuration:
  unified_root:
    name: Unified Root Directory
    description: Mounts all shares under a single root path "/" so you can browse and move files across all Home Assistant directories (config, addon_configs, addons, backup, media, share, ssl) from a single connection.
  smb_enabled:
    name: Enable SMB / Samba Server (Port 445)
    description: Enables native network drive mounting on iOS Files ("Connect to Server"), macOS Finder (smb://), Windows Explorer (\\\\ip\\), and media players like Infuse or VLC.
  sftp_enabled:
    name: Enable SFTP Server (Port 2222)
    description: Enables encrypted SSH File Transfer Protocol for pro clients such as FileZilla, Cyberduck, Transmit, WinSCP, Termius, and FE File Explorer.
  ftp_enabled:
    name: Enable FTP Server (Port 2121)
    description: Enables standard high-speed FTP file transfers (with Passive ports 21000–21002) for legacy apps, network scanners, and cameras.
  ssl:
    name: Enable SSL (HTTPS)
    description: Encrypt WebDAV and Web UI connections using SSL certificates from the /ssl directory (Keep disabled if routing through Cloudflare Tunnel or a Reverse Proxy).
  certfile:
    name: Certificate File
    description: Certificate file name located in /ssl (default is fullchain.pem).
  keyfile:
    name: Private Key File
    description: Private key file name located in /ssl (default is privkey.pem).
  max_upload_size:
    name: Maximum Upload Size
    description: Set to "0" for unlimited file upload size (recommended for large Home Assistant backups), or specify a limit like "5G" or "500M".
  fancy_ui:
    name: iOS Dark Web UI & Cloud IDE
    description: Enables the modern iOS Dark UI with built-in Ace Code Editor, Web Terminal, Disk Analytics, and Share Links when accessed via browser or Home Assistant Ingress.
  show_dotfiles:
    name: Show Hidden Files (Dotfiles)
    description: Allows viewing and editing hidden files and folders starting with a dot (e.g., .storage, .cloud, .git).
  log_level:
    name: Log Level
    description: Controls the verbosity of server logs.
  root_access:
    name: Root Access
    description: If enabled, file operations run as root. If disabled, runs as the default user.
  enable_terminal:
    name: Enable Web Terminal
    description: Allows running shell commands as root inside the container via the Web UI.
  lock_root:
    name: Lock Root Directory
    description: Prevents creating or deleting files directly in the root directory to avoid accidental modifications.
  lan_ip:
    name: LAN IP Address (optional)
    description: Home Assistant LAN IP shown in the Connect Hub for SMB, SFTP and FTP (e.g. 192.168.1.10). Leave empty to auto-detect.
  public_url:
    name: Public WebDAV URL (optional)
    description: WebDAV address shown in the Connect Hub, e.g. https://drive.example.com (Cloudflare Tunnel or Reverse Proxy). Leave empty to use the address you are currently browsing from.
  ftp_pasv_address:
    name: FTP Passive Address (optional)
    description: LAN IP announced to FTP clients in passive mode (e.g. 192.168.1.10). Leave empty to use the detected LAN IP. Without a correct address FTP clients may hang when listing folders.
  ftp_tls:
    name: FTP Encryption (FTPS)
    description: "optional = encrypted when the client asks for it, plain FTP still works. required = plain FTP is refused. off = no encryption. The certificate is generated automatically (or taken from /ssl)."
  trusted_proxies:
    name: Trusted Proxies (Real Client IP)
    description: IPs or subnets (comma-separated) of your reverse proxy or Cloudflare Tunnel on port 8090, so the real client IP is used in the audit log, rate limiting and login lockout. Use "none" to disable.
  share_zip_max_mb:
    name: Max Folder Size for Share Zip (MB)
    description: Largest folder that can be downloaded as a zip through a share link.
  users:
    name: User Accounts
    description: "Accounts shared by all protocols (Web UI, WebDAV, SMB, SFTP, FTP). How the password field works: (1) NEW ACCOUNT: enter a password. (2) ALREADY HAS A PASSWORD (or you changed it in the Web UI): enter __KEEP__ or leave it empty: the existing password is kept and nothing is reset. (3) RESET: enter a NEW password: it replaces the current password on ALL protocols, even one changed in the Web UI. The add-on remembers the last value it applied, so the same password is not re-applied at every restart. Removing a user from this list deletes the account."
  shares:
    name: Shared Directories
    description: Configure Home Assistant system directories exposed across OmniDrive Pro, including read-only mode and allowed users per share.
network:
  8090/tcp: Web UI, WebDAV Server & Public Share Links (HTTP/HTTPS)
  445/tcp: SMB / Samba Server Port (iOS Files, macOS Finder, Windows Explorer)
  2222/tcp: SFTP Server Port (SSH File Transfer Protocol)
  2121/tcp: FTP Control Port
  21000/tcp: FTP Passive Data Port 1
  21001/tcp: FTP Passive Data Port 2
  21002/tcp: FTP Passive Data Port 3
