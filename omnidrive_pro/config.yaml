name: "OmniDrive Pro (Multi-Protocol Storage)"
version: "1.0.10"
slug: "omnidrive_pro"
description: "All-in-one Multi-Protocol Storage Hub (WebDAV, SMB/Samba, SFTP, FTP), Cloud IDE, Web Terminal, Disk Analytics & Share Links for Home Assistant."
url: "https://github.com/boystyle2010/ha-addons"
arch:
  - aarch64
  - amd64
init: false
apparmor: true
auth_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:server-network"
panel_title: "OmniDrive Pro"
watchdog: "tcp://[HOST]:[PORT:8090]"
ports:
  8090/tcp: 8090
  445/tcp: 445
  2222/tcp: 2222
  2121/tcp: 2121
  21000/tcp: 21000
  21001/tcp: 21001
  21002/tcp: 21002
ports_description:
  8090/tcp: "Web UI, WebDAV Server & Public Share Links (Cloudflare Tunnel)"
  445/tcp: "SMB / Samba Server (Native iOS Files, macOS Finder, Windows Explorer)"
  2222/tcp: "SFTP Server (SSH File Transfer Protocol - FileZilla, Cyberduck, FE File Explorer)"
  2121/tcp: "FTP Control Port (Standard FTP Clients)"
  21000/tcp: "FTP Passive Data Port 1"
  21001/tcp: "FTP Passive Data Port 2"
  21002/tcp: "FTP Passive Data Port 3"
map:
  - homeassistant_config:rw
  - all_addon_configs:rw
  - addons:rw
  - backup:rw
  - media:rw
  - share:rw
  - ssl:rw
  - data:rw
options:
  unified_root: true
  smb_enabled: true
  sftp_enabled: true
  ftp_enabled: true
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
  max_upload_size: "0"
  fancy_ui: true
  show_dotfiles: true
  log_level: "info"
  users:
    - username: "admin"
      password: "changeme_strong_password"
  shares:
    - name: "config"
      path: "/homeassistant"
      read_only: false
      allowed_users: []
    - name: "addon_configs"
      path: "/addon_configs"
      read_only: false
      allowed_users: []
    - name: "addons"
      path: "/addons"
      read_only: false
      allowed_users: []
    - name: "backup"
      path: "/backup"
      read_only: false
      allowed_users: []
    - name: "media"
      path: "/media"
      read_only: false
      allowed_users: []
    - name: "share"
      path: "/share"
      read_only: false
      allowed_users: []
    - name: "ssl"
      path: "/ssl"
      read_only: false
      allowed_users: []
schema:
  unified_root: bool
  smb_enabled: bool
  sftp_enabled: bool
  ftp_enabled: bool
  ssl: bool
  certfile: str
  keyfile: str
  max_upload_size: str
  fancy_ui: bool
  show_dotfiles: bool
  log_level: list(debug|info|notice|warn|error)
  users:
    - username: str
      password: password
  shares:
    - name: match(^[a-zA-Z0-9_-]+$)
      path: str
      read_only: bool
      allowed_users:
        - str?
