name: Auto Check Tailscale & Alpine Base (Verified)

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tailscale/**"
      - ".github/workflows/update-tailscale.yml"

permissions:
  contents: write

jobs:
  update-tailscale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Latest Tailscale Release & Force Sync
        run: |
          echo "1. Đang lấy phiên bản mới nhất từ Tailscale GitHub API..."
          LATEST_TAG=$(curl -sfL https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r '.tag_name')
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
            echo "❌ Không lấy được tag từ GitHub API."
            exit 1
          fi
          
          CLEAN_VER="${LATEST_TAG#v}"
          echo "📌 Phiên bản mới nhất từ hãng: $CLEAN_VER ($LATEST_TAG)"

          # Lấy phiên bản Alpine Base mới nhất
          CURRENT_BASE=$(grep -m 1 'aarch64-base:' tailscale/Dockerfile | awk -F':' '{print $2}' | tr -d '[:space:]' || echo "3.20")
          LATEST_BASE=$(curl -sfL https://api.github.com/repos/home-assistant/docker-base/releases/latest | jq -r '.tag_name' || echo "$CURRENT_BASE")
          if [[ ! "$LATEST_BASE" =~ ^[0-9]+\.[0-9]+$ ]]; then
            LATEST_BASE="$CURRENT_BASE"
          fi

          echo "2. Đang tiến hành cập nhật tệp config.yaml và Dockerfile..."
          sed -i "s|ARG BUILD_FROM=.*|ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:${LATEST_BASE}|g" tailscale/Dockerfile
          sed -i "s|ARG TAILSCALE_VERSION=.*|ARG TAILSCALE_VERSION=${LATEST_TAG}|g" tailscale/Dockerfile
          sed -i "s|^version:.*|version: \"${CLEAN_VER}\"|g" tailscale/config.yaml

      - name: Commit and Push Update
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git reset --hard HEAD
          git pull --rebase origin main
          git add tailscale/Dockerfile tailscale/config.yaml
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(tailscale): sync to latest release"
            git push
            echo "🎉 Đã commit và đẩy phiên bản mới thành công lên GitHub!"
          else
            echo "✨ Tệp cấu hình đã khớp phiên bản."
          fi
