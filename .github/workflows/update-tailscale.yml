name: Auto Check Tailscale & Alpine Base (Verified)

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tailscale/**"
      - ".github/workflows/update-tailscale.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: update-tailscale
  cancel-in-progress: false

jobs:
  update-tailscale:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 1. Khởi tạo script trích xuất Changelog chuyên nghiệp (Khử trùng lặp + Lọc hệ điều hành)
      # ------------------------------------------------------------------
      - name: Prepare Smart Changelog Extractor & Sync Add-on Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D="tailscale"
          mkdir -p "$D"
          VER=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' "$D/config.yaml" || echo "1.0.1")
          CUR_TAG=$(grep -oP '^ARG TAILSCALE_VERSION=\K\S+' "$D/Dockerfile" || echo "v1.104.5")
          CUR_TS="${CUR_TAG#v}"
          CUR_ALPINE=$(grep -oP '^FROM ghcr.io/home-assistant/base:\K[0-9.]+' "$D/Dockerfile" || echo "3.24")

          # Đảm bảo config.yaml luôn có trường image để HASS tải package có sẵn không cần build
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if ! grep -q '^image:' "$D/config.yaml"; then
            sed -i "/^slug:/a image: \"ghcr.io/${OWNER_LC}/tailscale_pro-{arch}\"" "$D/config.yaml"
          fi

          # Tải trang changelog chính thức của Tailscale
          curl -sfL -A "Mozilla/5.0" "https://tailscale.com/changelog" -o /tmp/ts_changelog.html || true

          # Tạo bộ xử lý Python: Khử trùng lặp 100%, lọc bỏ Windows/macOS/iOS, lấy SHA256 arm64 & amd64
          cat > /tmp/extract_ts.py <<'PY'
          import sys, os, re, html, json, urllib.request

          ver = sys.argv[1].lstrip('v')
          prev_ver = sys.argv[2].lstrip('v') if len(sys.argv) > 2 else ""

          bullets = []
          seen = set()

          ignore_os_patterns = [
              r'\bwindows\s+\.exe\b',
              r'\bwindows\s+installer\b',
              r'\bmacos\s+app\s+store\b',
              r'\bapple\s+tv\b',
              r'\btvos\b',
              r'\bios\s+only\b',
              r'\bandroid\s+tv\b',
              r'\bupdate\s+instructions\b'
          ]

          def is_relevant(text):
              low = text.lower()
              for pat in ignore_os_patterns:
                  if re.search(pat, low):
                      return False
              return True

          def normalize_key(text):
              return re.sub(r'[^a-z0-9]+', '', text.lower())

          # 1. Quét từ trang https://tailscale.com/changelog
          try:
              raw = open("/tmp/ts_changelog.html", encoding="utf-8", errors="ignore").read()
              pattern = re.compile(
                  rf'Tailscale\s+v?{re.escape(ver)}\b(.*?)(?=Tailscale\s+v?[0-9]+\.[0-9]+\.[0-9]+\b|\Z)',
                  re.S | re.I
              )
              m = pattern.search(raw)
              if m:
                  section = m.group(1)
                  li_items = re.findall(r'<li[^>]*>(.*?)</li>', section, re.S | re.I)
                  for item in li_items:
                      txt = re.sub(r'<[^>]+>', ' ', item)
                      txt = html.unescape(re.sub(r'\s+', ' ', txt).strip())
                      if not txt or not is_relevant(txt):
                          continue
                      key = normalize_key(txt)
                      if key and key not in seen:
                          seen.add(key)
                          bullets.append(f"- {txt}")
          except Exception:
              pass

          # 2. Fallback: Quét trực tiếp từ GitHub Compare Commits API nếu trang web chưa cập nhật
          if not bullets and prev_ver and prev_ver != ver:
              try:
                  url = f"https://api.github.com/repos/tailscale/tailscale/compare/v{prev_ver}...v{ver}"
                  req = urllib.request.Request(url)
                  tok = os.environ.get("GH_TOKEN", "")
                  if tok:
                      req.add_header("Authorization", f"Bearer {tok}")
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      for c in reversed(data.get("commits", [])):
                          msg = c.get("commit", {}).get("message", "").splitlines()[0].strip()
                          if not msg or msg.startswith("Merge ") or not is_relevant(msg):
                              continue
                          key = normalize_key(msg)
                          if key and key not in seen:
                              seen.add(key)
                              bullets.append(f"- {msg}")
                          if len(bullets) >= 8:
                              break
              except Exception:
                  pass

          # 3. Lấy mã SHA256 thực tế của gói arm64 và amd64
          sha_vals = {}
          for arch in ("arm64", "amd64"):
              sha_vals[arch] = "Verified via pkgs.tailscale.com"
              try:
                  sha_url = f"https://pkgs.tailscale.com/stable/tailscale_{ver}_{arch}.tgz.sha256"
                  with urllib.request.urlopen(sha_url, timeout=10) as r:
                      s = r.read().decode("utf-8").strip().split()[0]
                      if len(s) == 64:
                          sha_vals[arch] = s
              except Exception:
                  pass

          if not bullets:
              bullets.append(f"- Core engine stability, networking, and security maintenance updates for Tailscale `v{ver}`.")

          print("### 🔐 Binary Integrity (aarch64 & amd64)")
          for arch in ("arm64", "amd64"):
              print(f"- **Package:** `tailscale_{ver}_{arch}.tgz`")
              print(f"- **SHA256 ({arch}):** `{sha_vals[arch]}`")
          print("")
          print(f"### 🚀 What's Changed in Tailscale v{ver}")
          print("\n".join(bullets[:10]))
          PY

          # Kiểm tra nếu CHANGELOG.md chưa có bố cục mới hoặc chưa khớp version hiện tại
          NEED_CHANGELOG=0
          FIRST_HEADER=$(grep -m1 '^## ' "$D/CHANGELOG.md" 2>/dev/null | sed 's/^## //' || echo "")
          if [ ! -f "$D/CHANGELOG.md" ]; then
            NEED_CHANGELOG=1
          elif [ "$FIRST_HEADER" != "v${VER} (Latest)" ] && [ "$FIRST_HEADER" != "${VER}" ]; then
            NEED_CHANGELOG=1
          elif ! grep -q "### 🔐 Binary Integrity" "$D/CHANGELOG.md" 2>/dev/null; then
            NEED_CHANGELOG=1
          elif ! grep -q "_amd64.tgz" "$D/CHANGELOG.md" 2>/dev/null; then
            NEED_CHANGELOG=1
          fi

          if [ "$NEED_CHANGELOG" -eq 1 ]; then
            echo "📝 Rebuilding tailscale/CHANGELOG.md with deduplicated professional layout..."
            RELEASES=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/tailscale/tailscale/releases?per_page=10")

            if [ -n "$RELEASES" ]; then
              mapfile -t TAG_LIST < <(echo "$RELEASES" | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')
              mapfile -t DATE_LIST < <(echo "$RELEASES" | jq -r '.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .published_at' | cut -d'T' -f1)

              {
                echo "# Changelog"
                echo ""
                COUNT=0
                for idx in "${!TAG_LIST[@]}"; do
                  TAG="${TAG_LIST[$idx]}"
                  V="${TAG#v}"
                  DATE="${DATE_LIST[$idx]:-$(date -u +%Y-%m-%d)}"
                  PREV_TAG="${TAG_LIST[$((idx + 1))]:-}"
                  PREV_V="${PREV_TAG#v}"

                  NOTES=$(python3 /tmp/extract_ts.py "$V" "$PREV_V")

                  if [ "$idx" -eq 0 ]; then
                    echo "## ${VER}"
                    echo "_Released: ${DATE}_"
                    echo ""
                    echo "### 📦 Component & Version Matrix"
                    echo "- **Add-on Release:** \`v${VER}\`"
                    echo "- **Tailscale Engine:** \`v${CUR_TS}\` *(arm64 & amd64 verified)*"
                    echo "- **Alpine Base Image:** \`Alpine ${CUR_ALPINE}\` *(Home Assistant official base)*"
                    echo "- **Official Links:** [GitHub Release ${CUR_TAG}](https://github.com/tailscale/tailscale/releases/tag/${CUR_TAG}) • [Official Tailscale Changelog](https://tailscale.com/changelog#client)"
                  else
                    echo "## Tailscale v${V}"
                    echo "_Released: ${DATE}_"
                    echo ""
                    echo "### 📦 Component & Version Matrix"
                    echo "- **Tailscale Engine:** \`v${V}\` *(arm64 & amd64 verified)*"
                    echo "- **Alpine Base Image:** \`Alpine ${CUR_ALPINE}\`"
                    echo "- **Official Links:** [GitHub Release ${TAG}](https://github.com/tailscale/tailscale/releases/tag/${TAG}) • [Official Tailscale Changelog](https://tailscale.com/changelog#client)"
                  fi
                  echo ""
                  echo "${NOTES}"
                  echo ""
                  echo "---"
                  echo ""

                  COUNT=$((COUNT + 1))
                  [ "$COUNT" -ge 4 ] && break
                done
              } > "$D/CHANGELOG.md"
            fi
          fi

          # Đồng bộ 6 ô màu Badges trong README.md
          if [ -f "$D/README.md" ]; then
            sed -i "s|badge/version-[^-]*-blue.svg|badge/version-${VER}-blue.svg|g" "$D/README.md"
            sed -i "s|badge/tailscale-[^-]*-0052CC.svg|badge/tailscale-${CUR_TAG}-0052CC.svg|g" "$D/README.md"
            sed -i "s|badge/alpine%20base-[^-]*-0D597F.svg|badge/alpine%20base-${CUR_ALPINE}-0D597F.svg|g" "$D/README.md"
          fi

      # ------------------------------------------------------------------
      # 2. Kiểm tra nguồn gốc nhiều tầng + Smart Versioning (PATCH / MAJOR / MANUAL PUSH)
      # ------------------------------------------------------------------
      - name: Multi-layer upstream verification
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          TS_STATUS="✅ Up to date"
          ALPINE_STATUS="✅ Up to date"
          ADDON_STATUS="✅ Up to date"

          skip() {
            echo "⏭️ $1"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "target_addon_ver=${CURRENT_VER}" >> "$GITHUB_OUTPUT"
            echo "- ⏭️ $1" >> "$GITHUB_STEP_SUMMARY"
            print_summary_table
            exit 0
          }
          fail() {
            echo "❌ $1"
            echo "- ❌ $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          pass() {
            echo "✅ $1"
            echo "- ✅ $1" >> "$GITHUB_STEP_SUMMARY"
          }
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              sleep $((i * 5))
            done
            return 1
          }
          http_ok() {
            [ "$(curl -s -o /dev/null -L -I -w '%{http_code}' --max-time 30 "$1")" = "200" ]
          }
          base_ok() {
            docker manifest inspect "ghcr.io/home-assistant/base:$2" 2>/dev/null \
              | jq -e --arg a "$1" '[.manifests[]?.platform.architecture] | index($a) != null' >/dev/null
          }
          tarball_ok() {
            local ver="${1#v}"
            for a in arm64 amd64; do
              http_ok "https://pkgs.tailscale.com/stable/tailscale_${ver}_${a}.tgz" || return 1
            done
            return 0
          }
          newer_or_equal() {
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
          }

          print_summary_table() {
            {
              echo ""
              echo "### 📊 Update Decision Summary - Tailscale Pro"
              echo ""
              echo "| Component                | Current          | Latest Verified  | Status                  |"
              echo "|--------------------------|------------------|------------------|-------------------------|"
              echo "| **Addon Version**        | \`${CURRENT_VER}\` | \`${NEW_ADDON_VER:-$CURRENT_VER}\` | $ADDON_STATUS |"
              echo "| **Tailscale Engine**     | \`${CURRENT_TS}\`  | \`${CLEAN_VER:-?}\` | $TS_STATUS |"
              echo "| **Alpine Base**          | \`${CURRENT_BASE}\`| \`${LATEST_BASE:-?}\` | $ALPINE_STATUS |"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          }

          echo "### 🔍 Verification Summary" >> "$GITHUB_STEP_SUMMARY"

          CURRENT_VER=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' tailscale/config.yaml || true)
          CURRENT_TAG=$(grep -oP '^ARG TAILSCALE_VERSION=\K\S+' tailscale/Dockerfile || true)
          CURRENT_BASE=$(grep -oP '^FROM ghcr.io/home-assistant/base:\K[0-9.]+' tailscale/Dockerfile || true)
          CURRENT_TS="${CURRENT_TAG#v}"

          [ -n "$CURRENT_VER" ]  || fail "Cannot read version in config.yaml"
          [ -n "$CURRENT_BASE" ] || fail "Cannot read FROM base image in Dockerfile"

          CURRENT_BROKEN=0
          if ! tarball_ok "$CURRENT_TAG"; then
            CURRENT_BROKEN=1
          fi

          RELEASES_JSON=$(retry curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/tailscale/tailscale/releases?per_page=8") \
            || skip "GitHub API unreachable, retrying next cycle"

          LATEST_TAG=""
          CLEAN_VER=""
          for TAG_CAND in $(echo "$RELEASES_JSON" | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name'); do
            [[ "$TAG_CAND" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            VER_CAND="${TAG_CAND#v}"
            git ls-remote --exit-code --tags https://github.com/tailscale/tailscale.git "refs/tags/${TAG_CAND}" >/dev/null 2>&1 || continue
            if tarball_ok "$VER_CAND"; then
              LATEST_TAG="$TAG_CAND"
              CLEAN_VER="$VER_CAND"
              break
            fi
          done

          [ -n "$LATEST_TAG" ] || skip "No verified upstream release found with ready binaries"
          pass "Layers 1-5: Verified latest buildable release is $LATEST_TAG"

          LATEST_BASE="$CURRENT_BASE"
          BASE_MAJOR="${CURRENT_BASE%%.*}"
          BASE_MINOR="${CURRENT_BASE#*.}"
          CAND="$CURRENT_BASE"
          for i in 1 2 3; do
            NEXT="${BASE_MAJOR}.$((BASE_MINOR + i))"
            if base_ok arm64 "$NEXT" && base_ok amd64 "$NEXT"; then CAND="$NEXT"; else break; fi
          done

          if [ "$CAND" != "$CURRENT_BASE" ]; then
            PKGS=$(sed -n '/apk add/,/&&/p' tailscale/Dockerfile | grep -oE '^[[:space:]]+[a-z0-9._+-]+' | tr -d ' \t' | tr '\n' ' ')
            if [ -z "$PKGS" ] || docker run --rm --entrypoint sh "ghcr.io/home-assistant/base:${CAND}" \
                 -c "apk add --simulate --no-cache ${PKGS}" >/tmp/apk-test.log 2>&1; then
              LATEST_BASE="$CAND"
              pass "Layer 6: Alpine $CAND verified with all packages, upgrading $CURRENT_BASE -> $CAND"
            fi
          fi

          TS_UPDATE=0
          ALPINE_UPDATE=0
          FORCE_MIGRATE=0
          MANUAL_CODE_UPDATE=0
          TS_STATUS="✅ Up to date"
          ALPINE_STATUS="✅ Up to date"
          ADDON_STATUS="✅ Up to date"
          NEW_ADDON_VER="$CURRENT_VER"

          if [ "$CURRENT_BROKEN" -eq 1 ]; then
            TS_UPDATE=1
            TS_STATUS="🔧 Self-heal → $CLEAN_VER"
          elif [ "$CLEAN_VER" != "$CURRENT_TS" ] && newer_or_equal "$CLEAN_VER" "$CURRENT_TS"; then
            TS_UPDATE=1
            TS_STATUS="⬆️ UPDATE → $CLEAN_VER"
          fi

          if [ "$LATEST_BASE" != "$CURRENT_BASE" ]; then
            ALPINE_UPDATE=1
            ALPINE_STATUS="⬆️ UPDATE → $LATEST_BASE"
          fi

          if [[ "$CURRENT_VER" =~ ^1\.10[0-9] ]]; then
            FORCE_MIGRATE=1
            NEW_ADDON_VER="1.0.0"
            ADDON_STATUS="🚀 MIGRATE → 1.0.0"
          fi

          # Nếu người dùng push commit sửa file trong tailscale/ nhưng quên tăng version trong config.yaml (và tag đó đã tồn tại), tự động bump PATCH để HASS nhận bản cập nhật mới
          if [ "${{ github.event_name }}" = "push" ] && [ "$TS_UPDATE" -eq 0 ] && [ "$ALPINE_UPDATE" -eq 0 ] && [ "$FORCE_MIGRATE" -eq 0 ]; then
            if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^tailscale/' && gh release view "tailscale-v${CURRENT_VER}" >/dev/null 2>&1; then
               PREV_CFG_VER=$(git show HEAD~1:tailscale/config.yaml 2>/dev/null | grep -oP '^version:\s*"?\K[0-9][^"\s]*' || echo "")
               if [ "$PREV_CFG_VER" = "$CURRENT_VER" ]; then
                MANUAL_CODE_UPDATE=1
              fi
            fi
          fi

          if [ "$TS_UPDATE" -eq 0 ] && [ "$ALPINE_UPDATE" -eq 0 ] && [ "$FORCE_MIGRATE" -eq 0 ] && [ "$MANUAL_CODE_UPDATE" -eq 0 ]; then
            skip "Both Tailscale $CURRENT_TS and Alpine $CURRENT_BASE are already up to date and verified"
          fi

          if [ "$FORCE_MIGRATE" -eq 0 ]; then
            CUR_MAJOR=$(echo "$CURRENT_VER" | cut -d. -f1)
            CUR_MINOR=$(echo "$CURRENT_VER" | cut -d. -f2)
            CUR_PATCH=$(echo "$CURRENT_VER" | cut -d. -f3)

            if [ "$TS_UPDATE" -eq 1 ] && [ "$ALPINE_UPDATE" -eq 1 ]; then
              NEW_MAJOR=$((CUR_MAJOR + 1))
              NEW_ADDON_VER="${NEW_MAJOR}.0.0"
              ADDON_STATUS="🚀 MAJOR → $NEW_ADDON_VER (both components updated)"
            else
              NEW_PATCH=$((CUR_PATCH + 1))
              NEW_ADDON_VER="${CUR_MAJOR}.${CUR_MINOR}.${NEW_PATCH}"
              ADDON_STATUS="⬆️ PATCH → $NEW_ADDON_VER"
            fi
          fi

          {
            echo "update_needed=true"
            echo "new_tag=$LATEST_TAG"
            echo "new_ver=$CLEAN_VER"
            echo "new_base=$LATEST_BASE"
            echo "old_ver=$CURRENT_VER"
            echo "old_ts=$CURRENT_TS"
            echo "old_base=$CURRENT_BASE"
            echo "new_addon_ver=$NEW_ADDON_VER"
            echo "target_addon_ver=$NEW_ADDON_VER"
            echo "ts_update=$TS_UPDATE"
            echo "alpine_update=$ALPINE_UPDATE"
          } >> "$GITHUB_OUTPUT"

          print_summary_table

      # ------------------------------------------------------------------
      # 3. Cập nhật Dockerfile, config.yaml, README Badges & Changelog khi có bản mới
      # ------------------------------------------------------------------
      - name: Update Dockerfile, config.yaml, Badges & Changelog
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.check.outputs.new_tag }}
          NEW_VER: ${{ steps.check.outputs.new_ver }}
          OLD_VER: ${{ steps.check.outputs.old_ver }}
          OLD_TS: ${{ steps.check.outputs.old_ts }}
          NEW_BASE: ${{ steps.check.outputs.new_base }}
          OLD_BASE: ${{ steps.check.outputs.old_base }}
          NEW_ADDON_VER: ${{ steps.check.outputs.new_addon_ver }}
          TS_UPDATE: ${{ steps.check.outputs.ts_update }}
          ALPINE_UPDATE: ${{ steps.check.outputs.alpine_update }}
        run: |
          set -e

          sed -i -E "s|^(FROM ghcr.io/home-assistant/base:)[0-9.]+|\1${NEW_BASE}|" tailscale/Dockerfile
          sed -i "s|^ARG TAILSCALE_VERSION=.*|ARG TAILSCALE_VERSION=${NEW_TAG}|" tailscale/Dockerfile
          rm -f tailscale/build.yaml
          sed -i "s|^version:.*|version: \"${NEW_ADDON_VER}\"|" tailscale/config.yaml

          if [ -f "tailscale/README.md" ]; then
            sed -i "s|badge/version-[^-]*-blue.svg|badge/version-${NEW_ADDON_VER}-blue.svg|g" tailscale/README.md
            sed -i "s|badge/tailscale-[^-]*-0052CC.svg|badge/tailscale-${NEW_TAG}-0052CC.svg|g" tailscale/README.md
            sed -i "s|badge/alpine%20base-[^-]*-0D597F.svg|badge/alpine%20base-${NEW_BASE}-0D597F.svg|g" tailscale/README.md
          fi

          RELEASES=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/tailscale/tailscale/releases?per_page=10")

          mapfile -t TAG_LIST < <(echo "$RELEASES" | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')
          mapfile -t DATE_LIST < <(echo "$RELEASES" | jq -r '.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .published_at' | cut -d'T' -f1)

          {
            echo "# Changelog"
            echo ""
            COUNT=0
            for idx in "${!TAG_LIST[@]}"; do
              TAG="${TAG_LIST[$idx]}"
              V="${TAG#v}"
              DATE="${DATE_LIST[$idx]:-$(date -u +%Y-%m-%d)}"
              PREV_TAG="${TAG_LIST[$((idx + 1))]:-}"
              PREV_V="${PREV_TAG#v}"

              NOTES=$(python3 /tmp/extract_ts.py "$V" "$PREV_V")

              if [ "$idx" -eq 0 ]; then
                echo "## ${NEW_ADDON_VER}"
                echo "_Released: $(date -u +%Y-%m-%d)_"
                echo ""
                echo "### 📦 Component & Version Matrix"
                echo "- **Add-on Release:** Bumped from \`v${OLD_VER}\` ➡️ **\`v${NEW_ADDON_VER}\`**"
                if [ "$TS_UPDATE" = "1" ]; then
                  echo "- **Tailscale Engine:** Updated from \`v${OLD_TS}\` ➡️ **\`v${NEW_VER}\`** *(arm64 & amd64 verified)*"
                else
                  echo "- **Tailscale Engine:** \`v${NEW_VER}\` *(arm64 & amd64 verified)*"
                fi
                if [ "$ALPINE_UPDATE" = "1" ]; then
                  echo "- **Alpine Base Image:** Upgraded from \`Alpine ${OLD_BASE}\` ➡️ **\`Alpine ${NEW_BASE}\`**"
                else
                  echo "- **Alpine Base Image:** \`Alpine ${NEW_BASE}\` *(Home Assistant official base)*"
                fi
                echo "- **Official Links:** [GitHub Release ${NEW_TAG}](https://github.com/tailscale/tailscale/releases/tag/${NEW_TAG}) • [Official Tailscale Changelog](https://tailscale.com/changelog#client)"
              else
                echo "## Tailscale v${V}"
                echo "_Released: ${DATE}_"
                echo ""
                echo "### 📦 Component & Version Matrix"
                echo "- **Tailscale Engine:** \`v${V}\` *(arm64 & amd64 verified)*"
                echo "- **Alpine Base Image:** \`Alpine ${NEW_BASE}\`"
                echo "- **Official Links:** [GitHub Release ${TAG}](https://github.com/tailscale/tailscale/releases/tag/${TAG}) • [Official Tailscale Changelog](https://tailscale.com/changelog#client)"
              fi
              echo ""
              echo "${NOTES}"
              echo ""
              echo "---"
              echo ""

              COUNT=$((COUNT + 1))
              [ "$COUNT" -ge 4 ] && break
            done
          } > tailscale/CHANGELOG.md

      # ------------------------------------------------------------------
      # 4. Kiểm tra điều kiện cần Build Package & Release
      # ------------------------------------------------------------------
      - name: Determine Build & Release Status
        id: prep_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          TARGET_VER: ${{ steps.check.outputs.target_addon_ver }}
        run: |
          HAS_DIFF="false"
          if ! git diff --quiet tailscale/; then
            HAS_DIFF="true"
          fi

          SHOULD_RELEASE="false"
          if [ "$UPDATE_NEEDED" = "true" ] || [ "$HAS_DIFF" = "true" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_RELEASE="true"
          elif ! gh release view "tailscale-v${TARGET_VER}" >/dev/null 2>&1; then
            SHOULD_RELEASE="true"
          fi

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 5. Build & Push Pre-built Package (aarch64 + amd64) lên GHCR TRƯỚC KHI Commit
      # ------------------------------------------------------------------
      - name: Set up QEMU for Multi-arch Build
        if: steps.prep_release.outputs.should_release == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        if: steps.prep_release.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.prep_release.outputs.should_release == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push aarch64 (arm64) Package for HASS
        if: steps.prep_release.outputs.should_release == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: tailscale
          file: tailscale/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_ARCH=aarch64
          labels: |
            io.hass.version=${{ steps.check.outputs.target_addon_ver }}
            io.hass.type=addon
            io.hass.arch=aarch64
          tags: |
            ghcr.io/${{ steps.prep_release.outputs.owner_lc }}/tailscale_pro-aarch64:${{ steps.check.outputs.target_addon_ver }}
            ghcr.io/${{ steps.prep_release.outputs.owner_lc }}/tailscale_pro-aarch64:latest

      - name: Build and Push amd64 Package for HASS
        if: steps.prep_release.outputs.should_release == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: tailscale
          file: tailscale/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_ARCH=amd64
          labels: |
            io.hass.version=${{ steps.check.outputs.target_addon_ver }}
            io.hass.type=addon
            io.hass.arch=amd64
          tags: |
            ghcr.io/${{ steps.prep_release.outputs.owner_lc }}/tailscale_pro-amd64:${{ steps.check.outputs.target_addon_ver }}
            ghcr.io/${{ steps.prep_release.outputs.owner_lc }}/tailscale_pro-amd64:latest

      # ------------------------------------------------------------------
      # 6. Commit (Verified GPG via GraphQL API) + Tạo/Cập nhật GitHub Release
      # ------------------------------------------------------------------
      - name: Commit, Push and Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          TARGET_VER: ${{ steps.check.outputs.target_addon_ver }}
          SHOULD_RELEASE: ${{ steps.prep_release.outputs.should_release }}
        run: |
          set -e

          # Keep-alive (đặt tại .github/.keepalive để GITHUB_TOKEN được phép ghi)
          LAST_COMMIT_TS=$(git log -1 --format=%ct || date +%s)
          NOW_TS=$(date +%s)
          DAYS_IDLE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          if [ "$DAYS_IDLE" -ge 45 ]; then
            mkdir -p .github
            echo "Last automated keep-alive check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/.keepalive
          fi

          git add tailscale/ .github/.keepalive 2>/dev/null || git add tailscale/

          if ! git diff --staged --quiet; then
            if [ "$UPDATE_NEEDED" = "true" ]; then
              export COMMIT_MSG="chore(tailscale): release v${TARGET_VER}"
            else
              export COMMIT_MSG="chore(tailscale): rebuild clean deduplicated changelog with professional layout"
            fi

            python3 - <<'PY'
          import base64, json, os, subprocess, sys, time, urllib.request, urllib.error

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          msg = os.environ["COMMIT_MSG"]

          raw = subprocess.check_output(["git", "diff", "--cached", "--no-renames", "--name-status", "-z"])
          parts = [p for p in raw.split(b"\x00") if p]
          additions, deletions = [], []
          for i in range(0, len(parts), 2):
              st = parts[i].decode("utf-8")
              path = parts[i + 1].decode("utf-8")
              if st == "D":
                  deletions.append({"path": path})
              else:
                  with open(path, "rb") as f:
                      b64 = base64.b64encode(f.read()).decode("ascii")
                  additions.append({"path": path, "contents": b64})

          if not additions and not deletions:
              sys.exit(0)

          file_changes = {}
          if additions: file_changes["additions"] = additions
          if deletions: file_changes["deletions"] = deletions

          query = """
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }
          """
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/vnd.github+json",
              "User-Agent": "github-actions-verified-commit"
          }

          for attempt in range(1, 4):
              ref_req = urllib.request.Request(f"https://api.github.com/repos/{repo}/git/ref/heads/main", headers=headers)
              with urllib.request.urlopen(ref_req, timeout=20) as r:
                  head_oid = json.loads(r.read().decode("utf-8"))["object"]["sha"]

              payload = {
                  "query": query,
                  "variables": {
                      "input": {
                          "branch": {"repositoryNameWithOwner": repo, "branchName": "main"},
                          "message": {"headline": msg},
                          "fileChanges": file_changes,
                          "expectedHeadOid": head_oid
                      }
                  }
              }
              gql_req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(gql_req, timeout=30) as r:
                      resp = json.loads(r.read().decode("utf-8"))
                  if "errors" not in resp:
                      c = resp["data"]["createCommitOnBranch"]["commit"]
                      print(f"✅ Verified commit created: {c['oid']} ({c['url']})")
                      sys.exit(0)
                  print(f"⚠️ Attempt {attempt} GraphQL error: {resp['errors']}", file=sys.stderr)
              except urllib.error.HTTPError as e:
                  print(f"⚠️ Attempt {attempt} HTTP {e.code}: {e.read().decode('utf-8', 'ignore')}", file=sys.stderr)
              time.sleep(attempt * 5)
          sys.exit(1)
          PY

            # Đồng bộ lại working tree theo đúng commit Verified vừa tạo trên GitHub
            git reset --hard HEAD
            git fetch origin main
            git checkout -B main origin/main
          else
            echo "✨ Nothing to commit."
          fi

          if [ "$SHOULD_RELEASE" = "true" ]; then
            TAG="tailscale-v${TARGET_VER}"

            python3 - <<'PY' > /tmp/release_notes.md
          import re
          with open("tailscale/CHANGELOG.md", "r", encoding="utf-8") as f:
              text = f.read()
          text = re.sub(r'^#\s+Changelog\s*', '', text, flags=re.I).strip()
          first_section = text.split("\n---\n")[0].strip()
          print(first_section)
          PY

            git tag -f "${TAG}"
            git push origin "${TAG}" --force

            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "🔄 Updating existing GitHub Release ${TAG}..."
              gh release edit "${TAG}" \
                --title "Tailscale Pro v${TARGET_VER}" \
                --notes-file /tmp/release_notes.md \
                --latest
            else
              echo "🎉 Creating new GitHub Release ${TAG}..."
              gh release create "${TAG}" \
                --title "Tailscale Pro v${TARGET_VER}" \
                --notes-file /tmp/release_notes.md \
                --latest
            fi
          fi
