name: Auto Check Tailscale & Alpine Base (Verified)

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tailscale/**"
      - ".github/workflows/update-tailscale.yml"

permissions:
  contents: write

jobs:
  update-tailscale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Latest Tailscale Version
        id: check_version
        run: |
          echo "1. Đang quét phiên bản mới nhất từ GitHub API của Tailscale..."
          CURRENT_VER=$(grep -oP '^version:\s*"\K[^"]+' tailscale/config.yaml || echo "1.104.1")
          LATEST_TAG=$(curl -s https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r '.tag_name')
          LATEST_VER=$(echo "$LATEST_TAG" | sed 's/^v//')

          if [ -z "$LATEST_VER" ] || [ "$LATEST_VER" == "null" ]; then
            echo "Không lấy được version, giữ nguyên phiên bản cũ."
            exit 0
          fi

          echo "Phiên bản hiện tại trên Repo: $CURRENT_VER"
          echo "Phiên bản mới nhất từ Tailscale: $LATEST_VER ($LATEST_TAG)"

          # Tự động thay thế phiên bản mới vào config.yaml và Dockerfile
          sed -i "s|ARG TAILSCALE_VERSION=.*|ARG TAILSCALE_VERSION=${LATEST_TAG}|g" tailscale/Dockerfile
          sed -i "s|^version:.*|version: \"${LATEST_VER}\"|g" tailscale/config.yaml

          echo "new_ver=$LATEST_VER" >> $GITHUB_OUTPUT

      - name: Commit and Push Update
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git reset --hard HEAD
          git pull --rebase origin main
          git add tailscale/Dockerfile tailscale/config.yaml
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(tailscale): sync version to v${{ steps.check_version.outputs.new_ver }}"
            git push
            echo "🎉 Đã tự động commit và đẩy phiên bản mới thành công!"
          else
            echo "✨ Phiên bản đã đồng bộ sẵn."
          fi
