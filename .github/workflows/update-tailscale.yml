name: Auto Update Tailscale Pro

on:
  schedule:
    - cron: "15 */6 * * *" # Chạy mỗi 6 tiếng (lệch 15 phút so với Cloudflared để không đụng Git push)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tailscale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest Tailscale release & Alpine Base
        id: check
        run: |
          # 1. Lấy tag mới nhất từ GitHub chính thức của Tailscale
          LATEST_TAG=$(curl -sfL https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r '.tag_name')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
            echo "Không thể lấy thông tin từ GitHub API"
            exit 1
          fi
          CLEAN_VER="${LATEST_TAG#v}"
          CURRENT_VER=$(grep -oP 'version:\s*"\K[^"]+' tailscale/config.yaml)
          
          echo "Hiện tại: $CURRENT_VER | Mới nhất: $CLEAN_VER"
          
          if [ "$CLEAN_VER" != "$CURRENT_VER" ]; then
            echo "Kiểm tra Docker Image tailscale/tailscale:${LATEST_TAG} trên Docker Hub..."
            if docker manifest inspect "tailscale/tailscale:${LATEST_TAG}" > /dev/null 2>&1; then
              echo "update_needed=true" >> $GITHUB_OUTPUT
              echo "new_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
              echo "new_ver=$CLEAN_VER" >> $GITHUB_OUTPUT
            else
              echo "Docker Image chưa sẵn sàng, đợi chu kỳ sau."
              echo "update_needed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply New Version
        if: steps.check.outputs.update_needed == 'true'
        run: |
          sed -i "s/ARG TAILSCALE_VERSION=.*/ARG TAILSCALE_VERSION=${{ steps.check.outputs.new_tag }}/g" tailscale/Dockerfile
          sed -i "s/version: \".*\"/version: \"${{ steps.check.outputs.new_ver }}\"/g" tailscale/config.yaml

      - name: Set up QEMU & Buildx
        if: steps.check.outputs.update_needed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Test Build for Raspberry Pi 5 (aarch64)
        if: steps.check.outputs.update_needed == 'true'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/aarch64-base:3.20 \
            --build-arg TAILSCALE_VERSION=${{ steps.check.outputs.new_tag }} \
            ./tailscale

      - name: Commit and Push safely
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase origin main
          git add tailscale/Dockerfile tailscale/config.yaml
          git commit -m "chore(tailscale): update to v${{ steps.check.outputs.new_ver }}"
          git push

