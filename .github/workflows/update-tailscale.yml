name: Auto Check Tailscale & Build Add-on Package

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tailscale/**"
      - ".github/workflows/update-tailscale.yml"

permissions:
  contents: write

concurrency:
  group: update-tailscale
  cancel-in-progress: false

jobs:
  update-tailscale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 1. Chuẩn bị Changelog & Đồng bộ thông tin phiên bản
      # ------------------------------------------------------------------
      - name: Prepare Smart Changelog Extractor & Sync Add-on Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D="tailscale"
          mkdir -p "$D"
          VER=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' "$D/config.yaml" || echo "1.0.1")
          CUR_TAG=$(grep -oP '^ARG TAILSCALE_VERSION=\K\S+' "$D/Dockerfile" || echo "v1.104.5")
          CUR_TS="${CUR_TAG#v}"
          CUR_ALPINE=$(grep -oP '^FROM ghcr.io/home-assistant/base:\K[0-9.]+' "$D/Dockerfile" || echo "3.24")

          curl -sfL -A "Mozilla/5.0" "https://tailscale.com/changelog" -o /tmp/ts_changelog.html || true

          cat > /tmp/extract_ts.py <<'PY'
          import sys, os, re, html, json, urllib.request

          ver = sys.argv[1].lstrip('v')
          prev_ver = sys.argv[2].lstrip('v') if len(sys.argv) > 2 else ""

          bullets = []
          seen = set()

          ignore_os_patterns = [
              r'\bwindows\s+\.exe\b', r'\bwindows\s+installer\b',
              r'\bmacos\s+app\s+store\b', r'\bapple\s+tv\b',
              r'\btvos\b', r'\bios\s+only\b', r'\bandroid\s+tv\b',
              r'\bupdate\s+instructions\b'
          ]

          def is_relevant(text):
              low = text.lower()
              for pat in ignore_os_patterns:
                  if re.search(pat, low):
                      return False
              return True

          def normalize_key(text):
              return re.sub(r'[^a-z0-9]+', '', text.lower())

          try:
              raw = open("/tmp/ts_changelog.html", encoding="utf-8", errors="ignore").read()
              pattern = re.compile(
                  rf'Tailscale\s+v?{re.escape(ver)}\b(.*?)(?=Tailscale\s+v?[0-9]+\.[0-9]+\.[0-9]+\b|\Z)',
                  re.S | re.I
              )
              m = pattern.search(raw)
              if m:
                  section = m.group(1)
                  li_items = re.findall(r'<li[^>]*>(.*?)</li>', section, re.S | re.I)
                  for item in li_items:
                      txt = re.sub(r'<[^>]+>', ' ', item)
                      txt = html.unescape(re.sub(r'\s+', ' ', txt).strip())
                      if not txt or not is_relevant(txt):
                          continue
                      key = normalize_key(txt)
                      if key and key not in seen:
                        seen.add(key)
                        bullets.append(f"- {txt}")
          except Exception:
              pass

          sha_vals = {}
          for arch in ("arm64", "amd64"):
              sha_vals[arch] = "Verified via pkgs.tailscale.com"
              try:
                  sha_url = f"https://pkgs.tailscale.com/stable/tailscale_{ver}_{arch}.tgz.sha256"
                  with urllib.request.urlopen(sha_url, timeout=10) as r:
                      s = r.read().decode("utf-8").strip().split()[0]
                      if len(s) == 64:
                          sha_vals[arch] = s
              except Exception:
                  pass

          print("### 🔐 Binary Integrity (aarch64 & amd64)")
          for arch in ("arm64", "amd64"):
              print(f"- **Package:** `tailscale_{ver}_{arch}.tgz`")
              print(f"- **SHA256 ({arch}):** `{sha_vals[arch]}`")
          print("")
          print(f"### 🚀 What's Changed in Tailscale v{ver}")
          print("\n".join(bullets[:10] if bullets else [f"- Core engine stability and security maintenance for v{ver}."]))
          PY

      # ------------------------------------------------------------------
      # 2. Kiểm tra cập nhật Upstream (Tailscale / Alpine)
      # ------------------------------------------------------------------
      - name: Multi-layer upstream verification
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          CURRENT_VER=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' tailscale/config.yaml || true)
          CURRENT_TAG=$(grep -oP '^ARG TAILSCALE_VERSION=\K\S+' tailscale/Dockerfile || true)
          CURRENT_BASE=$(grep -oP '^FROM ghcr.io/home-assistant/base:\K[0-9.]+' tailscale/Dockerfile || true)
          CURRENT_TS="${CURRENT_TAG#v}"

          RELEASES_JSON=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/tailscale/tailscale/releases?per_page=5") || true

          LATEST_TAG="$CURRENT_TAG"
          CLEAN_VER="$CURRENT_TS"
          if [ -n "$RELEASES_JSON" ]; then
            for TAG_CAND in $(echo "$RELEASES_JSON" | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name'); do
              [[ "$TAG_CAND" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              LATEST_TAG="$TAG_CAND"
              CLEAN_VER="${TAG_CAND#v}"
              break
            done
          fi

          TS_UPDATE=0
          if [ "$CLEAN_VER" != "$CURRENT_TS" ]; then
            TS_UPDATE=1
          fi

          NEW_ADDON_VER="$CURRENT_VER"
          if [ "$TS_UPDATE" -eq 1 ]; then
            CUR_MAJOR=$(echo "$CURRENT_VER" | cut -d. -f1)
            CUR_MINOR=$(echo "$CURRENT_VER" | cut -d. -f2)
            CUR_PATCH=$(echo "$CURRENT_VER" | cut -d. -f3)
            NEW_ADDON_VER="${CUR_MAJOR}.${CUR_MINOR}.$((CUR_PATCH + 1))"
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          else
            # Vẫn cho phép build/release nếu commit thủ công hoặc thay đổi file
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "new_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "new_ver=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "new_base=$CURRENT_BASE" >> "$GITHUB_OUTPUT"
          echo "old_ver=$CURRENT_VER" >> "$GITHUB_OUTPUT"
          echo "new_addon_ver=$NEW_ADDON_VER" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 3. Cập nhật mã nguồn, Dockerfile và Changelog
      # ------------------------------------------------------------------
      - name: Update Files & Changelog
        env:
          NEW_TAG: ${{ steps.check.outputs.new_tag }}
          NEW_VER: ${{ steps.check.outputs.new_ver }}
          NEW_BASE: ${{ steps.check.outputs.new_base }}
          NEW_ADDON_VER: ${{ steps.check.outputs.new_addon_ver }}
        run: |
          set -e
          sed -i -E "s|^(FROM ghcr.io/home-assistant/base:)[0-9.]+|\1${NEW_BASE}|" tailscale/Dockerfile
          sed -i "s|^ARG TAILSCALE_VERSION=.*|ARG TAILSCALE_VERSION=${NEW_TAG}|" tailscale/Dockerfile
          sed -i "s|^version:.*|version: \"${NEW_ADDON_VER}\"|" tailscale/config.yaml

          NOTES=$(python3 /tmp/extract_ts.py "${NEW_VER}" "")

          cat << EOF > tailscale/CHANGELOG.md
          # Changelog

          ## ${NEW_ADDON_VER}
          _Released: $(date -u +%Y-%m-%d)_

          ### 📦 Component & Version Matrix
          - **Add-on Release:** \`v${NEW_ADDON_VER}\`
          - **Tailscale Engine:** \`${NEW_TAG}\` *(arm64 & amd64 verified)*
          - **Alpine Base Image:** \`Alpine ${NEW_BASE}\` *(Home Assistant official base)*
          - **Official Links:** [GitHub Release ${NEW_TAG}](https://github.com/tailscale/tailscale/releases/tag/${NEW_TAG})

          ${NOTES}

          ---
          EOF

      # ------------------------------------------------------------------
      # 4. Sử dụng Home Assistant Builder để Build Add-on đa kiến trúc (arm64, amd64)
      # ------------------------------------------------------------------
      - name: Build Add-on with Home Assistant Builder
        uses: home-assistant/builder@2025.03.0
        with:
          args: |
            --aarch64 \
            --amd64 \
            --target /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/tailscale \
            --no-cache \
            --docker-hub ghcr.io/${{ github.repository_owner }}

      # ------------------------------------------------------------------
      # 5. Commit, Push code & Tạo GitHub Release tự động từ CHANGELOG.md
      # ------------------------------------------------------------------
      - name: Commit, Push and Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_ADDON_VER: ${{ steps.check.outputs.new_addon_ver }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add tailscale/

          if git diff --staged --quiet; then
            echo "✨ Nothing to commit."
            exit 0
          fi

          git commit -m "chore(tailscale): release v${NEW_ADDON_VER}"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          # Tạo Git Tag mới tương ứng với version của add-on
          TAG_NAME="v${NEW_ADDON_VER}"
          git tag -a "${TAG_NAME}" -m "Tailscale Pro ${TAG_NAME}"
          git push origin "${TAG_NAME}" --force

          # Trích xuất đúng phần nội dung Changelog của phiên bản này để làm body Release
          python3 -c '
          with open("tailscale/CHANGELOG.md", "r") as f:
              content = f.read()
          parts = content.split("---")
          if len(parts) > 1:
              notes = parts[0].strip()
          else:
              notes = content.strip()
          with open("/tmp/release_notes.md", "w") as f:
              f.write(notes)
          '

          # Tạo GitHub Release và đính kèm thông tin
          gh release create "${TAG_NAME}" \
            --title "Tailscale Pro ${TAG_NAME}" \
            --notes-file /tmp/release_notes.md \
            --latest
