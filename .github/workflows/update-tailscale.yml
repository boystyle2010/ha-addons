name: Auto Check Tailscale & Alpine Base (Verified)

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tailscale/**"
      - ".github/workflows/update-tailscale.yml"

permissions:
  contents: write

concurrency:
  group: update-tailscale
  cancel-in-progress: false

jobs:
  update-tailscale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # Tự tạo các file còn thiếu & tự động nâng cấp CHANGELOG.md lên 4 bản gần nhất
      # ------------------------------------------------------------------
      - name: Bootstrap missing add-on files & 4-version Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D="tailscale"
          VER=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' $D/config.yaml || echo "1.104.4")
          CUR_ALPINE=$(grep -oP '^ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:\K[0-9.]+' $D/Dockerfile || echo "3.23")

          # Kiểm tra nếu chưa có CHANGELOG.md hoặc CHANGELOG.md hiện tại có ít hơn 4 phiên bản thì tự tạo lại đủ 4 bản
          COUNT_VER=0
          if [ -f "$D/CHANGELOG.md" ]; then
            COUNT_VER=$(grep -c '^## ' "$D/CHANGELOG.md" || true)
          fi

          if [ ! -f "$D/CHANGELOG.md" ] || [ "$COUNT_VER" -lt 4 ]; then
            echo "📝 Generating CHANGELOG.md with the 4 latest releases from Tailscale & Alpine Base..."
            RELEASES=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/tailscale/tailscale/releases?per_page=4")

            if [ -n "$RELEASES" ]; then
              {
                echo "# Changelog"
                echo ""
                FIRST=1
                echo "$RELEASES" | jq -c '.[]' | while read -r rel; do
                  TAG=$(echo "$rel" | jq -r '.tag_name')
                  V="${TAG#v}"
                  DATE=$(echo "$rel" | jq -r '.published_at' | cut -d'T' -f1)
                  BODY=$(echo "$rel" | jq -r '.body // "See official release notes at https://tailscale.com/changelog"')

                  if [ "$FIRST" -eq 1 ]; then
                    echo "## ${VER}"
                    FIRST=0
                  else
                    echo "## ${V}"
                  fi
                  echo "_Released: ${DATE}_"
                  echo ""
                  echo "### 📦 System Components"
                  echo "- **Tailscale Engine (arm64 & amd64 verified):** \`v${V}\`"
                  echo "- **Home Assistant Alpine Base Image:** \`Alpine ${CUR_ALPINE}\`"
                  echo "- **Offical Release:** [GitHub Release ${TAG}](https://github.com/tailscale/tailscale/releases/tag/${TAG}) | [Tailscale Changelog](https://tailscale.com/changelog#client)"
                  echo ""
                  echo "### 🔄 What's changed in Tailscale (${TAG})"
                  echo "${BODY}"
                  echo ""
                  echo "---"
                  echo ""
                done
              } > "$D/CHANGELOG.md"
            fi
          fi

          if [ ! -f "$D/README.md" ]; then
            echo "📝 Create README.md"
            cat > "$D/README.md" <<'EOF'
          # Home Assistant App: Tailscale Pro

          High-stability, upstream-synced Tailscale mesh VPN and Subnet Router for Home Assistant, tuned for Raspberry Pi 5.

          ## Features

          - Always up to date: a bot checks for new official Tailscale releases and updates this add-on automatically
          - Subnet router and exit node support
          - Web UI integrated in the Home Assistant sidebar (Ingress)
          - Taildrive & Taildrop built-in support
          - Built-in health monitor: restarts the connection automatically if it becomes unstable
          - UDP GRO forwarding optimization for better throughput
          - Persistent state, so you do not need to log in again after a restart
          - Supports aarch64

          ## Installation

          1. Add this repository to the Home Assistant Add-on Store
          2. Install **Tailscale Pro**
          3. Fill in the configuration (see the Documentation tab)
          4. Start the add-on

          See the **Documentation** tab for full setup instructions.
          EOF
          fi

          if [ ! -f "$D/DOCS.md" ]; then
            echo "📝 Create DOCS.md"
            cat > "$D/DOCS.md" <<'EOF'
          # Home Assistant App: Tailscale Pro

          ## Quick start

          1. Create an auth key at https://login.tailscale.com/admin/settings/keys
             (reusable keys are recommended)
          2. Paste it into the **auth_key** option and start the add-on
          3. Open the **Tailscale Pro** panel in the sidebar to check the status
          4. If you use subnet routes or an exit node, approve them in the Tailscale
             admin console (Machines -> your device -> Edit route settings)

          You can also leave **auth_key** empty and log in through the Web UI instead.
          EOF
          fi

          if [ ! -f "$D/icon.png" ] || [ ! -f "$D/logo.png" ]; then
            echo "🎨 Tạo icon.png / logo.png"
            python3 -c "import PIL" 2>/dev/null || pip install --quiet pillow || pip install --quiet --break-system-packages pillow
            ICON_OUT="$D/icon.png" LOGO_OUT="$D/logo.png" python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont

          def make_icon(size):
              S = size * 4
              grad = Image.new("RGBA", (S, S))
              px = grad.load()
              c1, c2 = (30, 58, 138), (59, 130, 246)
              for y in range(S):
                  t = y / (S - 1)
                  col = tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3)) + (255,)
                  for x in range(S):
                      px[x, y] = col
              mask = Image.new("L", (S, S), 0)
              ImageDraw.Draw(mask).rounded_rectangle((0, 0, S - 1, S - 1), radius=int(S * 0.22), fill=255)
              img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              img.paste(grad, (0, 0), mask)

              d = ImageDraw.Draw(img)
              pts = [(0.5, 0.26), (0.26, 0.68), (0.74, 0.68)]
              pts = [(int(x * S), int(y * S)) for x, y in pts]
              center = (int(0.5 * S), int(0.52 * S))
              w = max(2, int(S * 0.035))
              white = (255, 255, 255, 255)
              for i in range(3):
                  d.line([pts[i], pts[(i + 1) % 3]], fill=white, width=w)
                  d.line([pts[i], center], fill=(255, 255, 255, 190), width=w)
              r = int(S * 0.085)
              for p in pts:
                  d.ellipse((p[0] - r, p[1] - r, p[0] + r, p[1] + r), fill=white)
              rc = int(S * 0.065)
              d.ellipse((center[0] - rc, center[1] - rc, center[0] + rc, center[1] + rc), fill=white)
              return img.resize((size, size), Image.LANCZOS)

          def find_font(px):
              for path in (
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
              ):
                  if os.path.exists(path):
                      return ImageFont.truetype(path, px)
              return ImageFont.load_default()

          make_icon(128).save(os.environ["ICON_OUT"])

          W, H = 1000, 400
          logo = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          ic = make_icon(300)
          logo.paste(ic, (20, (H - 300) // 2), ic)
          text = "Tailscale Pro"
          fs = 90
          font = find_font(fs)
          while fs > 20:
              font = find_font(fs)
              box = ImageDraw.Draw(logo).textbbox((0, 0), text, font=font)
              if box[2] - box[0] <= W - 360 - 20:
                  break
              fs -= 4
          d = ImageDraw.Draw(logo)
          box = d.textbbox((0, 0), text, font=font)
          ty = (H - (box[3] - box[1])) // 2 - box[1]
          d.text((350, ty), text, font=font, fill=(91, 141, 239, 255))
          logo.resize((250, 100), Image.LANCZOS).save(os.environ["LOGO_OUT"])
          PY
          fi

      # ------------------------------------------------------------------
      # Kiểm tra nguồn gốc nhiều tầng (6 lớp bảo vệ an toàn)
      # ------------------------------------------------------------------
      - name: Multi-layer upstream verification
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          skip() {
            echo "⏭️ $1"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "- ⏭️ $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          fail() {
            echo "❌ $1"
            echo "- ❌ $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          pass() {
            echo "✅ $1"
            echo "- ✅ $1" >> "$GITHUB_STEP_SUMMARY"
          }
          warn() {
            echo "⚠️ $1"
            echo "- ⚠️ $1" >> "$GITHUB_STEP_SUMMARY"
          }
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              sleep $((i * 5))
            done
            return 1
          }
          http_ok() {
            [ "$(curl -s -o /dev/null -L -I -w '%{http_code}' --max-time 30 "$1")" = "200" ]
          }
          base_ok() {
            docker manifest inspect "ghcr.io/home-assistant/$1-base:$2" >/dev/null 2>&1
          }
          newer_or_equal() {
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
          }

          echo "### 🔍 Kết quả kiểm tra" >> "$GITHUB_STEP_SUMMARY"

          # ---- Đọc phiên bản hiện tại ----
          CURRENT_VER=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' tailscale/config.yaml || true)
          CURRENT_BASE=$(grep -oP '^ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:\K[0-9.]+' tailscale/Dockerfile || true)
          [ -n "$CURRENT_VER" ]  || fail "Không đọc được version trong config.yaml"
          [ -n "$CURRENT_BASE" ] || fail "Không đọc được BUILD_FROM trong Dockerfile"
          echo "📌 Hiện tại: Tailscale $CURRENT_VER | Alpine $CURRENT_BASE"

          # ---- Lớp 1: Release hợp lệ ----
          RELEASE_JSON=$(retry curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/tailscale/tailscale/releases/latest) \
            || skip "Không gọi được GitHub API, thử lại chu kỳ sau"

          IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.draft')
          IS_PRERELEASE=$(echo "$RELEASE_JSON" | jq -r '.prerelease')
          LATEST_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')

          [ -n "$LATEST_TAG" ] || skip "Release không có tag"
          [ "$IS_DRAFT" = "false" ] || skip "Release $LATEST_TAG đang là draft"
          [ "$IS_PRERELEASE" = "false" ] || skip "Release $LATEST_TAG là pre-release"
          [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || skip "Tag '$LATEST_TAG' không phải dạng vX.Y.Z ổn định"
          CLEAN_VER="${LATEST_TAG#v}"
          pass "Lớp 1: release $LATEST_TAG hợp lệ (không draft, không pre-release)"

          # ---- Lớp 2: Tag tồn tại thật trong repo gốc ----
          retry git ls-remote --exit-code --tags https://github.com/tailscale/tailscale.git "refs/tags/${LATEST_TAG}" >/dev/null 2>&1 \
            || skip "Tag $LATEST_TAG chưa tồn tại trong repo gốc"
          pass "Lớp 2: tag $LATEST_TAG tồn tại trong repo gốc"

          # ---- Lớp 3: File gốc đã tải lên xong ----
          for ARCH in arm64 amd64; do
            URL="https://pkgs.tailscale.com/stable/tailscale_${CLEAN_VER}_${ARCH}.tgz"
            retry http_ok "$URL" || skip "File gốc ${ARCH} chưa sẵn sàng: $URL"
          done
          pass "Lớp 3: tarball gốc arm64 + amd64 đã có trên pkgs.tailscale.com"

          # ---- Lớp 5: Alpine base (chỉ nâng khi gói apk tương thích hoàn toàn) ----
          LATEST_BASE="$CURRENT_BASE"
          BASE_MAJOR="${CURRENT_BASE%%.*}"
          BASE_MINOR="${CURRENT_BASE#*.}"
          CAND="$CURRENT_BASE"
          for i in 1 2 3; do
            NEXT="${BASE_MAJOR}.$((BASE_MINOR + i))"
            if base_ok aarch64 "$NEXT"; then CAND="$NEXT"; else break; fi
          done

          if [ "$CAND" = "$CURRENT_BASE" ]; then
            echo "ℹ️ Chưa có Alpine mới hơn $CURRENT_BASE, giữ nguyên"
          else
            PKGS=$(sed -n '/apk add/,/^$/p' tailscale/Dockerfile | grep -oE '^[[:space:]]+[a-z0-9._+-]+' | tr -d ' \t' | tr '\n' ' ')
            if [ -z "$PKGS" ]; then
              warn "Lớp 5: không đọc được danh sách gói trong Dockerfile, giữ Alpine $CURRENT_BASE"
            elif docker run --rm --entrypoint sh "ghcr.io/home-assistant/amd64-base:${CAND}" \
                   -c "apk add --simulate --no-cache ${PKGS}" >/tmp/apk-test.log 2>&1; then
              LATEST_BASE="$CAND"
              pass "Lớp 6: Alpine $CAND có đủ image và cài được các gói (${PKGS}), sẽ nâng $CURRENT_BASE -> $CAND"
            else
              warn "Lớp 5: Alpine $CAND chưa qua kiểm tra gói, giữ Alpine $CURRENT_BASE"
              tail -n 5 /tmp/apk-test.log || true
            fi
          fi

          {
            echo "update_needed=true"
            echo "new_tag=$LATEST_TAG"
            echo "new_ver=$CLEAN_VER"
            echo "new_base=$LATEST_BASE"
            echo "old_ver=$CURRENT_VER"
            echo "old_base=$CURRENT_BASE"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Cập nhật file
      # ------------------------------------------------------------------
      - name: Update Dockerfile and config.yaml
        if: steps.check.outputs.update_needed == 'true'
        run: |
          NEW_TAG="${{ steps.check.outputs.new_tag }}"
          NEW_VER="${{ steps.check.outputs.new_ver }}"
          NEW_BASE="${{ steps.check.outputs.new_base }}"

          echo "🛠️ Đang cập nhật lên v${NEW_VER} (Base Alpine ${NEW_BASE})..."
          sed -i "s|^ARG BUILD_FROM=.*|ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:${NEW_BASE}|" tailscale/Dockerfile
          sed -i "s|^ARG TAILSCALE_VERSION=.*|ARG TAILSCALE_VERSION=${NEW_TAG}|" tailscale/Dockerfile
          sed -i "s|^version:.*|version: \"${NEW_VER}\"|" tailscale/config.yaml

          git diff --stat

      # ------------------------------------------------------------------
      # Kiểm tra file sau khi sửa (sẵn sàng để build)
      # ------------------------------------------------------------------
      - name: Validate edited files
        if: steps.check.outputs.update_needed == 'true'
        env:
          NEW_TAG: ${{ steps.check.outputs.new_tag }}
          NEW_VER: ${{ steps.check.outputs.new_ver }}
          NEW_BASE: ${{ steps.check.outputs.new_base }}
        run: |
          set -euo pipefail

          grep -qx "ARG TAILSCALE_VERSION=${NEW_TAG}" tailscale/Dockerfile
          grep -qx "ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:${NEW_BASE}" tailscale/Dockerfile
          grep -qx "version: \"${NEW_VER}\"" tailscale/config.yaml
          echo "✅ Giá trị trong Dockerfile/config.yaml đúng"

          grep -q '^FROM tailscale/tailscale:${TAILSCALE_VERSION}' tailscale/Dockerfile
          grep -q '^FROM ${BUILD_FROM}' tailscale/Dockerfile
          echo "✅ Dockerfile còn nguyên cấu trúc FROM"

          for f in $(grep -E '^COPY ' tailscale/Dockerfile | grep -v -- '--from' | awk '{print $2}'); do
            [ -e "tailscale/$f" ] || { echo "❌ Dockerfile COPY $f nhưng file không tồn tại"; exit 1; }
          done
          echo "✅ Các file COPY đều tồn tại"

          bash -n tailscale/run.sh
          echo "✅ run.sh không lỗi cú pháp"

          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml || pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import os, yaml
          c = yaml.safe_load(open("tailscale/config.yaml"))
          assert str(c["version"]) == os.environ["NEW_VER"], "version không khớp"
          for k in ("name", "slug", "arch", "options", "schema"):
              assert k in c, f"thiếu khóa {k}"
          extra = set(c["options"]) - set(c["schema"])
          assert not extra, f"options không có trong schema: {extra}"
          print("✅ config.yaml hợp lệ, options khớp schema")
          PY

          echo "- ✅ Các file hợp lệ, sẵn sàng build" >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Changelog: Luôn hiển thị 4 phiên bản gần nhất + Chi tiết Tailscale & Alpine
      # ------------------------------------------------------------------
      - name: Generate Changelog (Last 4 Releases + Alpine Info)
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VER: ${{ steps.check.outputs.new_ver }}
          OLD_VER: ${{ steps.check.outputs.old_ver }}
          NEW_BASE: ${{ steps.check.outputs.new_base }}
          OLD_BASE: ${{ steps.check.outputs.old_base }}
          NEW_TAG: ${{ steps.check.outputs.new_tag }}
        run: |
          FILE="tailscale/CHANGELOG.md"

          RELEASES=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/tailscale/tailscale/releases?per_page=4")

          {
            echo "# Changelog"
            echo ""
            FIRST=1
            echo "$RELEASES" | jq -c '.[]' | while read -r rel; do
              TAG=$(echo "$rel" | jq -r '.tag_name')
              V="${TAG#v}"
              DATE=$(echo "$rel" | jq -r '.published_at' | cut -d'T' -f1)
              BODY=$(echo "$rel" | jq -r '.body // "See official changelog at https://tailscale.com/changelog"')

              echo "## ${V}"
              echo "_Released: ${DATE}_"
              echo ""
              echo "### 📦 Cập nhật hệ thống (Component Updates)"
              if [ "$FIRST" -eq 1 ]; then
                if [ "$NEW_VER" != "$OLD_VER" ]; then
                  echo "- **Tailscale Engine (arm64 & amd64 verified):** Nâng cấp từ \`v${OLD_VER}\` ➡️ **\`v${NEW_VER}\`**"
                else
                  echo "- **Tailscale Engine (arm64 & amd64 verified):** Giữ nguyên **\`v${NEW_VER}\`**"
                fi
                if [ "$NEW_BASE" != "$OLD_BASE" ]; then
                  echo "- **Home Assistant Alpine Base:** Nâng cấp từ \`Alpine ${OLD_BASE}\` ➡️ **\`Alpine ${NEW_BASE}\`**"
                else
                  echo "- **Home Assistant Alpine Base:** \`Alpine ${NEW_BASE}\` (Đã xác thực tương thích gói hệ thống)"
                fi
                FIRST=0
              else
                echo "- **Tailscale Engine:** \`v${V}\`"
                echo "- **Home Assistant Alpine Base:** \`Alpine ${NEW_BASE}\`"
              fi
              echo "- **Nguồn phát hành chính thức:** [GitHub Release ${TAG}](https://github.com/tailscale/tailscale/releases/tag/${TAG}) | [Tailscale Full Changelog](https://tailscale.com/changelog#client)"
              echo ""
              echo "### 📝 Ghi chú phát hành từ Tailscale (${TAG})"
              echo "${BODY}"
              echo ""
              echo "---"
              echo ""
            done
          } > "$FILE"

          head -n 30 "$FILE"

      # ------------------------------------------------------------------
      # Commit + push có retry
      # ------------------------------------------------------------------
      - name: Commit and Push
        env:
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          NEW_VER: ${{ steps.check.outputs.new_ver }}
          NEW_BASE: ${{ steps.check.outputs.new_base }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add tailscale/

          if git diff --staged --quiet; then
            if [ "$UPDATE_NEEDED" == "true" ]; then
              echo "❌ Không có file nào thay đổi dù cần cập nhật, kiểm tra lại pattern sed!"
              exit 1
            fi
            echo "✨ Không có gì cần commit."
            exit 0
          fi

          if [ "$UPDATE_NEEDED" == "true" ]; then
            MSG="chore(tailscale): update to v${NEW_VER} (base ${NEW_BASE})"
          else
            MSG="chore(tailscale): update changelog to show last 4 releases & add-on docs"
          fi

          git commit -m "$MSG"

          OK=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              OK=1
              break
            fi
            echo "⚠️ Push lần $i thất bại, thử lại..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          [ "$OK" = "1" ] || { echo "❌ Push thất bại sau 3 lần"; exit 1; }

          git fetch origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] \
            || { echo "❌ Sau push, main trên GitHub không khớp bản local"; exit 1; }

          echo "🚀 Đã commit và xác nhận push thành công: $MSG"
