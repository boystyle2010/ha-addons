name: Auto Check Tailscale & Alpine Base (Verified)

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tailscale/**"
      - ".github/workflows/update-tailscale.yml"

permissions:
  contents: write

concurrency:
  group: update-tailscale
  cancel-in-progress: false

jobs:
  update-tailscale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 1. Tự tạo/đồng bộ các file, Badges & Changelog chuẩn Addon Version (1.0.1)
      # ------------------------------------------------------------------
      - name: Bootstrap missing add-on files, Badges & English Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D="tailscale"
          VER=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' "$D/config.yaml" || echo "1.0.1")
          CUR_TAG=$(grep -oP '^ARG TAILSCALE_VERSION=\K\S+' "$D/Dockerfile" || echo "v1.104.5")
          CUR_TS="${CUR_TAG#v}"
          CUR_ALPINE=$(grep -oP '^ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:\K[0-9.]+' "$D/Dockerfile" || echo "3.24")

          # Tự động làm mới nếu chưa có CHANGELOG.md, mục đầu tiên chưa khớp Addon Version ($VER), hoặc chưa có chi tiết thực tế
          NEED_CHANGELOG=0
          FIRST_HEADER=$(grep -m1 '^## ' "$D/CHANGELOG.md" 2>/dev/null | sed 's/^## //' || echo "")
          if [ ! -f "$D/CHANGELOG.md" ]; then
            NEED_CHANGELOG=1
          elif [ "$FIRST_HEADER" != "$VER" ]; then
            NEED_CHANGELOG=1
          elif [ "$(grep -c '^## ' "$D/CHANGELOG.md" || true)" -lt 4 ]; then
            NEED_CHANGELOG=1
          elif grep -q "Please refer to the changelog available at" "$D/CHANGELOG.md" 2>/dev/null; then
            NEED_CHANGELOG=1
          fi

          if [ "$NEED_CHANGELOG" -eq 1 ]; then
            echo "📝 Generating English CHANGELOG.md with Addon v${VER} at top & real Tailscale notes..."
            RELEASES=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/tailscale/tailscale/releases?per_page=8")

            # Tải trang changelog chính thức của Tailscale để bóc tách chi tiết từng bản
            curl -sfL "https://tailscale.com/changelog" -o /tmp/ts_changelog.html || true

            extract_ts_notes() {
              local ver="$1"
              python3 - "$ver" <<'PY'
          import sys, re, html
          ver = sys.argv[1]
          try:
              data = open("/tmp/ts_changelog.html", encoding="utf-8", errors="ignore").read()
              # Tìm khu vực của phiên bản tương ứng trên trang tailscale.com/changelog
              pat = re.compile(rf'(?:id=["\']client-{re.escape(ver)}["\']|>\s*{re.escape(ver)}\s*<)(.*?)(?:id=["\']client-[0-9]+\.[0-9]+|<h[23]\b)', re.S | re.I)
              m = pat.search(data)
              if m:
                  block = m.group(1)
                  items = re.findall(r'<li[^>]*>(.*?)</li>', block, re.S | re.I)
                  out = []
                  for it in items[:8]:
                      txt = re.sub(r'<[^>]+>', '', it)
                      txt = html.unescape( re.sub(r'\s+', ' ', txt).strip() )
                      if txt:
                          out.append(f"- {txt}")
                  if out:
                      print("\n".join(out))
                      sys.exit(0)
          except Exception:
              pass
          print(f"- Official stable maintenance and security release for Tailscale `v{ver}`.\n- Full details: [tailscale.com/changelog](https://tailscale.com/changelog)")
          PY
            }

            if [ -n "$RELEASES" ]; then
              {
                echo "# Changelog"
                echo ""
                COUNT=0
                FIRST=1
                while read -r rel; do
                  [ -z "$rel" ] && continue
                  TAG=$(echo "$rel" | jq -r '.tag_name // empty')
                  DRAFT=$(echo "$rel" | jq -r '.draft')
                  PRE=$(echo "$rel" | jq -r '.prerelease')
                  [ "$DRAFT" = "false" ] && [ "$PRE" = "false" ] || continue
                  [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue

                  V="${TAG#v}"
                  DATE=$(echo "$rel" | jq -r '.published_at' | cut -d'T' -f1)
                  BODY=$(echo "$rel" | jq -r '.body // empty')
                  if [ -z "$BODY" ] || [ "$BODY" = "null" ] || echo "$BODY" | grep -qi "Please refer to the changelog"; then
                    BODY=$(extract_ts_notes "$V")
                  fi

                  if [ "$FIRST" -eq 1 ]; then
                    echo "## ${VER}"
                    echo "_Released: ${DATE}_"
                    echo ""
                    echo "### 📦 Component Updates"
                    echo "- **Add-on Version:** \`v${VER}\`"
                    echo "- **Tailscale Engine (arm64 & amd64 verified):** Updated to **\`v${CUR_TS}\`**"
                    echo "- **Home Assistant Alpine Base Image:** \`Alpine ${CUR_ALPINE}\`"
                    echo "- **Official Release Source:** [GitHub Release ${CUR_TAG}](https://github.com/tailscale/tailscale/releases/tag/${CUR_TAG}) | [Tailscale Full Changelog](https://tailscale.com/changelog#client)"
                    echo ""
                    echo "### 📝 Upstream Release Notes (${CUR_TAG})"
                    FIRST=0
                  else
                    echo "## ${V}"
                    echo "_Released: ${DATE}_"
                    echo ""
                    echo "### 📦 System Components"
                    echo "- **Tailscale Engine (arm64 & amd64 verified):** \`v${V}\`"
                    echo "- **Home Assistant Alpine Base Image:** \`Alpine ${CUR_ALPINE}\`"
                    echo "- **Official Release Source:** [GitHub Release ${TAG}](https://github.com/tailscale/tailscale/releases/tag/${TAG}) | [Tailscale Full Changelog](https://tailscale.com/changelog#client)"
                    echo ""
                    echo "### 📝 Upstream Release Notes (${TAG})"
                  fi
                  echo "${BODY}"
                  echo ""
                  echo "---"
                  echo ""

                  COUNT=$((COUNT + 1))
                  [ "$COUNT" -ge 4 ] && break
                done < <(echo "$RELEASES" | jq -c '.[]')
              } > "$D/CHANGELOG.md"
            fi
          fi

          # Đồng bộ 6 ô màu Badges trong README.md
          if [ ! -f "$D/README.md" ] || ! grep -q "img.shields.io/badge/tailscale-" "$D/README.md" 2>/dev/null; then
            cat > "$D/README.md" <<EOF
          # Home Assistant App: Tailscale Pro

          ![Version](https://img.shields.io/badge/version-${VER}-blue.svg)
          ![Tailscale](https://img.shields.io/badge/tailscale-${CUR_TAG}-0052CC.svg)
          ![Alpine Base](https://img.shields.io/badge/alpine%20base-${CUR_ALPINE}-0D597F.svg)
          ![Project Stage](https://img.shields.io/badge/project%20stage-stable-brightgreen.svg)
          ![Maintained](https://img.shields.io/badge/maintained-yes-brightgreen.svg)
          ![Arch](https://img.shields.io/badge/arch-aarch64%20%7C%20amd64-blue.svg)

          Zero-config mesh VPN for building secure networks, tuned for Raspberry Pi 5.

          ## About

          Tailscale Pro connects your Home Assistant to your private Tailscale network in minutes. Reach your home from anywhere, share your local network as a subnet router, or route all your traffic through your home as an exit node.

          This add-on tracks the official Tailscale releases and updates itself automatically after passing a series of safety checks.

          ## Features

          - Subnet router and exit node
          - Web UI in the Home Assistant sidebar (Ingress)
          - Built-in health monitor with automatic recovery
          - UDP GRO forwarding optimization for higher throughput
          - Persistent login state, no need to sign in again after a restart
          - AppArmor protection
          - Automatic, verified updates from the official Tailscale repository
          - Taildrive & Taildrop built-in support
          EOF
          else
            sed -i "s|badge/version-[^-]*-blue.svg|badge/version-${VER}-blue.svg|g" "$D/README.md"
            sed -i "s|badge/tailscale-[^-]*-0052CC.svg|badge/tailscale-${CUR_TAG}-0052CC.svg|g" "$D/README.md"
            sed -i "s|badge/alpine%20base-[^-]*-0D597F.svg|badge/alpine%20base-${CUR_ALPINE}-0D597F.svg|g" "$D/README.md"
          fi

      # ------------------------------------------------------------------
      # 2. Kiểm tra nguồn gốc nhiều tầng + Smart Versioning (PATCH / MAJOR)
      # ------------------------------------------------------------------
      - name: Multi-layer upstream verification
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          skip() {
            echo "⏭️ $1"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "- ⏭️ $1" >> "$GITHUB_STEP_SUMMARY"
            print_summary_table
            exit 0
          }
          fail() {
            echo "❌ $1"
            echo "- ❌ $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          pass() {
            echo "✅ $1"
            echo "- ✅ $1" >> "$GITHUB_STEP_SUMMARY"
          }
          warn() {
            echo "⚠️ $1"
            echo "- ⚠️ $1" >> "$GITHUB_STEP_SUMMARY"
          }
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              sleep $((i * 5))
            done
            return 1
          }
          http_ok() {
            [ "$(curl -s -o /dev/null -L -I -w '%{http_code}' --max-time 30 "$1")" = "200" ]
          }
          base_ok() {
            docker manifest inspect "ghcr.io/home-assistant/$1-base:$2" >/dev/null 2>&1
          }
          tarball_ok() {
            local ver="${1#v}"
            for a in arm64 amd64; do
              http_ok "https://pkgs.tailscale.com/stable/tailscale_${ver}_${a}.tgz" || return 1
            done
            return 0
          }
          newer_or_equal() {
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
          }

          print_summary_table() {
            {
              echo ""
              echo "### 📊 Update Decision Summary - Tailscale Pro"
              echo ""
              echo "| Component                | Current          | Latest Verified  | Status                  |"
              echo "|--------------------------|------------------|------------------|-------------------------|"
              echo "| **Addon Version**        | \`${CURRENT_VER}\` | \`${NEW_ADDON_VER:-$CURRENT_VER}\` | $ADDON_STATUS |"
              echo "| **Tailscale Engine**     | \`${CURRENT_TS}\`  | \`${CLEAN_VER:-?}\` | $TS_STATUS |"
              echo "| **Alpine Base**          | \`${CURRENT_BASE}\`| \`${LATEST_BASE:-?}\` | $ALPINE_STATUS |"
              echo ""
              if [ "${update_needed:-false}" = "true" ]; then
                echo "**Action:** Will update Dockerfile + config.yaml + README badges and commit"
              else
                echo "**Action:** No version bump needed – syncing docs/changelog if modified"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          echo "### 🔍 Verification Summary" >> "$GITHUB_STEP_SUMMARY"

          CURRENT_VER=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' tailscale/config.yaml || true)
          CURRENT_TAG=$(grep -oP '^ARG TAILSCALE_VERSION=\K\S+' tailscale/Dockerfile || true)
          CURRENT_BASE=$(grep -oP '^ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:\K[0-9.]+' tailscale/Dockerfile || true)
          CURRENT_TS="${CURRENT_TAG#v}"

          [ -n "$CURRENT_VER" ]  || fail "Cannot read version in config.yaml"
          [ -n "$CURRENT_BASE" ] || fail "Cannot read BUILD_FROM in Dockerfile"

          CURRENT_BROKEN=0
          if ! tarball_ok "$CURRENT_TAG"; then
            warn "Current Dockerfile version ($CURRENT_TAG) tarball is missing! Activating self-healing..."
            CURRENT_BROKEN=1
          fi

          RELEASES_JSON=$(retry curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/tailscale/tailscale/releases?per_page=8") \
            || skip "GitHub API unreachable, retrying next cycle"

          LATEST_TAG=""
          CLEAN_VER=""
          for TAG_CAND in $(echo "$RELEASES_JSON" | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name'); do
            [[ "$TAG_CAND" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            VER_CAND="${TAG_CAND#v}"
            git ls-remote --exit-code --tags https://github.com/tailscale/tailscale.git "refs/tags/${TAG_CAND}" >/dev/null 2>&1 || continue
            if tarball_ok "$VER_CAND"; then
              LATEST_TAG="$TAG_CAND"
              CLEAN_VER="$VER_CAND"
              break
            fi
          done

          [ -n "$LATEST_TAG" ] || skip "No verified upstream release found with ready binaries"
          pass "Layers 1-5: Verified latest buildable release is $LATEST_TAG (Git tag & official arm64/amd64 binaries ready)"

          LATEST_BASE="$CURRENT_BASE"
          BASE_MAJOR="${CURRENT_BASE%%.*}"
          BASE_MINOR="${CURRENT_BASE#*.}"
          CAND="$CURRENT_BASE"
          for i in 1 2 3; do
            NEXT="${BASE_MAJOR}.$((BASE_MINOR + i))"
            if base_ok aarch64 "$NEXT"; then CAND="$NEXT"; else break; fi
          done

          if [ "$CAND" != "$CURRENT_BASE" ]; then
            PKGS=$(sed -n '/apk add/,/&&/p' tailscale/Dockerfile | grep -oE '^[[:space:]]+[a-z0-9._+-]+' | tr -d ' \t' | tr '\n' ' ')
            if [ -z "$PKGS" ] || docker run --rm --entrypoint sh "ghcr.io/home-assistant/amd64-base:${CAND}" \
                 -c "apk add --simulate --no-cache ${PKGS}" >/tmp/apk-test.log 2>&1; then
              LATEST_BASE="$CAND"
              pass "Layer 6: Alpine $CAND verified with all packages, upgrading $CURRENT_BASE -> $CAND"
            fi
          fi

          TS_UPDATE=0
          ALPINE_UPDATE=0
          FORCE_MIGRATE=0
          TS_STATUS="✅ Up to date"
          ALPINE_STATUS="✅ Up to date"
          ADDON_STATUS="✅ Up to date"
          NEW_ADDON_VER="$CURRENT_VER"

          if [ "$CURRENT_BROKEN" -eq 1 ]; then
            TS_UPDATE=1
            TS_STATUS="🔧 Self-heal → $CLEAN_VER"
          elif [ "$CLEAN_VER" != "$CURRENT_TS" ] && newer_or_equal "$CLEAN_VER" "$CURRENT_TS"; then
            TS_UPDATE=1
            TS_STATUS="⬆️ UPDATE → $CLEAN_VER"
          fi

          if [ "$LATEST_BASE" != "$CURRENT_BASE" ]; then
            ALPINE_UPDATE=1
            ALPINE_STATUS="⬆️ UPDATE → $LATEST_BASE"
          fi

          if [[ "$CURRENT_VER" =~ ^1\.10[0-9] ]]; then
            FORCE_MIGRATE=1
            NEW_ADDON_VER="1.0.0"
            ADDON_STATUS="🚀 MIGRATE → 1.0.0"
          fi

          if [ "$TS_UPDATE" -eq 0 ] && [ "$ALPINE_UPDATE" -eq 0 ] && [ "$FORCE_MIGRATE" -eq 0 ]; then
            update_needed=false
            skip "Both Tailscale $CURRENT_TS and Alpine $CURRENT_BASE are already up to date and verified"
          fi

          if [ "$FORCE_MIGRATE" -eq 0 ]; then
            CUR_MAJOR=$(echo "$CURRENT_VER" | cut -d. -f1)
            CUR_MINOR=$(echo "$CURRENT_VER" | cut -d. -f2)
            CUR_PATCH=$(echo "$CURRENT_VER" | cut -d. -f3)

            if [ "$TS_UPDATE" -eq 1 ] && [ "$ALPINE_UPDATE" -eq 1 ]; then
              NEW_MAJOR=$((CUR_MAJOR + 1))
              NEW_ADDON_VER="${NEW_MAJOR}.0.0"
              ADDON_STATUS="🚀 MAJOR → $NEW_ADDON_VER (both components updated)"
            else
              NEW_PATCH=$((CUR_PATCH + 1))
              NEW_ADDON_VER="${CUR_MAJOR}.${CUR_MINOR}.${NEW_PATCH}"
              ADDON_STATUS="⬆️ PATCH → $NEW_ADDON_VER"
            fi
          fi

          update_needed=true
          {
            echo "update_needed=true"
            echo "new_tag=$LATEST_TAG"
            echo "new_ver=$CLEAN_VER"
            echo "new_base=$LATEST_BASE"
            echo "old_ver=$CURRENT_VER"
            echo "old_ts=$CURRENT_TS"
            echo "old_base=$CURRENT_BASE"
            echo "new_addon_ver=$NEW_ADDON_VER"
            echo "ts_update=$TS_UPDATE"
            echo "alpine_update=$ALPINE_UPDATE"
            echo "force_migrate=$FORCE_MIGRATE"
          } >> "$GITHUB_OUTPUT"

          print_summary_table

      # ------------------------------------------------------------------
      # 3. Cập nhật Dockerfile, config.yaml, README Badges & Changelog
      # ------------------------------------------------------------------
      - name: Update Dockerfile, config.yaml, Badges & Changelog
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.check.outputs.new_tag }}
          NEW_VER: ${{ steps.check.outputs.new_ver }}
          OLD_VER: ${{ steps.check.outputs.old_ver }}
          OLD_TS: ${{ steps.check.outputs.old_ts }}
          NEW_BASE: ${{ steps.check.outputs.new_base }}
          OLD_BASE: ${{ steps.check.outputs.old_base }}
          NEW_ADDON_VER: ${{ steps.check.outputs.new_addon_ver }}
          TS_UPDATE: ${{ steps.check.outputs.ts_update }}
          ALPINE_UPDATE: ${{ steps.check.outputs.alpine_update }}
        run: |
          set -e

          sed -i "s|^ARG BUILD_FROM=.*|ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:${NEW_BASE}|" tailscale/Dockerfile
          sed -i "s|^ARG TAILSCALE_VERSION=.*|ARG TAILSCALE_VERSION=${NEW_TAG}|" tailscale/Dockerfile
          sed -i "s|^version:.*|version: \"${NEW_ADDON_VER}\"|" tailscale/config.yaml

          if [ -f "tailscale/README.md" ]; then
            sed -i "s|badge/version-[^-]*-blue.svg|badge/version-${NEW_ADDON_VER}-blue.svg|g" tailscale/README.md
            sed -i "s|badge/tailscale-[^-]*-0052CC.svg|badge/tailscale-${NEW_TAG}-0052CC.svg|g" tailscale/README.md
            sed -i "s|badge/alpine%20base-[^-]*-0D597F.svg|badge/alpine%20base-${NEW_BASE}-0D597F.svg|g" tailscale/README.md
          fi

          curl -sfL "https://tailscale.com/changelog" -o /tmp/ts_changelog.html || true
          extract_ts_notes() {
            local ver="$1"
            python3 - "$ver" <<'PY'
          import sys, re, html
          ver = sys.argv[1]
          try:
              data = open("/tmp/ts_changelog.html", encoding="utf-8", errors="ignore").read()
              pat = re.compile(rf'(?:id=["\']client-{re.escape(ver)}["\']|>\s*{re.escape(ver)}\s*<)(.*?)(?:id=["\']client-[0-9]+\.[0-9]+|<h[23]\b)', re.S | re.I)
              m = pat.search(data)
              if m:
                  block = m.group(1)
                  items = re.findall(r'<li[^>]*>(.*?)</li>', block, re.S | re.I)
                  out = []
                  for it in items[:8]:
                      txt = re.sub(r'<[^>]+>', '', it)
                      txt = html.unescape( re.sub(r'\s+', ' ', txt).strip() )
                      if txt:
                          out.append(f"- {txt}")
                  if out:
                      print("\n".join(out))
                      sys.exit(0)
          except Exception:
              pass
          print(f"- Official stable maintenance and security release for Tailscale `v{ver}`.\n- Full details: [tailscale.com/changelog](https://tailscale.com/changelog)")
          PY
          }

          RELEASES=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/tailscale/tailscale/releases?per_page=8")

          {
            echo "# Changelog"
            echo ""
            echo "## ${NEW_ADDON_VER}"
            echo "_Released: $(date -u +%Y-%m-%d)_"
            echo ""
            echo "### 📦 Component Updates"
            echo "- **Add-on Version:** Bumped from \`${OLD_VER}\` ➡️ **\`${NEW_ADDON_VER}\`**"
            if [ "$TS_UPDATE" = "1" ]; then
              echo "- **Tailscale Engine (arm64 & amd64 verified):** Updated from \`v${OLD_TS}\` ➡️ **\`v${NEW_VER}\`**"
            else
              echo "- **Tailscale Engine (arm64 & amd64 verified):** \`v${NEW_VER}\`"
            fi
            if [ "$ALPINE_UPDATE" = "1" ]; then
              echo "- **Home Assistant Alpine Base:** Updated from \`Alpine ${OLD_BASE}\` ➡️ **\`Alpine ${NEW_BASE}\`**"
            else
              echo "- **Home Assistant Alpine Base:** \`Alpine ${NEW_BASE}\`"
            fi
            echo "- **Official Release Source:** [GitHub Release ${NEW_TAG}](https://github.com/tailscale/tailscale/releases/tag/${NEW_TAG}) | [Tailscale Full Changelog](https://tailscale.com/changelog#client)"
            echo ""
            echo "### 📝 Upstream Release Notes (${NEW_TAG})"
            extract_ts_notes "$NEW_VER"
            echo ""
            echo "---"
            echo ""

            COUNT=1
            while read -r rel; do
              [ -z "$rel" ] && continue
              TAG=$(echo "$rel" | jq -r '.tag_name // empty')
              DRAFT=$(echo "$rel" | jq -r '.draft')
              PRE=$(echo "$rel" | jq -r '.prerelease')
              [ "$DRAFT" = "false" ] && [ "$PRE" = "false" ] || continue
              [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue

              V="${TAG#v}"
              [ "$V" = "$NEW_VER" ] && continue

              DATE=$(echo "$rel" | jq -r '.published_at' | cut -d'T' -f1)
              echo "## ${V}"
              echo "_Released: ${DATE}_"
              echo ""
              echo "### 📦 System Components"
              echo "- **Tailscale Engine:** \`v${V}\`"
              echo "- **Home Assistant Alpine Base:** \`Alpine ${NEW_BASE}\`"
              echo "- **Official Release Source:** [GitHub Release ${TAG}](https://github.com/tailscale/tailscale/releases/tag/${TAG}) | [Tailscale Full Changelog](https://tailscale.com/changelog#client)"
              echo ""
              echo "### 📝 Upstream Release Notes (${TAG})"
              extract_ts_notes "$V"
              echo ""
              echo "---"
              echo ""

              COUNT=$((COUNT + 1))
              [ "$COUNT" -ge 4 ] && break
            done < <(echo "$RELEASES" | jq -c '.[]')
          } > tailscale/CHANGELOG.md

      # ------------------------------------------------------------------
      # 4. Commit + Push
      # ------------------------------------------------------------------
      - name: Commit and Push
        env:
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          NEW_ADDON_VER: ${{ steps.check.outputs.new_addon_ver }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add tailscale/

          if git diff --staged --quiet; then
            echo "✨ Nothing to commit."
            exit 0
          fi

          if [ "$UPDATE_NEEDED" = "true" ]; then
            MSG="chore(tailscale): bump to v${NEW_ADDON_VER}"
          else
            MSG="chore(tailscale): fix changelog header to match add-on version & add detailed release notes"
          fi

          git commit -m "$MSG"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "🚀 Successfully committed and pushed: $MSG"
