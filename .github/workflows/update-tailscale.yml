name: Auto Check Tailscale & Alpine Base (Verified)

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tailscale/**"
      - ".github/workflows/update-tailscale.yml"

permissions:
  contents: write

concurrency:
  group: update-tailscale
  cancel-in-progress: false

jobs:
  update-tailscale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # Tự tạo các file còn thiếu & tạo CHANGELOG.md tiếng Anh (4 bản gần nhất)
      # ------------------------------------------------------------------
      - name: Bootstrap missing add-on files & English Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D="tailscale"
          VER=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' $D/config.yaml || echo "1.104.4")
          CUR_ALPINE=$(grep -oP '^ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:\K[0-9.]+' $D/Dockerfile || echo "3.23")

          # Tự động làm mới nếu chưa có CHANGELOG.md, có ít hơn 4 bản, hoặc còn sót tiếng Việt cũ
          NEED_CHANGELOG=0
          if [ ! -f "$D/CHANGELOG.md" ]; then
            NEED_CHANGELOG=1
          elif [ "$(grep -c '^## ' "$D/CHANGELOG.md" || true)" -lt 4 ]; then
            NEED_CHANGELOG=1
          elif grep -q "Thành phần hệ thống\|Cập nhật hệ thống" "$D/CHANGELOG.md" 2>/dev/null; then
            NEED_CHANGELOG=1
          fi

          if [ "$NEED_CHANGELOG" -eq 1 ]; then
            echo "📝 Generating English CHANGELOG.md with the last 4 verified releases..."
            RELEASES=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/tailscale/tailscale/releases?per_page=6")

            if [ -n "$RELEASES" ]; then
              {
                echo "# Changelog"
                echo ""
                COUNT=0
                while read -r rel; do
                  [ -z "$rel" ] && continue
                  TAG=$(echo "$rel" | jq -r '.tag_name // empty')
                  DRAFT=$(echo "$rel" | jq -r '.draft')
                  PRE=$(echo "$rel" | jq -r '.prerelease')
                  [ "$DRAFT" = "false" ] && [ "$PRE" = "false" ] || continue
                  [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue

                  V="${TAG#v}"
                  DATE=$(echo "$rel" | jq -r '.published_at' | cut -d'T' -f1)
                  BODY=$(echo "$rel" | jq -r '.body // "See official release notes at https://tailscale.com/changelog"')

                  echo "## ${V}"
                  echo "_Released: ${DATE}_"
                  echo ""
                  echo "### 📦 System Components"
                  echo "- **Tailscale Engine (arm64 & amd64 verified):** \`v${V}\`"
                  echo "- **Home Assistant Alpine Base Image:** \`Alpine ${CUR_ALPINE}\`"
                  echo "- **Official Release Source:** [GitHub Release ${TAG}](https://github.com/tailscale/tailscale/releases/tag/${TAG}) | [Tailscale Full Changelog](https://tailscale.com/changelog#client)"
                  echo ""
                  echo "### 🔄 Upstream Release Notes (${TAG})"
                  echo "${BODY}"
                  echo ""
                  echo "---"
                  echo ""

                  COUNT=$((COUNT + 1))
                  [ "$COUNT" -ge 4 ] && break
                done < <(echo "$RELEASES" | jq -c '.[]')
              } > "$D/CHANGELOG.md"
            fi
          fi

          if [ ! -f "$D/README.md" ]; then
            echo "📝 Creating README.md"
            cat > "$D/README.md" <<'EOF'
          # Home Assistant App: Tailscale Pro

          High-stability, upstream-synced Tailscale mesh VPN and Subnet Router for Home Assistant, tuned for Raspberry Pi 5.

          ## Features

          - Always up to date: a bot checks for new official Tailscale releases and updates this add-on automatically
          - Subnet router and exit node support
          - Web UI integrated in the Home Assistant sidebar (Ingress)
          - Taildrive & Taildrop built-in support
          - Built-in health monitor: restarts the connection automatically if it becomes unstable
          - UDP GRO forwarding optimization for better throughput
          - Persistent state, so you do not need to log in again after a restart
          - Supports aarch64

          ## Installation

          1. Add this repository to the Home Assistant Add-on Store
          2. Install **Tailscale Pro**
          3. Fill in the configuration (see the Documentation tab)
          4. Start the add-on

          See the **Documentation** tab for full setup instructions.
          EOF
          fi

          if [ ! -f "$D/DOCS.md" ]; then
            echo "📝 Creating DOCS.md"
            cat > "$D/DOCS.md" <<'EOF'
          # Home Assistant App: Tailscale Pro

          ## Quick start

          1. Create an auth key at https://login.tailscale.com/admin/settings/keys
             (reusable keys are recommended)
          2. Paste it into the **auth_key** option and start the add-on
          3. Open the **Tailscale Pro** panel in the sidebar to check the status
          4. If you use subnet routes or an exit node, approve them in the Tailscale
             admin console (Machines -> your device -> Edit route settings)

          You can also leave **auth_key** empty and log in through the Web UI instead.
          EOF
          fi

          if [ ! -f "$D/icon.png" ] || [ ! -f "$D/logo.png" ]; then
            echo "🎨 Creating icon.png / logo.png"
            python3 -c "import PIL" 2>/dev/null || pip install --quiet pillow || pip install --quiet --break-system-packages pillow
            ICON_OUT="$D/icon.png" LOGO_OUT="$D/logo.png" python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont

          def make_icon(size):
              S = size * 4
              grad = Image.new("RGBA", (S, S))
              px = grad.load()
              c1, c2 = (30, 58, 138), (59, 130, 246)
              for y in range(S):
                  t = y / (S - 1)
                  col = tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3)) + (255,)
                  for x in range(S):
                      px[x, y] = col
              mask = Image.new("L", (S, S), 0)
              ImageDraw.Draw(mask).rounded_rectangle((0, 0, S - 1, S - 1), radius=int(S * 0.22), fill=255)
              img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              img.paste(grad, (0, 0), mask)

              d = ImageDraw.Draw(img)
              pts = [(0.5, 0.26), (0.26, 0.68), (0.74, 0.68)]
              pts = [(int(x * S), int(y * S)) for x, y in pts]
              center = (int(0.5 * S), int(0.52 * S))
              w = max(2, int(S * 0.035))
              white = (255, 255, 255, 255)
              for i in range(3):
                  d.line([pts[i], pts[(i + 1) % 3]], fill=white, width=w)
                  d.line([pts[i], center], fill=(255, 255, 255, 190), width=w)
              r = int(S * 0.085)
              for p in pts:
                  d.ellipse((p[0] - r, p[1] - r, p[0] + r, p[1] + r), fill=white)
              rc = int(S * 0.065)
              d.ellipse((center[0] - rc, center[1] - rc, center[0] + rc, center[1] + rc), fill=white)
              return img.resize((size, size), Image.LANCZOS)

          def find_font(px):
              for path in (
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
              ):
                  if os.path.exists(path):
                      return ImageFont.truetype(path, px)
              return ImageFont.load_default()

          make_icon(128).save(os.environ["ICON_OUT"])

          W, H = 1000, 400
          logo = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          ic = make_icon(300)
          logo.paste(ic, (20, (H - 300) // 2), ic)
          text = "Tailscale Pro"
          fs = 90
          font = find_font(fs)
          while fs > 20:
              font = find_font(fs)
              box = ImageDraw.Draw(logo).textbbox((0, 0), text, font=font)
              if box[2] - box[0] <= W - 360 - 20:
                  break
              fs -= 4
          d = ImageDraw.Draw(logo)
          box = d.textbbox((0, 0), text, font=font)
          ty = (H - (box[3] - box[1])) // 2 - box[1]
          d.text((350, ty), text, font=font, fill=(91, 141, 239, 255))
          logo.resize((250, 100), Image.LANCZOS).save(os.environ["LOGO_OUT"])
          PY
          fi

      # ------------------------------------------------------------------
      # Kiểm tra nguồn gốc nhiều tầng + Tự động chữa lành nếu tag hiện tại bị lỗi
      # ------------------------------------------------------------------
      - name: Multi-layer upstream verification
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          skip() {
            echo "⏭️ $1"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "- ⏭️ $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          fail() {
            echo "❌ $1"
            echo "- ❌ $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          pass() {
            echo "✅ $1"
            echo "- ✅ $1" >> "$GITHUB_STEP_SUMMARY"
          }
          warn() {
            echo "⚠️ $1"
            echo "- ⚠️ $1" >> "$GITHUB_STEP_SUMMARY"
          }
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              sleep $((i * 5))
            done
            return 1
          }
          http_ok() {
            [ "$(curl -s -o /dev/null -L -I -w '%{http_code}' --max-time 30 "$1")" = "200" ]
          }
          base_ok() {
            docker manifest inspect "ghcr.io/home-assistant/$1-base:$2" >/dev/null 2>&1
          }
          docker_tag_ok() {
            local tag="$1"
            local m
            m=$(docker manifest inspect "tailscale/tailscale:${tag}" 2>/dev/null) || return 1
            for a in arm64 amd64; do
              local d
              d=$(echo "$m" | jq -r --arg arch "$a" '.manifests[]? | select(.platform.architecture == $arch and .platform.os == "linux") | .digest' | head -n1)
              [ -n "$d" ] || return 1
            done
            return 0
          }
          newer_or_equal() {
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
          }

          echo "### 🔍 Verification Summary" >> "$GITHUB_STEP_SUMMARY"

          # ---- Đọc phiên bản hiện tại ----
          CURRENT_VER=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' tailscale/config.yaml || true)
          CURRENT_TAG=$(grep -oP '^ARG TAILSCALE_VERSION=\K\S+' tailscale/Dockerfile || true)
          CURRENT_BASE=$(grep -oP '^ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:\K[0-9.]+' tailscale/Dockerfile || true)
          [ -n "$CURRENT_VER" ]  || fail "Cannot read version in config.yaml"
          [ -n "$CURRENT_BASE" ] || fail "Cannot read BUILD_FROM in Dockerfile"
          echo "📌 Current Repo State: config=$CURRENT_VER | Dockerfile=$CURRENT_TAG | Alpine=$CURRENT_BASE"

          # ---- Kiểm tra xem tag hiện tại trong Dockerfile có tồn tại trên Docker Hub không (Self-Healing) ----
          CURRENT_BROKEN=0
          if ! docker_tag_ok "$CURRENT_TAG"; then
            warn "Current Dockerfile tag ($CURRENT_TAG) is missing on Docker Hub! Activating self-healing fallback..."
            CURRENT_BROKEN=1
          fi

          # ---- Lớp 1 -> 5: Quét các bản phát hành gần nhất để tìm bản MỚI NHẤT ĐÃ CÓ DOCKER IMAGE & TARBALL ----
          RELEASES_JSON=$(retry curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/tailscale/tailscale/releases?per_page=8") \
            || skip "GitHub API unreachable, retrying next cycle"

          LATEST_TAG=""
          CLEAN_VER=""
          for TAG_CAND in $(echo "$RELEASES_JSON" | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name'); do
            [[ "$TAG_CAND" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            VER_CAND="${TAG_CAND#v}"

            # Kiểm tra tag tồn tại trên git
            git ls-remote --exit-code --tags https://github.com/tailscale/tailscale.git "refs/tags/${TAG_CAND}" >/dev/null 2>&1 || continue

            # Kiểm tra tarball arm64 + amd64
            TARBALL_READY=1
            for ARCH in arm64 amd64; do
              http_ok "https://pkgs.tailscale.com/stable/tailscale_${VER_CAND}_${ARCH}.tgz" || { TARBALL_READY=0; break; }
            done
            [ "$TARBALL_READY" -eq 1 ] || { echo "⏳ $TAG_CAND tarballs not ready yet, checking previous..."; continue; }

            # Kiểm tra Docker Hub image (linux/arm64 + linux/amd64)
            if docker_tag_ok "$TAG_CAND"; then
              LATEST_TAG="$TAG_CAND"
              CLEAN_VER="$VER_CAND"
              break
            else
              echo "⏳ $TAG_CAND Docker Hub image not published yet, checking previous..."
            fi
          done

          [ -n "$LATEST_TAG" ] || skip "No verified upstream release found with ready Docker images"
          pass "Layers 1-5: Verified latest buildable release is $LATEST_TAG (Git tag, tarballs & Docker arm64/amd64 ready)"

          # ---- Lớp 3: Chống hạ cấp (Trừ khi bản hiện tại trên repo đang bị lỗi Docker image) ----
          if [ "$CURRENT_BROKEN" -eq 0 ]; then
            newer_or_equal "$CLEAN_VER" "$CURRENT_VER" \
              || skip "Latest verified release ($CLEAN_VER) is not newer than current ($CURRENT_VER), keeping current"
            if [ "$CLEAN_VER" = "$CURRENT_VER" ]; then
              skip "Tailscale $CURRENT_VER is already up to date and verified"
            fi
          else
            pass "Self-healing: Repairing broken Dockerfile tag ($CURRENT_TAG -> $LATEST_TAG)"
          fi

          # ---- Lớp 6: Alpine base (chỉ nâng khi gói apk tương thích hoàn toàn) ----
          LATEST_BASE="$CURRENT_BASE"
          BASE_MAJOR="${CURRENT_BASE%%.*}"
          BASE_MINOR="${CURRENT_BASE#*.}"
          CAND="$CURRENT_BASE"
          for i in 1 2 3; do
            NEXT="${BASE_MAJOR}.$((BASE_MINOR + i))"
            if base_ok aarch64 "$NEXT"; then CAND="$NEXT"; else break; fi
          done

          if [ "$CAND" = "$CURRENT_BASE" ]; then
            echo "ℹ️ Alpine $CURRENT_BASE is already the latest verified base"
          else
            PKGS=$(sed -n '/apk add/,/^$/p' tailscale/Dockerfile | grep -oE '^[[:space:]]+[a-z0-9._+-]+' | tr -d ' \t' | tr '\n' ' ')
            if [ -z "$PKGS" ]; then
              warn "Layer 6: Could not parse packages from Dockerfile, keeping Alpine $CURRENT_BASE"
            elif docker run --rm --entrypoint sh "ghcr.io/home-assistant/amd64-base:${CAND}" \
                   -c "apk add --simulate --no-cache ${PKGS}" >/tmp/apk-test.log 2>&1; then
              LATEST_BASE="$CAND"
              pass "Layer 6: Alpine $CAND verified with all packages (${PKGS}), upgrading $CURRENT_BASE -> $CAND"
            else
              warn "Layer 6: Alpine $CAND failed package simulation, keeping Alpine $CURRENT_BASE"
              tail -n 5 /tmp/apk-test.log || true
            fi
          fi

          {
            echo "update_needed=true"
            echo "new_tag=$LATEST_TAG"
            echo "new_ver=$CLEAN_VER"
            echo "new_base=$LATEST_BASE"
            echo "old_ver=$CURRENT_VER"
            echo "old_base=$CURRENT_BASE"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Cập nhật file
      # ------------------------------------------------------------------
      - name: Update Dockerfile and config.yaml
        if: steps.check.outputs.update_needed == 'true'
        run: |
          NEW_TAG="${{ steps.check.outputs.new_tag }}"
          NEW_VER="${{ steps.check.outputs.new_ver }}"
          NEW_BASE="${{ steps.check.outputs.new_base }}"

          echo "🛠️ Updating to Tailscale v${NEW_VER} (Alpine Base ${NEW_BASE})..."
          sed -i "s|^ARG BUILD_FROM=.*|ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:${NEW_BASE}|" tailscale/Dockerfile
          sed -i "s|^ARG TAILSCALE_VERSION=.*|ARG TAILSCALE_VERSION=${NEW_TAG}|" tailscale/Dockerfile
          sed -i "s|^version:.*|version: \"${NEW_VER}\"|" tailscale/config.yaml

          git diff --stat

      # ------------------------------------------------------------------
      # Kiểm tra file sau khi sửa (sẵn sàng để build)
      # ------------------------------------------------------------------
      - name: Validate edited files
        if: steps.check.outputs.update_needed == 'true'
        env:
          NEW_TAG: ${{ steps.check.outputs.new_tag }}
          NEW_VER: ${{ steps.check.outputs.new_ver }}
          NEW_BASE: ${{ steps.check.outputs.new_base }}
        run: |
          set -euo pipefail

          grep -qx "ARG TAILSCALE_VERSION=${NEW_TAG}" tailscale/Dockerfile
          grep -qx "ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:${NEW_BASE}" tailscale/Dockerfile
          grep -qx "version: \"${NEW_VER}\"" tailscale/config.yaml
          echo "✅ Values in Dockerfile and config.yaml verified"

          grep -q '^FROM tailscale/tailscale:${TAILSCALE_VERSION}' tailscale/Dockerfile
          grep -q '^FROM ${BUILD_FROM}' tailscale/Dockerfile
          echo "✅ Dockerfile FROM structure intact"

          for f in $(grep -E '^COPY ' tailscale/Dockerfile | grep -v -- '--from' | awk '{print $2}'); do
            [ -e "tailscale/$f" ] || { echo "❌ Dockerfile COPY $f does not exist"; exit 1; }
          done
          echo "✅ All COPY files exist"

          bash -n tailscale/run.sh
          echo "✅ run.sh syntax verified"

          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml || pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import os, yaml
          c = yaml.safe_load(open("tailscale/config.yaml"))
          assert str(c["version"]) == os.environ["NEW_VER"], "version mismatch"
          for k in ("name", "slug", "arch", "options", "schema"):
              assert k in c, f"missing key {k}"
          extra = set(c["options"]) - set(c["schema"])
          assert not extra, f"options not in schema: {extra}"
          print("✅ config.yaml schema verified")
          PY

          echo "- ✅ All files validated and ready to build" >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Changelog Tiếng Anh: Luôn hiển thị 4 phiên bản gần nhất + Chi tiết Tailscale & Alpine
      # ------------------------------------------------------------------
      - name: Generate Changelog (Last 4 Releases in English)
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VER: ${{ steps.check.outputs.new_ver }}
          OLD_VER: ${{ steps.check.outputs.old_ver }}
          NEW_BASE: ${{ steps.check.outputs.new_base }}
          OLD_BASE: ${{ steps.check.outputs.old_base }}
          NEW_TAG: ${{ steps.check.outputs.new_tag }}
        run: |
          FILE="tailscale/CHANGELOG.md"

          RELEASES=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/tailscale/tailscale/releases?per_page=8")

          {
            echo "# Changelog"
            echo ""
            FIRST=1
            COUNT=0
            while read -r rel; do
              [ -z "$rel" ] && continue
              TAG=$(echo "$rel" | jq -r '.tag_name // empty')
              DRAFT=$(echo "$rel" | jq -r '.draft')
              PRE=$(echo "$rel" | jq -r '.prerelease')
              [ "$DRAFT" = "false" ] && [ "$PRE" = "false" ] || continue
              [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue

              V="${TAG#v}"
              # Bỏ qua các tag mới hơn NEW_VER nhưng chưa có Docker image
              if [ "$(printf '%s\n%s\n' "$V" "$NEW_VER" | sort -V | tail -n1)" = "$V" ] && [ "$V" != "$NEW_VER" ]; then
                continue
              fi

              DATE=$(echo "$rel" | jq -r '.published_at' | cut -d'T' -f1)
              BODY=$(echo "$rel" | jq -r '.body // "See official changelog at https://tailscale.com/changelog"')

              echo "## ${V}"
              echo "_Released: ${DATE}_"
              echo ""
              echo "### 📦 Component Updates"
              if [ "$FIRST" -eq 1 ]; then
                if [ "$NEW_VER" != "$OLD_VER" ]; then
                  echo "- **Tailscale Engine (arm64 & amd64 verified):** Updated from \`v${OLD_VER}\` ➡️ **\`v${NEW_VER}\`**"
                else
                  echo "- **Tailscale Engine (arm64 & amd64 verified):** Verified at **\`v${NEW_VER}\`**"
                fi
                if [ "$NEW_BASE" != "$OLD_BASE" ]; then
                  echo "- **Home Assistant Alpine Base:** Updated from \`Alpine ${OLD_BASE}\` ➡️ **\`Alpine ${NEW_BASE}\`**"
                else
                  echo "- **Home Assistant Alpine Base:** \`Alpine ${NEW_BASE}\` (Verified package compatibility)"
                fi
                FIRST=0
              else
                echo "- **Tailscale Engine:** \`v${V}\`"
                echo "- **Home Assistant Alpine Base:** \`Alpine ${NEW_BASE}\`"
              fi
              echo "- **Official Release Source:** [GitHub Release ${TAG}](https://github.com/tailscale/tailscale/releases/tag/${TAG}) | [Tailscale Full Changelog](https://tailscale.com/changelog#client)"
              echo ""
              echo "### 📝 Upstream Release Notes (${TAG})"
              echo "${BODY}"
              echo ""
              echo "---"
              echo ""

              COUNT=$((COUNT + 1))
              [ "$COUNT" -ge 4 ] && break
            done < <(echo "$RELEASES" | jq -c '.[]')
          } > "$FILE"

          head -n 30 "$FILE"

      # ------------------------------------------------------------------
      # Commit + push có retry
      # ------------------------------------------------------------------
      - name: Commit and Push
        env:
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          NEW_VER: ${{ steps.check.outputs.new_ver }}
          NEW_BASE: ${{ steps.check.outputs.new_base }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add tailscale/

          if git diff --staged --quiet; then
            if [ "$UPDATE_NEEDED" == "true" ]; then
              echo "✨ Files are already at the target version."
              exit 0
            fi
            echo "✨ Nothing to commit."
            exit 0
          fi

          if [ "$UPDATE_NEEDED" == "true" ]; then
            MSG="chore(tailscale): update to v${NEW_VER} (base ${NEW_BASE})"
          else
            MSG="chore(tailscale): update English changelog (last 4 releases) & add-on docs"
          fi

          git commit -m "$MSG"

          OK=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              OK=1
              break
            fi
            echo "⚠️ Push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          [ "$OK" = "1" ] || { echo "❌ Push failed after 3 attempts"; exit 1; }

          git fetch origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] \
            || { echo "❌ Remote main does not match local HEAD after push"; exit 1; }

          echo "🚀 Successfully committed and pushed: $MSG"
