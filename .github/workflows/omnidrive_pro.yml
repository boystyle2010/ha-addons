name: OmniDrive Pro - Auto Update & Verify

on:
  schedule:
    # Tự động kiểm tra bản mới vào 07:00 UTC hàng ngày
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "omnidrive_pro/**"
      - ".github/workflows/omnidrive_pro.yml"
      - ".github/workflows/omnidrive_pro.yaml"

permissions:
  contents: write
  packages: write

concurrency:
  group: omnidrive_pro_workflow
  cancel-in-progress: false

jobs:
  update_and_verify:
    name: "🚀 OmniDrive Pro CI/CD Pipeline"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: "📥 1. Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "🎨 2. Sync Multi-Arch Config & Generate OmniDrive Pro Icon/Logo"
        id: gen_icons
        run: |
          set -e
          echo "::group::🎨 Kiểm tra cấu hình chuẩn mới & Bộ Icon/Logo OmniDrive Pro"
          ICONS_CREATED="false"
          ICON_STATUS="✅ Đã có sẵn (Giữ nguyên)"

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if ! grep -q '^image:' omnidrive_pro/config.yaml; then
            sed -i "/^slug:/a image: \"ghcr.io/${OWNER_LC}/omnidrive_pro-{arch}\"" omnidrive_pro/config.yaml
          fi
          # Loại bỏ build.yaml theo chuẩn mới của Home Assistant
          rm -f omnidrive_pro/build.yaml

          if [ ! -f "omnidrive_pro/icon.png" ] || [ ! -f "omnidrive_pro/logo.png" ] || [ ! -f "omnidrive_pro/.omnidrive_art_v3" ]; then
            echo "⏳ Đang cài đặt librsvg2-bin và kết xuất bộ nhận diện OmniDrive Pro mới..."
            sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

            cat << 'EOF' > /tmp/icon.svg
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
              <defs>
                <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0b1120"/>
                  <stop offset="50%" stop-color="#0f172a"/>
                  <stop offset="100%" stop-color="#1e1b4b"/>
                </linearGradient>
                <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#38bdf8"/>
                  <stop offset="100%" stop-color="#0a84ff"/>
                </linearGradient>
                <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#a855f7"/>
                  <stop offset="100%" stop-color="#6366f1"/>
                </linearGradient>
              </defs>
              <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.42"/>
              <circle cx="256" cy="256" r="168" fill="none" stroke="url(#purplePink)" stroke-width="8" stroke-dasharray="22 14" stroke-opacity="0.65"/>
              <circle cx="256" cy="88" r="16" fill="#38bdf8"/>
              <circle cx="424" cy="256" r="16" fill="#30d158"/>
              <circle cx="256" cy="424" r="16" fill="#a855f7"/>
              <circle cx="88" cy="256" r="16" fill="#ff9f0a"/>
              <rect x="142" y="152" width="228" height="92" rx="26" fill="#1e293b" stroke="url(#cyanBlue)" stroke-width="14"/>
              <circle cx="186" cy="198" r="12" fill="#30d158"/>
              <circle cx="222" cy="198" r="12" fill="#38bdf8"/>
              <line x1="264" y1="198" x2="332" y2="198" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
              <rect x="142" y="268" width="228" height="92" rx="26" fill="#1e293b" stroke="url(#cyanBlue)" stroke-width="14"/>
              <circle cx="186" cy="314" r="12" fill="#38bdf8"/>
              <circle cx="222" cy="314" r="12" fill="#a855f7"/>
              <line x1="264" y1="314" x2="332" y2="314" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
            </svg>
          EOF

            cat << 'EOF' > /tmp/logo.svg
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
              <defs>
                <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0b1120"/>
                  <stop offset="100%" stop-color="#1e1b4b"/>
                </linearGradient>
                <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#38bdf8"/>
                  <stop offset="100%" stop-color="#0a84ff"/>
                </linearGradient>
                <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#a855f7"/>
                  <stop offset="100%" stop-color="#6366f1"/>
                </linearGradient>
              </defs>
              <rect x="36" y="56" width="400" height="400" rx="92" fill="url(#bg)" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.5"/>
              <circle cx="236" cy="256" r="142" fill="none" stroke="url(#purplePink)" stroke-width="7" stroke-dasharray="18 12" stroke-opacity="0.65"/>
              <circle cx="236" cy="114" r="13" fill="#38bdf8"/>
              <circle cx="378" cy="256" r="13" fill="#30d158"/>
              <circle cx="236" cy="398" r="13" fill="#a855f7"/>
              <circle cx="94" cy="256" r="13" fill="#ff9f0a"/>
              <rect x="138" y="168" width="196" height="78" rx="22" fill="#1e293b" stroke="url(#cyanBlue)" stroke-width="12"/>
              <circle cx="176" cy="207" r="10" fill="#30d158"/>
              <circle cx="206" cy="207" r="10" fill="#38bdf8"/>
              <line x1="242" y1="207" x2="300" y2="207" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
              <rect x="138" y="266" width="196" height="78" rx="22" fill="#1e293b" stroke="url(#cyanBlue)" stroke-width="12"/>
              <circle cx="176" cy="305" r="10" fill="#38bdf8"/>
              <circle cx="206" cy="305" r="10" fill="#a855f7"/>
              <line x1="242" y1="305" x2="300" y2="305" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
              <text x="476" y="242" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="102" font-weight="800" fill="#38bdf8">OmniDrive</text>
              <text x="476" y="348" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="78" font-weight="700" fill="#a855f7">Storage Hub Pro</text>
            </svg>
          EOF

            rsvg-convert -w 256 -h 256 /tmp/icon.svg -o omnidrive_pro/icon.png
            rsvg-convert -w 512 -h 256 /tmp/logo.svg -o omnidrive_pro/logo.png
            touch omnidrive_pro/.omnidrive_art_v3
            ICONS_CREATED="true"
            ICON_STATUS="🆕 Đã tạo mới bộ nhận diện OmniDrive Pro: icon.png (256x256) & logo.png (512x256)"
          fi
          echo "::endgroup::"

          echo "icons_created=${ICONS_CREATED}" >> "$GITHUB_OUTPUT"
          echo "icon_status=${ICON_STATUS}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: "🔍 3. Check Latest Alpine Base & Protocol Engines (Nginx, Samba, OpenSSH, vsftpd, Python)"
        id: check_upstream
        run: |
          set -e
          echo "::group::🔍 Truy vấn phiên bản Alpine Linux & Các Engine từ APKINDEX"
          DOCKERFILE="omnidrive_pro/Dockerfile"

          CURRENT_ALPINE=$(grep -oP '^FROM ghcr\.io/home-assistant/base:\K[0-9.]+' "$DOCKERFILE" | head -n1 | tr -d '[:space:]')
          CURRENT_NGINX=$(grep -oP '^ARG NGINX_VERSION=\K\S+' "$DOCKERFILE" | head -n1 | tr -d '[:space:]')
          [ -z "$CURRENT_ALPINE" ] && CURRENT_ALPINE="3.24"
          [ -z "$CURRENT_NGINX" ] && CURRENT_NGINX="1.30.6-r0"

          base_ok() {
            docker manifest inspect "ghcr.io/home-assistant/base:$2" 2>/dev/null \
              | jq -e --arg a "$1" '[.manifests[]?.platform.architecture] | index($a) != null' >/dev/null
          }

          LATEST_ALPINE=$(curl -sL "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/latest-releases.yaml" | grep -oP 'version:\s*\K[0-9]+\.[0-9]+' | head -n1 | tr -d '[:space:]' || echo "$CURRENT_ALPINE")
          [ -z "$LATEST_ALPINE" ] && LATEST_ALPINE="$CURRENT_ALPINE"

          if ! (base_ok arm64 "$LATEST_ALPINE" && base_ok amd64 "$LATEST_ALPINE"); then
            echo "⚠️ Home Assistant chưa có base image đa kiến trúc cho Alpine ${LATEST_ALPINE}, giữ nguyên ${CURRENT_ALPINE}"
            LATEST_ALPINE="$CURRENT_ALPINE"
          fi

          # Tải APKINDEX của Alpine để lấy phiên bản thực tế của toàn bộ các Engine
          curl -sfL "https://dl-cdn.alpinelinux.org/alpine/v${LATEST_ALPINE}/main/aarch64/APKINDEX.tar.gz" | tar -Oxz APKINDEX > /tmp/apkindex_main 2>/dev/null || touch /tmp/apkindex_main
          curl -sfL "https://dl-cdn.alpinelinux.org/alpine/v${LATEST_ALPINE}/community/aarch64/APKINDEX.tar.gz" | tar -Oxz APKINDEX > /tmp/apkindex_comm 2>/dev/null || touch /tmp/apkindex_comm
          cat /tmp/apkindex_main /tmp/apkindex_comm > /tmp/apkindex_all

          get_pkg_ver() {
            awk -F: -v pkg="$1" '$1=="P" && $2==pkg {getline; if ($1=="V") {print $2; exit}}' /tmp/apkindex_all | tr -d '[:space:]'
          }

          LATEST_NGINX=$(get_pkg_ver "nginx")
          if [[ ! "$LATEST_NGINX" =~ ^[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            LATEST_NGINX="$CURRENT_NGINX"
          fi
          SAMBA_VER=$(get_pkg_ver "samba")
          OPENSSH_VER=$(get_pkg_ver "openssh")
          VSFTPD_VER=$(get_pkg_ver "vsftpd")
          PYTHON_VER=$(get_pkg_ver "python3")

          [ -z "$SAMBA_VER" ] && SAMBA_VER="latest"
          [ -z "$OPENSSH_VER" ] && OPENSSH_VER="latest"
          [ -z "$VSFTPD_VER" ] && VSFTPD_VER="latest"
          [ -z "$PYTHON_VER" ] && PYTHON_VER="3.x"

          echo "Alpine : ${CURRENT_ALPINE} -> ${LATEST_ALPINE}"
          echo "Nginx  : ${CURRENT_NGINX} -> ${LATEST_NGINX}"
          echo "Engines: Samba ${SAMBA_VER} | OpenSSH ${OPENSSH_VER} | vsftpd ${VSFTPD_VER} | Python ${PYTHON_VER}"
          echo "::endgroup::"

          {
            echo "current_alpine=${CURRENT_ALPINE}"
            echo "current_nginx=${CURRENT_NGINX}"
            echo "latest_alpine=${LATEST_ALPINE}"
            echo "latest_nginx=${LATEST_NGINX}"
            echo "samba_ver=${SAMBA_VER}"
            echo "openssh_ver=${OPENSSH_VER}"
            echo "vsftpd_ver=${VSFTPD_VER}"
            echo "python_ver=${PYTHON_VER}"
          } >> "$GITHUB_OUTPUT"

          if [ "$LATEST_ALPINE" != "$CURRENT_ALPINE" ] || [ "$LATEST_NGINX" != "$CURRENT_NGINX" ]; then
            echo "upstream_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "🏷️ 4. Calculate Version & Build Professional Changelog"
        id: calc_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "::group::🏷️ Tính toán Phiên bản & Tạo CHANGELOG.md chuẩn hệ sinh thái"
          CONFIG_FILE="omnidrive_pro/config.yaml"
          DOCKERFILE="omnidrive_pro/Dockerfile"
          CHANGELOG_FILE="omnidrive_pro/CHANGELOG.md"
          OWNER_LC="${{ steps.gen_icons.outputs.owner_lc }}"

          CURRENT_VER=$(grep -oP '^version:\s*"?\K[0-9]+\.[0-9]+\.[0-9]+' "$CONFIG_FILE" | head -n1 | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VER"

          UPSTREAM_CHANGED="${{ steps.check_upstream.outputs.upstream_changed }}"
          ICONS_CREATED="${{ steps.gen_icons.outputs.icons_created }}"
          CURRENT_ALPINE="${{ steps.check_upstream.outputs.current_alpine }}"
          CURRENT_NGINX="${{ steps.check_upstream.outputs.current_nginx }}"
          LATEST_ALPINE="${{ steps.check_upstream.outputs.latest_alpine }}"
          LATEST_NGINX="${{ steps.check_upstream.outputs.latest_nginx }}"
          SAMBA_VER="${{ steps.check_upstream.outputs.samba_ver }}"
          OPENSSH_VER="${{ steps.check_upstream.outputs.openssh_ver }}"
          VSFTPD_VER="${{ steps.check_upstream.outputs.vsftpd_ver }}"
          PYTHON_VER="${{ steps.check_upstream.outputs.python_ver }}"
          TODAY=$(date -u +%Y-%m-%d)

          NEED_COMMIT="false"
          NEW_VER="$CURRENT_VER"
          UPDATE_TYPE="⏸️ Không có thay đổi phiên bản (Up-to-date)"
          SUMMARY_REASON="Mã nguồn và các gói Upstream đã ở phiên bản mới nhất."

          # Hàm chèn mục Changelog mới lên đầu và giữ tối đa 5 bản phát hành sạch gần nhất
          write_changelog_entry() {
            local block="$1"
            local rebuild_clean="$2"
            python3 - "$CHANGELOG_FILE" "$block" "$rebuild_clean" <<'PY'
          import sys, re, os
          path, block, rebuild_clean = sys.argv[1], sys.argv[2].strip(), sys.argv[3] == "true"
          sections = []
          if not rebuild_clean and os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  old = f.read()
              old_body = re.sub(r'^#\s+Changelog\s*', '', old, flags=re.I).strip()
              if old_body:
                  raw_parts = [p.strip() for p in old_body.split("\n---\n") if p.strip()]
                  for p in raw_parts:
                      if "Add files via upload" in p:
                          continue
                      sections.append(p)
          final_sections = [block] + sections[:4]
          out = "# Changelog\n\n" + "\n\n---\n\n".join(final_sections) + "\n"
          with open(path, "w", encoding="utf-8") as f:
              f.write(out)
          PY
          }

          # Kiểm tra xem CHANGELOG.md hiện tại có đang bị định dạng cũ/spam không
          NEEDS_LAYOUT_REBUILD="false"
          if [ ! -f "$CHANGELOG_FILE" ] || ! grep -q "### 📦 Component & Version Matrix" "$CHANGELOG_FILE" 2>/dev/null || grep -q "Add files via upload" "$CHANGELOG_FILE" 2>/dev/null; then
            NEEDS_LAYOUT_REBUILD="true"
          fi

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^omnidrive_pro/' || true)
          MANUAL_CHANGELOG=$(echo "$CHANGED_FILES" | grep -q '^omnidrive_pro/CHANGELOG\.md$' && echo "true" || echo "false")

          if [ "$UPSTREAM_CHANGED" = "true" ]; then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_VER="${NEW_MAJOR}.0.0"
            NEED_COMMIT="true"
            UPDATE_TYPE="🚀 Nâng cấp Major Version (Upstream Release)"
            SUMMARY_REASON="Nâng cấp Nginx lên \`${LATEST_NGINX}\` trên Alpine Base \`${LATEST_ALPINE}\`."

            sed -i -E "s|^(FROM ghcr\.io/home-assistant/base:)[0-9.]+|\1${LATEST_ALPINE}|" "$DOCKERFILE"
            sed -i "s|^ARG NGINX_VERSION=.*|ARG NGINX_VERSION=${LATEST_NGINX}|" "$DOCKERFILE"
            sed -i "s|^version:.*|version: \"${NEW_VER}\"|" "$CONFIG_FILE"

            BLOCK=$(cat <<EOF
          ## ${NEW_VER}
          _Released: ${TODAY}_

          ### 📦 Component & Version Matrix
          - **Add-on Release:** Bumped from \`v${CURRENT_VER}\` ➡️ **\`v${NEW_VER}\`**
          - **Supported Architectures:** \`aarch64\` (ARM64) & \`amd64\` (x86_64) *(Pre-built GHCR Package)*
          - **Alpine Base Image:** \`Alpine ${CURRENT_ALPINE}\` ➡️ **\`Alpine ${LATEST_ALPINE}\`** *(Home Assistant official base)*
          - **Nginx Engine:** \`${CURRENT_NGINX}\` ➡️ **\`${LATEST_NGINX}\`**
          - **Protocol Stack:** \`Samba ${SAMBA_VER}\` • \`OpenSSH ${OPENSSH_VER}\` • \`vsftpd ${VSFTPD_VER}\` • \`Python ${PYTHON_VER}\`

          ### 🔐 Package Integrity (GHCR Multi-Arch)
          - **ARM64 (\`aarch64\`):** \`ghcr.io/${OWNER_LC}/omnidrive_pro-aarch64:${NEW_VER}\`
          - **AMD64 (\`x86_64\`):** \`ghcr.io/${OWNER_LC}/omnidrive_pro-amd64:${NEW_VER}\`

          ### 🚀 What's Changed
          - Upgraded Nginx to \`${LATEST_NGINX}\` on Home Assistant Alpine Base \`${LATEST_ALPINE}\`.
          - Refreshed multi-protocol engines (WebDAV, Samba, OpenSSH, vsftpd) with latest upstream security patches.
          EOF
            )
            write_changelog_entry "$BLOCK" "$NEEDS_LAYOUT_REBUILD"

          elif [ "${{ github.event_name }}" = "push" ] || [ "$ICONS_CREATED" = "true" ] || [ "$NEEDS_LAYOUT_REBUILD" = "true" ]; then
            PREV_VER=$(git show HEAD~1:omnidrive_pro/config.yaml 2>/dev/null | grep -oP '^version:\s*"?\K[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | tr -d '[:space:]' || echo "")
            BUMP_PATCH="false"
            if [ "$ICONS_CREATED" = "true" ]; then
              BUMP_PATCH="true"
            elif [ "${{ github.event_name }}" = "push" ] && [ -n "$CHANGED_FILES" ] && [ -n "$PREV_VER" ] && [ "$PREV_VER" = "$CURRENT_VER" ] && gh release view "omnidrive-v${CURRENT_VER}" >/dev/null 2>&1; then
              BUMP_PATCH="true"
            fi

            if [ "$BUMP_PATCH" = "true" ]; then
              NEW_PATCH=$((PATCH + 1))
              NEW_VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
              NEED_COMMIT="true"
              UPDATE_TYPE="🔧 Nâng cấp Patch Version (Code / Security Update)"
              sed -i "s|^version:.*|version: \"${NEW_VER}\"|" "$CONFIG_FILE"
            elif [ "$NEEDS_LAYOUT_REBUILD" = "true" ]; then
              NEED_COMMIT="true"
              UPDATE_TYPE="🧹 Chuẩn hóa Changelog & Chuyển sang Pre-built Package"
            fi

            if [ "$MANUAL_CHANGELOG" = "false" ] && { [ "$BUMP_PATCH" = "true" ] || [ "$NEEDS_LAYOUT_REBUILD" = "true" ]; }; then
              COMMIT_MSG=$(git log -1 --pretty=%s | tr -d '"`')
              NOTES_LINES=""
              if [[ ! "$COMMIT_MSG" =~ ^(Add\ files\ via\ upload|Update\ |Create\ |Delete\ |Rename\ |Merge\ ) ]] && [ -n "$COMMIT_MSG" ]; then
                NOTES_LINES="- **Update:** ${COMMIT_MSG}"
                SUMMARY_REASON="${COMMIT_MSG}"
              else
                echo "$CHANGED_FILES" | grep -q 'run\.sh' && NOTES_LINES+="- **Security & Core Engine:** Hardened RBAC (\`admin\`/\`user\`), enforced \`allowed_users\`/\`read_only\` isolation, blocked \`X-WPro-Ingress\` spoofing, and added graceful service shutdown."$'\n'
                echo "$CHANGED_FILES" | grep -q 'fancyindex/' && NOTES_LINES+="- **Web UI & IDE:** Refined FancyIndex interface, Cloud Code IDE, and client user experience."$'\n'
                echo "$CHANGED_FILES" | grep -q 'translations/' && NOTES_LINES+="- **Localization:** Updated add-on interface translations."$'\n'
                echo "$CHANGED_FILES" | grep -q 'Dockerfile' && NOTES_LINES+="- **Build System:** Migrated to Home Assistant native \`Dockerfile\` multi-arch pre-built GHCR packages (removed deprecated \`build.yaml\`)."$'\n'
                echo "$CHANGED_FILES" | grep -q 'config\.yaml' && NOTES_LINES+="- **Configuration:** Updated add-on schema, RBAC user roles, and GHCR image source."$'\n'
                [ -z "$NOTES_LINES" ] && NOTES_LINES="- **Maintenance:** General stability improvements, multi-arch pre-built package sync, and clean changelog layout."
                SUMMARY_REASON="Cập nhật mã nguồn, bảo mật RBAC & đóng gói package đa kiến trúc."
              fi

              VER_LINE="\`v${NEW_VER}\`"
              [ "$NEW_VER" != "$CURRENT_VER" ] && VER_LINE="Bumped from \`v${CURRENT_VER}\` ➡️ **\`v${NEW_VER}\`**"

              BLOCK=$(cat <<EOF
          ## ${NEW_VER}
          _Released: ${TODAY}_

          ### 📦 Component & Version Matrix
          - **Add-on Release:** ${VER_LINE}
          - **Supported Architectures:** \`aarch64\` (ARM64) & \`amd64\` (x86_64) *(Pre-built GHCR Package)*
          - **Alpine Base Image:** \`Alpine ${LATEST_ALPINE}\` *(Home Assistant official base)*
          - **Nginx Engine:** \`${LATEST_NGINX}\`
          - **Protocol Stack:** \`Samba ${SAMBA_VER}\` • \`OpenSSH ${OPENSSH_VER}\` • \`vsftpd ${VSFTPD_VER}\` • \`Python ${PYTHON_VER}\`

          ### 🔐 Package Integrity (GHCR Multi-Arch)
          - **ARM64 (\`aarch64\`):** \`ghcr.io/${OWNER_LC}/omnidrive_pro-aarch64:${NEW_VER}\`
          - **AMD64 (\`x86_64\`):** \`ghcr.io/${OWNER_LC}/omnidrive_pro-amd64:${NEW_VER}\`

          ### 🚀 What's Changed
          ${NOTES_LINES}
          EOF
              )
              write_changelog_entry "$BLOCK" "$NEEDS_LAYOUT_REBUILD"
            fi
          fi

          # Đồng bộ Badges trong README.md (chỉ dùng sed, bảo vệ nội dung tự viết)
          README_FILE="omnidrive_pro/README.md"
          README_CHANGED="false"
          README_STATUS="⚠️ Không tìm thấy ${README_FILE}"
          if [ -f "$README_FILE" ]; then
            BADGE_VER=$(grep -oP '^version:\s*"?\K[0-9]+\.[0-9]+\.[0-9]+' "$CONFIG_FILE" | head -n1 | tr -d '[:space:]')
            SAFE_NGINX=$(echo "$LATEST_NGINX" | sed 's/-/--/g')

            [ -n "$BADGE_VER" ] && sed -i -E "s#badge/version-[0-9][0-9.]*-#badge/version-${BADGE_VER}-#g" "$README_FILE"
            [ -n "$LATEST_NGINX" ] && sed -i -E "s#badge/nginx-[0-9][0-9.]*(--r[0-9]+)?-#badge/nginx-${SAFE_NGINX}-#g" "$README_FILE"
            [ -n "$LATEST_ALPINE" ] && sed -i -E "s#badge/alpine(%20|_| )base-[0-9][0-9.]*-#badge/alpine\1base-${LATEST_ALPINE}-#g" "$README_FILE"

            if git diff --quiet -- "$README_FILE"; then
              README_STATUS="✅ Huy hiệu đã khớp (v${BADGE_VER} / nginx ${LATEST_NGINX} / alpine ${LATEST_ALPINE})"
            else
              README_CHANGED="true"
              README_STATUS="🔧 Đã tự sửa huy hiệu cho khớp (v${BADGE_VER} / nginx ${LATEST_NGINX} / alpine ${LATEST_ALPINE})"
            fi
          fi

          HAS_CHANGES=$( [ -n "$(git status --porcelain omnidrive_pro/)" ] && echo "true" || echo "false" )
          SHOULD_RELEASE="false"
          if [ "$NEED_COMMIT" = "true" ] || [ "$HAS_CHANGES" = "true" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_RELEASE="true"
          elif ! gh release view "omnidrive-v${NEW_VER}" >/dev/null 2>&1; then
            SHOULD_RELEASE="true"
          fi
          echo "::endgroup::"

          {
            echo "old_ver=${CURRENT_VER}"
            echo "new_ver=${NEW_VER}"
            echo "need_commit=${NEED_COMMIT}"
            echo "should_release=${SHOULD_RELEASE}"
            echo "update_type=${UPDATE_TYPE}"
            echo "summary_reason=${SUMMARY_REASON}"
            echo "readme_changed=${README_CHANGED}"
            echo "readme_status=${README_STATUS}"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 5. Build & Push Pre-built Package (aarch64 + amd64) lên GHCR TRƯỚC KHI Commit
      # ------------------------------------------------------------------
      - name: "⚙️ 5a. Set up QEMU for Multi-arch Build"
        if: steps.calc_version.outputs.should_release == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: "⚙️ 5b. Set up Docker Buildx"
        if: steps.calc_version.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: "🔐 5c. Log in to GitHub Container Registry (GHCR)"
        if: steps.calc_version.outputs.should_release == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🐳 5d. Build & Push aarch64 (arm64) Package"
        id: build_arm64
        if: steps.calc_version.outputs.should_release == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: omnidrive_pro
          file: omnidrive_pro/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            NGINX_VERSION=${{ steps.check_upstream.outputs.latest_nginx }}
          labels: |
            io.hass.version=${{ steps.calc_version.outputs.new_ver }}
            io.hass.type=addon
            io.hass.arch=aarch64
          tags: |
            ghcr.io/${{ steps.gen_icons.outputs.owner_lc }}/omnidrive_pro-aarch64:${{ steps.calc_version.outputs.new_ver }}
            ghcr.io/${{ steps.gen_icons.outputs.owner_lc }}/omnidrive_pro-aarch64:latest

      - name: "🐳 5e. Build & Push amd64 Package"
        id: build_amd64
        if: steps.calc_version.outputs.should_release == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: omnidrive_pro
          file: omnidrive_pro/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            NGINX_VERSION=${{ steps.check_upstream.outputs.latest_nginx }}
          labels: |
            io.hass.version=${{ steps.calc_version.outputs.new_ver }}
            io.hass.type=addon
            io.hass.arch=amd64
          tags: |
            ghcr.io/${{ steps.gen_icons.outputs.owner_lc }}/omnidrive_pro-amd64:${{ steps.calc_version.outputs.new_ver }}
            ghcr.io/${{ steps.gen_icons.outputs.owner_lc }}/omnidrive_pro-amd64:latest

      # -----------------------------------------------------------------------
      # 6. Commit (Verified GPG via GraphQL API) + Tạo/Cập nhật GitHub Release 
      # -----------------------------------------------------------------------
      - name: "📤 6. Commit, Push & Update GitHub Release"
        id: git_push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VER: ${{ steps.calc_version.outputs.new_ver }}
          NEED_COMMIT: ${{ steps.calc_version.outputs.need_commit }}
          SHOULD_RELEASE: ${{ steps.calc_version.outputs.should_release }}
          ARM64_DIGEST: ${{ steps.build_arm64.outputs.digest }}
          AMD64_DIGEST: ${{ steps.build_amd64.outputs.digest }}
        run: |
          set -e
          echo "::group::📤 Đồng bộ Verified Commit lên nhánh Main & Tạo GitHub Release"

          # Chèn mã SHA256 Digest thực tế của 2 gói GHCR vào mục mới nhất của CHANGELOG.md
          if [ -n "$ARM64_DIGEST" ] && [ -n "$AMD64_DIGEST" ] && [ -f "omnidrive_pro/CHANGELOG.md" ]; then
            sed -i "s|\(omnidrive_pro-aarch64:${NEW_VER}\`\).*|\1 (\`${ARM64_DIGEST}\`)|" omnidrive_pro/CHANGELOG.md
            sed -i "s|\(omnidrive_pro-amd64:${NEW_VER}\`\).*|\1 (\`${AMD64_DIGEST}\`)|" omnidrive_pro/CHANGELOG.md
          fi

          # Keep-alive (đặt tại .github/.keepalive để GITHUB_TOKEN được phép ghi)
          LAST_COMMIT_TS=$(git log -1 --format=%ct || date +%s)
          NOW_TS=$(date +%s)
          DAYS_IDLE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          if [ "$DAYS_IDLE" -ge 45 ]; then
            mkdir -p .github
            echo "Last automated keep-alive check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/.keepalive
          fi

          git add omnidrive_pro/ .github/.keepalive 2>/dev/null || git add omnidrive_pro/

          if ! git diff --cached --quiet; then
            if [ "$NEED_COMMIT" = "true" ]; then
              export COMMIT_MSG="chore(omnidrive_pro): release v${NEW_VER} [skip ci]"
            else
              export COMMIT_MSG="chore(omnidrive_pro): sync config, README & changelog [skip ci]"
            fi

            python3 - <<'PY'
          import base64, json, os, subprocess, sys, time, urllib.request, urllib.error

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          msg = os.environ["COMMIT_MSG"]

          raw = subprocess.check_output(["git", "diff", "--cached", "--no-renames", "--name-status", "-z"])
          parts = [p for p in raw.split(b"\x00") if p]
          additions, deletions = [], []
          for i in range(0, len(parts), 2):
              st = parts[i].decode("utf-8")
              path = parts[i + 1].decode("utf-8")
              if st == "D":
                  deletions.append({"path": path})
              else:
                  with open(path, "rb") as f:
                      b64 = base64.b64encode(f.read()).decode("ascii")
                  additions.append({"path": path, "contents": b64})

          if not additions and not deletions:
              sys.exit(0)

          file_changes = {}
          if additions: file_changes["additions"] = additions
          if deletions: file_changes["deletions"] = deletions

          query = """
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }
          """
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/vnd.github+json",
              "User-Agent": "github-actions-verified-commit"
          }

          for attempt in range(1, 4):
              ref_req = urllib.request.Request(f"https://api.github.com/repos/{repo}/git/ref/heads/main", headers=headers)
              with urllib.request.urlopen(ref_req, timeout=20) as r:
                  head_oid = json.loads(r.read().decode("utf-8"))["object"]["sha"]

              payload = {
                  "query": query,
                  "variables": {
                      "input": {
                          "branch": {"repositoryNameWithOwner": repo, "branchName": "main"},
                          "message": {"headline": msg},
                          "fileChanges": file_changes,
                          "expectedHeadOid": head_oid
                      }
                  }
              }
              gql_req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(gql_req, timeout=30) as r:
                      resp = json.loads(r.read().decode("utf-8"))
                  if "errors" not in resp:
                      c = resp["data"]["createCommitOnBranch"]["commit"]
                      print(f"✅ Verified commit created: {c['oid']} ({c['url']})")
                      sys.exit(0)
                  print(f"⚠️ Attempt {attempt} GraphQL error: {resp['errors']}", file=sys.stderr)
              except urllib.error.HTTPError as e:
                  print(f"⚠️ Attempt {attempt} HTTP {e.code}: {e.read().decode('utf-8', 'ignore')}", file=sys.stderr)
              time.sleep(attempt * 5)
          sys.exit(1)
          PY

            git reset --hard HEAD
            git fetch origin main
            git checkout -B main origin/main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$SHOULD_RELEASE" = "true" ]; then
            TAG="omnidrive-v${NEW_VER}"

            python3 - <<'PY' > /tmp/release_notes.md
          import re
          with open("omnidrive_pro/CHANGELOG.md", "r", encoding="utf-8") as f:
              text = f.read()
          text = re.sub(r'^#\s+Changelog\s*', '', text, flags=re.I).strip()
          if "\n---\n" in text:
              first_section = text.split("\n---\n")[0].strip()
          else:
              parts = re.split(r'\n(?=##\s)', text)
              first_section = parts[0].strip()
          print(first_section)
          PY

            git tag -f "${TAG}"
            git push origin "${TAG}" --force

            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "🔄 Updating existing GitHub Release ${TAG}..."
              gh release edit "${TAG}" \
                --title "OmniDrive Pro v${NEW_VER}" \
                --notes-file /tmp/release_notes.md \
                --latest
            else
              echo "🎉 Creating new GitHub Release ${TAG}..."
              gh release create "${TAG}" \
                --title "OmniDrive Pro v${NEW_VER}" \
                --notes-file /tmp/release_notes.md \
                --latest
            fi
          fi
          echo "::endgroup::"

      - name: "📊 7. Generate Visual Execution Dashboard (Job Summary)"
        if: always()
        run: |
          PUSH_STATE="⏸️ Không cần Push (Không có thay đổi)"
          if [ "${{ steps.git_push.outputs.pushed }}" = "true" ]; then
            PUSH_STATE="✅ Đã Commit & Push lên \`main\` (\`v${{ steps.calc_version.outputs.new_ver }}\`)"
          elif [ "${{ job.status }}" != "success" ]; then
            PUSH_STATE="❌ Quá trình bị dừng do có lỗi"
          fi

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          # 🌐 Báo Cáo Thực Thi: OmniDrive Pro CI/CD

          | Hạng mục kiểm tra | Trạng thái / Kết quả |
          | :--- | :--- |
          | **1. Kết quả Pipeline** | **${{ job.status == 'success' && '🟢 THÀNH CÔNG (SUCCESS)' || '🔴 THẤT BẠI (FAILED)' }}** |
          | **2. Sự kiện kích hoạt (Trigger)** | \`${{ github.event_name }}\` |
          | **3. Bộ nhận diện Icon & Logo** | ${{ steps.gen_icons.outputs.icon_status }} |
          | **4. Kiến trúc & Alpine Base** | \`${{ steps.check_upstream.outputs.current_alpine }}\` ➡️ **\`${{ steps.check_upstream.outputs.latest_alpine }}\`** |
          | **5. Phiên bản Gói Nginx** | \`${{ steps.check_upstream.outputs.current_nginx }}\` ➡️ **\`${{ steps.check_upstream.outputs.latest_nginx }}\`** |
          | **6. Protocol Stack** | \`Samba ${{ steps.check_upstream.outputs.samba_ver }}\` • \`OpenSSH ${{ steps.check_upstream.outputs.openssh_ver }}\` • \`vsftpd ${{ steps.check_upstream.outputs.vsftpd_ver }}\` |
          | **7. Phiên bản Add-on (\`config.yaml\`)** | \`v${{ steps.calc_version.outputs.old_ver }}\` ➡️ **\`v${{ steps.calc_version.outputs.new_ver }}\`** |
          | **8. Phân loại Cập nhật** | ${{ steps.calc_version.outputs.update_type }} |
          | **9. Đóng gói GHCR (arm64 & amd64)** | ${{ steps.build_arm64.outcome == 'success' && steps.build_amd64.outcome == 'success' && '✅ Đã đẩy lên GHCR (aarch64 & amd64)' || '⏭️ Bỏ qua / Lỗi build' }} |
          | **10. Đồng bộ GitHub (\`main\`)** | ${PUSH_STATE} |
          | **11. Huy hiệu README** | ${{ steps.calc_version.outputs.readme_status }} |
          EOF
