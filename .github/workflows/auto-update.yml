name: Auto Check Cloudflared & Alpine Base

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: auto-update-cloudflared
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Official Assets
        run: |
          mkdir -p cloudflared
          if [ ! -f cloudflared/icon.png ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/icon.png" -o cloudflared/icon.png
          fi
          if [ ! -f cloudflared/logo.png ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/logo.png" -o cloudflared/logo.png
          fi
          if [ ! -f cloudflared/DOCS.md ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/DOCS.md" -o cloudflared/DOCS.md
          fi

      - name: Check Cloudflared & Alpine versions
        id: check
        run: |
          set -e

          CURRENT_ADDON_VERSION=$(grep -oP '^version:\s*"\K[^"]+' cloudflared/config.yaml)
          echo "Current Add-on version: $CURRENT_ADDON_VERSION"

          # Current Cloudflared version from Dockerfile
          CURRENT_CF=$(grep -oP 'ARG CLOUDFLARED_VERSION=\K[0-9.]+' cloudflared/Dockerfile || echo "2026.10.7")
          LATEST_CF=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name' | sed 's/^v//')

          echo "Current Cloudflared: $CURRENT_CF"
          echo "Latest Cloudflared : $LATEST_CF"

          CF_UPDATED=false
          VERIFIED_CF="$CURRENT_CF"

          if [ -n "$LATEST_CF" ] && [ "$LATEST_CF" != "null" ] && [ "$LATEST_CF" != "$CURRENT_CF" ]; then
            BINARY_URL="https://github.com/cloudflare/cloudflared/releases/download/${LATEST_CF}/cloudflared-linux-arm64"
            HTTP_STATUS=$(curl -sL -I -o /dev/null -w "%{http_code}" "$BINARY_URL")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ New Cloudflared $LATEST_CF available + arm64 binary verified"
              CF_UPDATED=true
              VERIFIED_CF="$LATEST_CF"
            else
              echo "⏳ Cloudflared $LATEST_CF found but arm64 binary not ready"
            fi
          else
            echo "✅ Cloudflared is up to date"
          fi

          # Current Alpine version from Dockerfile
          CURRENT_ALPINE=$(grep -oP 'aarch64-base:\K[0-9.]+' cloudflared/Dockerfile | head -1 || echo "3.22")
          echo "Current Alpine: $CURRENT_ALPINE"

          CANDIDATES="3.24 3.23 3.22"
          VERIFIED_ALPINE="$CURRENT_ALPINE"
          ALPINE_UPDATED=false

          for ver in $CANDIDATES; do
            if [ "$(printf '%s\n' "$ver" "$CURRENT_ALPINE" | sort -V | tail -1)" = "$ver" ] && [ "$ver" != "$CURRENT_ALPINE" ]; then
              if docker manifest inspect "ghcr.io/home-assistant/aarch64-base:${ver}" > /dev/null 2>&1; then
                echo "✅ New Alpine $ver available"
                VERIFIED_ALPINE="$ver"
                ALPINE_UPDATED=true
                break
              fi
            fi
          done

          if [ "$ALPINE_UPDATED" = "false" ]; then
            echo "✅ Alpine is up to date"
          fi

          echo "cf_updated=$CF_UPDATED" >> $GITHUB_OUTPUT
          echo "alpine_updated=$ALPINE_UPDATED" >> $GITHUB_OUTPUT
          echo "verified_cf=$VERIFIED_CF" >> $GITHUB_OUTPUT
          echo "verified_alpine=$VERIFIED_ALPINE" >> $GITHUB_OUTPUT
          echo "current_cf=$CURRENT_CF" >> $GITHUB_OUTPUT
          echo "current_alpine=$CURRENT_ALPINE" >> $GITHUB_OUTPUT
          echo "current_addon_version=$CURRENT_ADDON_VERSION" >> $GITHUB_OUTPUT

      - name: Apply updates and bump version
        run: |
          set -e

          CF_UPDATED="${{ steps.check.outputs.cf_updated }}"
          ALPINE_UPDATED="${{ steps.check.outputs.alpine_updated }}"
          NEW_CF="${{ steps.check.outputs.verified_cf }}"
          NEW_ALPINE="${{ steps.check.outputs.verified_alpine }}"
          CUR_CF="${{ steps.check.outputs.current_cf }}"
          CUR_ALPINE="${{ steps.check.outputs.current_alpine }}"
          CURRENT_ADDON_VERSION="${{ steps.check.outputs.current_addon_version }}"

          echo "CF_UPDATED=$CF_UPDATED | ALPINE_UPDATED=$ALPINE_UPDATED"

          # ========== VERSION BUMP ==========
          if [ "$CF_UPDATED" = "true" ] || [ "$ALPINE_UPDATED" = "true" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_ADDON_VERSION"
            PATCH=$((PATCH + 1))
            FINAL_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Bumping version: $CURRENT_ADDON_VERSION → $FINAL_VERSION"
          else
            FINAL_VERSION="$CURRENT_ADDON_VERSION"
            echo "No changes. Keeping version $FINAL_VERSION"
          fi

          # ========== UPDATE DOCKERFILE ==========
          # Update Cloudflared version
          sed -i "s|ARG CLOUDFLARED_VERSION=.*|ARG CLOUDFLARED_VERSION=${NEW_CF}|" cloudflared/Dockerfile

          # Update Alpine base
          sed -i "s|aarch64-base:[0-9.]*|aarch64-base:${NEW_ALPINE}|" cloudflared/Dockerfile

          # Remove old build.yaml if exists
          [ -f cloudflared/build.yaml ] && rm -f cloudflared/build.yaml

          # ========== UPDATE CONFIG.YAML ==========
          sed -i "s/^version: \".*\"/version: \"${FINAL_VERSION}\"/" cloudflared/config.yaml

          # ========== GENERATE CHANGELOG ==========
          cat > /tmp/changelog.md << EOF
          # What's Changed in ${FINAL_VERSION}

          * **Cloudflared Binary (arm64 verified):** \`${NEW_CF}\`
          * **Home Assistant Alpine Base:** \`Alpine ${NEW_ALPINE}\`

          EOF

          if [ "$CF_UPDATED" = "true" ] && [ "$ALPINE_UPDATED" = "true" ]; then
            cat >> /tmp/changelog.md << EOF
          ### Changes in this release
          - Updated Cloudflared to \`${NEW_CF}\`
          - Upgraded Alpine Base to \`${NEW_ALPINE}\`

          EOF
          elif [ "$CF_UPDATED" = "true" ]; then
            cat >> /tmp/changelog.md << EOF
          ### Changes in this release
          - Updated Cloudflared to \`${NEW_CF}\`

          EOF
          elif [ "$ALPINE_UPDATED" = "true" ]; then
            cat >> /tmp/changelog.md << EOF
          ### Changes in this release
          - Upgraded Home Assistant Alpine Base from \`${CUR_ALPINE}\` to \`${NEW_ALPINE}\`

          EOF
          else
            cat >> /tmp/changelog.md << EOF
          ### Current Version Information
          - Cloudflared: \`${NEW_CF}\` (arm64 binary verified)
          - Alpine Base: \`${NEW_ALPINE}\` (official Home Assistant base)
          - Optimized for Raspberry Pi 5 (aarch64)

          EOF
          fi

          # Cloudflare Release Notes
          if [ "$CF_UPDATED" = "true" ]; then
            BODY=$(curl -s "https://api.github.com/repos/cloudflare/cloudflared/releases/tags/${NEW_CF}" | jq -r '.body // empty' | sed '/SHA256 Checksums:/,$d' | sed '/^$/d')
            if [ -n "$BODY" ]; then
              cat >> /tmp/changelog.md << EOF
          ---
          ### Cloudflare Release Notes (${NEW_CF})

          ${BODY}

          EOF
            else
              cat >> /tmp/changelog.md << EOF
          ---
          ### Cloudflare Release Notes (${NEW_CF})
          - Security updates and bug fixes
          - Full notes: https://github.com/cloudflare/cloudflared/releases/tag/${NEW_CF}

          EOF
            fi
          else
            cat >> /tmp/changelog.md << EOF
          ---
          ### Cloudflare Release Notes (${NEW_CF})
          - Current stable version
          - arm64 binary verified
          - Full notes: https://github.com/cloudflare/cloudflared/releases/tag/${NEW_CF}

          EOF
          fi

          echo "---" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md

          # Keep previous 2 versions
          if [ -f cloudflared/CHANGELOG.md ]; then
            awk '
              BEGIN { section=0; print_section=0 }
              /^# What'\''s Changed in / {
                section++
                if (section == 1) { print_section=0; next }
                if (section <= 3) { print_section=1 }
                else { print_section=0 }
              }
              print_section { print }
            ' cloudflared/CHANGELOG.md >> /tmp/changelog.md
          fi

          mv /tmp/changelog.md cloudflared/CHANGELOG.md

          # Keep-alive
          LAST_COMMIT_TS=$(git log -1 --format=%ct || date +%s)
          NOW_TS=$(date +%s)
          DAYS_IDLE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          if [ "$DAYS_IDLE" -ge 45 ]; then
            mkdir -p .github/workflows
            echo "Last automated keep-alive check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/workflows/.keepalive
          fi

          # Commit & Push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --staged --quiet; then
            git commit -m "chore: release v${FINAL_VERSION} (Cloudflared ${NEW_CF} / Alpine ${NEW_ALPINE})"
            git pull --rebase origin main
            git push
            ACTION_TAKEN="🚀 Released v${FINAL_VERSION}"
            echo "✅ Successfully released v${FINAL_VERSION}"
          else
            ACTION_TAKEN="💤 No changes"
            echo "💤 No changes detected"
          fi

          # ==================== JOB SUMMARY ====================
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 📊 Auto Update Report - Cloudflared Pro (Pi 5)

          | Component                  | Previous     | New / Current     | Status                  |
          |---------------------------|--------------|-------------------|-------------------------|
          | **Add-on Version**        | \`${CURRENT_ADDON_VERSION}\` | \`${FINAL_VERSION}\` | ${ACTION_TAKEN} |
          | **Cloudflared (arm64)**   | \`${CUR_CF}\` | \`${NEW_CF}\` | $([ "$CF_UPDATED" = "true" ] && echo "🆕 Updated" || echo "✅ Up to date") |
          | **Alpine Base**           | \`${CUR_ALPINE}\` | \`${NEW_ALPINE}\` | $([ "$ALPINE_UPDATED" = "true" ] && echo "🆕 Updated" || echo "✅ Up to date") |

          **Details:**
          - Cloudflared updated: \`${CF_UPDATED}\`
          - Alpine updated: \`${ALPINE_UPDATED}\`
          - Idle days: \`${DAYS_IDLE} / 45\`
          EOF
