name: Auto Update Cloudflared and Alpine Stable

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-update-cloudflared-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Check, verify and prepare updates
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/update_cloudflared.py" <<'PY'
          import base64
          import datetime as dt
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import yaml

          ROOT = Path.cwd()
          ADDON = ROOT / 'cloudflared'
          CONFIG = ADDON / 'config.yaml'
          DOCKERFILE = ADDON / 'Dockerfile'
          TARGET_REPO = 'home-assistant/base'
          TARGET_PREFIX = 'ghcr.io/' + TARGET_REPO + ':'
          notes = []

          def request(url, headers=None):
              headers = {'User-Agent': 'cloudflared-stable-updater', **(headers or {})}
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
                          return response.read(), response.headers
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 2:
                          raise
                      time.sleep(2 ** attempt)

          def get_json(url, headers=None):
              return json.loads(request(url, headers)[0])

          def gh_json(path):
              return get_json('https://api.github.com/' + path, {
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })

          def run(args, **kwargs):
              return subprocess.run(args, check=True, text=True, **kwargs)

          def log(message):
              print(message, flush=True)
              notes.append(message)

          def version(value):
              return tuple(int(part) for part in value.split('.'))

          config_text = CONFIG.read_text()
          config = yaml.safe_load(config_text)
          current_full = str(config['version'])
          match = re.fullmatch(r'(\d+\.\d+\.\d+)(?:[-+].*)?', current_full)
          if not match:
              raise SystemExit('Unsupported config.yaml version: ' + current_full)
          current_cf = match.group(1)
          docker_text = DOCKERFILE.read_text()
          # Require an explicit Home Assistant base reference; never guess ARG values.
          pattern = re.compile(r'(?m)^(\s*FROM\s+(?:--platform=\S+\s+)?)(ghcr\.io/home-assistant/(?:aarch64-base|base):)([A-Za-z0-9_.-]+)(?=\s|$)', re.I)
          bases = list(pattern.finditer(docker_text))
          if len(bases) != 1:
              raise SystemExit('Expected exactly one literal FROM ghcr.io/home-assistant/{aarch64-base|base}:TAG in cloudflared/Dockerfile. ARG-based or digest-pinned FROM needs explicit handling.')
          base = bases[0]
          current_base = base.group(3)
          if current_base != 'edge' and not re.fullmatch(r'\d+\.\d+(?:\.\d+)?', current_base):
              raise SystemExit('Unsupported current Alpine tag: ' + current_base)
          if 'aarch64' not in config.get('arch', []):
              raise SystemExit('config.yaml does not declare aarch64; refusing an ARM64-only verification.')
          if any(arch != 'aarch64' for arch in config.get('arch', [])):
              raise SystemExit('This workflow verifies ARM64 only. Multi-architecture add-ons require verification for every declared architecture.')

          # Query registry tags, not the edge package listing or a guessed next minor.
          token_url = 'https://ghcr.io/token?' + urllib.parse.urlencode({
              'service': 'ghcr.io', 'scope': 'repository:' + TARGET_REPO + ':pull'})
          token = get_json(token_url)['token']
          headers = {'Authorization': 'Bearer ' + token}
          url = 'https://ghcr.io/v2/' + TARGET_REPO + '/tags/list?n=1000'
          tags = set()
          visited = set()
          while url:
              if url in visited:
                  raise RuntimeError('Registry pagination loop')
              visited.add(url)
              body, response_headers = request(url, headers)
              tags.update(json.loads(body).get('tags') or [])
              link = response_headers.get('Link', '')
              following = re.search(r'<([^>]+)>;\s*rel="?next"?', link)
              url = urllib.parse.urljoin(url, following.group(1)) if following else None
              if url and urllib.parse.urlparse(url).netloc != 'ghcr.io':
                  raise RuntimeError('Unexpected registry pagination host')
          stable = sorted((tag for tag in tags if re.fullmatch(r'\d+\.\d+', tag)), key=version, reverse=True)
          if not stable:
              raise SystemExit('No numeric stable Alpine tags returned by GHCR; refusing an empty update.')
          latest_base = stable[0]
          log('Alpine current: ' + current_base + '; newest published stable tag: ' + latest_base)
          selected_cf = current_cf
          release = None
          cf_status = 'Already current'
          try:
              release = gh_json('repos/cloudflare/cloudflared/releases/latest')
              latest_cf = release['tag_name'].removeprefix('v')
              if release.get('draft') or release.get('prerelease') or not re.fullmatch(r'\d+\.\d+\.\d+', latest_cf):
                  raise ValueError('Unexpected stable Cloudflared release')
              if version(latest_cf) > version(current_cf):
                  assets = [asset for asset in release.get('assets', []) if asset['name'] == 'cloudflared-linux-arm64']
                  if len(assets) != 1:
                      cf_status = 'New release found, waiting for ARM64 binary: ' + latest_cf
                  else:
                      with urllib.request.urlopen(assets[0]['browser_download_url'], timeout=60) as response:
                          if response.status != 200 or not response.read(4).startswith(b'\x7fELF'):
                              raise ValueError('ARM64 asset is not a downloadable ELF binary')
                      selected_cf = latest_cf
                      cf_status = current_cf + ' -> ' + selected_cf
              elif version(latest_cf) < version(current_cf):
                  cf_status = 'Repository version newer than upstream; no downgrade'
          except Exception as exc:
              cf_status = 'Cloudflared lookup failed; keeping current: ' + str(exc)
          log(cf_status)

          selected_base = current_base
          selected_text = docker_text
          base_status = 'Already current'
          change_base = current_base == 'edge' or version(latest_base) > version(current_base)
          if change_base:
              candidate = pattern.sub(lambda m: m.group(1) + TARGET_PREFIX + latest_base, docker_text, count=1)
              image = TARGET_PREFIX + latest_base
              try:
                  run(['docker', 'pull', '--platform', 'linux/arm64', image])
                  result = run(['docker', 'run', '--rm', '--platform', 'linux/arm64', '--entrypoint', '/bin/sh', image,
                      '-ec', 'test "$(uname -m)" = aarch64; cat /etc/alpine-release; ! grep -Eq "/edge(/|$)" /etc/apk/repositories'], capture_output=True)
                  actual = result.stdout.strip().splitlines()[-1]
                  if not actual.startswith(latest_base + '.'):
                      raise ValueError('Image Alpine release mismatch: ' + actual)
                  # Build the real Dockerfile under emulation, including its real apk commands.
                  # Do not parse or simulate packages from another add-on.
                  with tempfile.NamedTemporaryFile(mode='w', suffix='.Dockerfile', dir=os.environ['RUNNER_TEMP']) as temp:
                      temp.write(candidate)
                      temp.flush()
                      run(['docker', 'build', '--platform', 'linux/arm64', '--pull', '--no-cache',
                           '--build-arg', 'BUILD_ARCH=aarch64', '--build-arg', 'BUILD_VERSION=' + selected_cf,
                           '-f', temp.name, '-t', 'cloudflared-update-check:local', str(ADDON)])
                  selected_base = latest_base
                  selected_text = candidate
                  base_status = current_base + ' -> ' + latest_base + ' (ARM64 image and Dockerfile build verified)'
              except Exception as exc:
                  base_status = 'Stable ' + latest_base + ' available, verification/build failed; keeping ' + current_base
                  log('::warning::' + base_status + ': ' + str(exc))
          elif current_base != 'edge' and version(latest_base) < version(current_base):
              base_status = 'Current tag newer than published stable; no downgrade'
          log(base_status)

          changed = selected_cf != current_cf or selected_base != current_base
          final_version = current_full
          if changed:
              final_version = selected_cf + '-alpine' + selected_base
              version_pattern = re.compile(r'^version\s*:.*$', re.M)
              if len(version_pattern.findall(config_
