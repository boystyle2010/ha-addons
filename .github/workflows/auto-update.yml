name: Auto Check Cloudflared & Alpine Base (Verified)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Official Assets (Logo, Icon, DOCS)
        run: |
          if [ ! -f cloudflared/icon.png ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/icon.png" -o cloudflared/icon.png
          fi
          if [ ! -f cloudflared/logo.png ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/logo.png" -o cloudflared/logo.png
          fi
          if [ ! -f cloudflared/DOCS.md ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/DOCS.md" -o cloudflared/DOCS.md
          fi

      - name: Check & Verify Cloudflared arm64 and Alpine Base
        id: check_versions
        run: |
          CURRENT_VER_FULL=$(grep -oP '^version:\s*"\K[^"]+' cloudflared/config.yaml)
          CURRENT_CF=$(echo "$CURRENT_VER_FULL" | cut -d'-' -f1)
          LATEST_CF=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name' | sed 's/^v//')

          if [ -z "$LATEST_CF" ] || [ "$LATEST_CF" == "null" ]; then
            VERIFIED_CF="$CURRENT_CF"
          elif [ "$LATEST_CF" != "$CURRENT_CF" ]; then
            BINARY_URL="https://github.com/cloudflare/cloudflared/releases/download/${LATEST_CF}/cloudflared-linux-arm64"
            HTTP_STATUS=$(curl -sL -I -o /dev/null -w "%{http_code}" "$BINARY_URL")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              VERIFIED_CF="$LATEST_CF"
            else
              VERIFIED_CF="$CURRENT_CF"
            fi
          else
            VERIFIED_CF="$CURRENT_CF"
          fi

          CURRENT_ALPINE=$(grep -oP 'aarch64-base:\K[0-9]+\.[0-9]+' cloudflared/build.yaml)
          LATEST_ALPINE=$(curl -s https://raw.githubusercontent.com/home-assistant/docker-base/master/alpine/build.yaml | grep -oP 'amd64:\s*alpine:\K[0-9]+\.[0-9]+' | head -n 1)

          if [ -z "$LATEST_ALPINE" ]; then
            VERIFIED_ALPINE="$CURRENT_ALPINE"
          elif [ "$LATEST_ALPINE" != "$CURRENT_ALPINE" ]; then
            if docker manifest inspect "ghcr.io/home-assistant/aarch64-base:${LATEST_ALPINE}" > /dev/null 2>&1; then
              VERIFIED_ALPINE="$LATEST_ALPINE"
            else
              VERIFIED_ALPINE="$CURRENT_ALPINE"
            fi
          else
            VERIFIED_ALPINE="$CURRENT_ALPINE"
          fi

          echo "verified_cf=$VERIFIED_CF" >> $GITHUB_OUTPUT
          echo "current_cf=$CURRENT_CF" >> $GITHUB_OUTPUT
          echo "verified_alpine=$VERIFIED_ALPINE" >> $GITHUB_OUTPUT
          echo "current_alpine=$CURRENT_ALPINE" >> $GITHUB_OUTPUT

      - name: Apply Updates & Keep-Alive Heartbeat
        run: |
          NEW_CF="${{ steps.check_versions.outputs.verified_cf }}"
          CUR_CF="${{ steps.check_versions.outputs.current_cf }}"
          NEW_ALPINE="${{ steps.check_versions.outputs.verified_alpine }}"
          CUR_ALPINE="${{ steps.check_versions.outputs.current_alpine }}"

          if [ "$NEW_CF" != "$CUR_CF" ]; then
            FINAL_VERSION="${NEW_CF}"
          elif [ "$NEW_ALPINE" != "$CUR_ALPINE" ]; then
            FINAL_VERSION="${NEW_CF}-alpine${NEW_ALPINE}"
          else
            FINAL_VERSION=$(grep -oP '^version:\s*"\K[^"]+' cloudflared/config.yaml)
          fi

          sed -i "s|aarch64-base:.*\"|aarch64-base:${NEW_ALPINE}\"|" cloudflared/build.yaml
          sed -i "s/^version: \".*\"/version: \"${FINAL_VERSION}\"/" cloudflared/config.yaml

          if [ "$NEW_CF" != "$CUR_CF" ] || [ "$NEW_ALPINE" != "$CUR_ALPINE" ] || [ ! -f cloudflared/CHANGELOG.md ]; then
            BODY=$(curl -s "https://api.github.com/repos/cloudflare/cloudflared/releases/tags/${NEW_CF}" | jq -r '.body // "Routine security update."')
            printf "# What's Changed in %s\n\n* **Cloudflared Binary (arm64 verified):** \`%s\`\n* **Home Assistant Alpine Base:** \`Alpine %s\`\n\n---\n### Cloudflare Release Notes (%s):\n%s\n" "$FINAL_VERSION" "$NEW_CF" "$NEW_ALPINE" "$NEW_CF" "$BODY" > cloudflared/CHANGELOG.md
          fi

          # KỸ THUẬT CHỐNG NGỦ ĐÔNG (KEEP-ALIVE 45 NGÀY):
          # Kiểm tra thời gian của commit cuối cùng. Nếu đã quá 45 ngày chưa có commit mới,
          # tự động ghi nhận nhịp tim để reset bộ đếm 60 ngày của GitHub.
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          NOW_TS=$(date +%s)
          DAYS_IDLE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))

          if [ "$DAYS_IDLE" -ge 45 ]; then
            echo "Last automated keep-alive check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/workflows/.keepalive
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloudflared/ .github/workflows/
          git diff --staged --quiet || git commit -m "chore(cloudflared): sync version v${FINAL_VERSION} / keep-alive"
          git push
