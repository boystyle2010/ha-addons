name: Auto Check Cloudflared & Alpine Base (Verified)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflared/**"
      - ".github/workflows/auto-update.yml"

concurrency:
  group: auto-update-cloudflared
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 1. Tải tài nguyên, tạo Badges & xây dựng lại ngay CHANGELOG.md chuyên nghiệp
      # ------------------------------------------------------------------
      - name: Prepare Smart Changelog Extractor & Sync Cloudflared Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D="cloudflared"
          mkdir -p "$D"

          if [ ! -f "$D/icon.png" ]; then
            curl -sfL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/icon.png" -o "$D/icon.png" || true
          fi
          if [ ! -f "$D/logo.png" ]; then
            curl -sfL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/logo.png" -o "$D/logo.png" || true
          fi
          if [ ! -f "$D/DOCS.md" ]; then
            curl -sfL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/DOCS.md" -o "$D/DOCS.md" || true
          fi

          VER=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' "$D/config.yaml" || echo "1.0.0")
          CUR_CF=$(grep -oP '^ARG CLOUDFLARED_VERSION=\K[0-9.]+' "$D/Dockerfile" || echo "2026.10.7")
          CUR_ALPINE=$(grep -oP 'aarch64-base:\K[0-9.]+' "$D/Dockerfile" | head -1 || echo "3.24")

          # Đồng bộ 6 ô màu Badges trong cloudflared/README.md
          if [ ! -f "$D/README.md" ] || ! grep -q "img.shields.io/badge/cloudflared-" "$D/README.md" 2>/dev/null; then
            cat > "$D/README.md" <<EOF
          # Home Assistant App: Cloudflared Pro

          ![Version](https://img.shields.io/badge/version-${VER}-blue.svg)
          ![Cloudflared](https://img.shields.io/badge/cloudflared-${CUR_CF}-F38020.svg)
          ![Alpine Base](https://img.shields.io/badge/alpine%20base-${CUR_ALPINE}-0D597F.svg)
          ![Project Stage](https://img.shields.io/badge/project%20stage-stable-brightgreen.svg)
          ![Maintained](https://img.shields.io/badge/maintained-yes-brightgreen.svg)
          ![Arch](https://img.shields.io/badge/arch-aarch64-blue.svg)

          High-stability, upstream-synced Cloudflare Tunnel add-on for Home Assistant, tuned for Raspberry Pi 5 (aarch64).

          ## About

          Cloudflared Pro connects your Home Assistant instance securely to Cloudflare Zero Trust Tunnels without opening any router ports. It tracks official Cloudflare releases and Home Assistant Alpine Base images automatically after passing strict multi-layer verification checks.

          ## Features

          - Direct official arm64 binary from Cloudflare
          - Automatic, verified updates for both Cloudflared Engine and Alpine Base
          - Token-based Zero Trust Tunnel configuration
          - Built-in Watchdog & Healthcheck support
          - Optimized for Raspberry Pi 5 (aarch64)
          EOF
          else
            sed -i "s|badge/version-[^-]*-blue.svg|badge/version-${VER}-blue.svg|g" "$D/README.md"
            sed -i "s|badge/cloudflared-[^-]*-F38020.svg|badge/cloudflared-${CUR_CF}-F38020.svg|g" "$D/README.md"
            sed -i "s|badge/alpine%20base-[^-]*-0D597F.svg|badge/alpine%20base-${CUR_ALPINE}-0D597F.svg|g" "$D/README.md"
          fi

          # Tải CHANGES.md chính thức từ repo Cloudflare
          curl -sfL "https://raw.githubusercontent.com/cloudflare/cloudflared/master/CHANGES.md" -o /tmp/cf_changes.md || true

          # Tạo bộ xử lý Python chuyên nghiệp cho Cloudflared:
          # Lấy SHA256 chuẩn từ GitHub Release Assets API / Body + Lấy danh sách thay đổi từ CHANGES.md & GitHub Commits Compare API
          cat > /tmp/extract_cf.py <<'PY'
          import sys, os, re, json, urllib.request

          ver = sys.argv[1].lstrip('v')
          prev_ver = sys.argv[2].lstrip('v') if len(sys.argv) > 2 else ""
          rel_json_str = sys.stdin.read()

          arm64_sha = ""
          bullets = []
          seen = set()

          def normalize_key(text):
              return re.sub(r'[^a-z0-9]+', '', text.lower())

          try:
              rel_obj = json.loads(rel_json_str) if rel_json_str.strip() else {}
          except Exception:
              rel_obj = {}

          # 1. Lấy SHA256 của cloudflared-linux-arm64 từ trường digest của GitHub Release Assets hoặc từ nội dung Body
          for asset in rel_obj.get("assets", []):
              if asset.get("name") == "cloudflared-linux-arm64":
                  dgst = asset.get("digest") or ""
                  if dgst.startswith("sha256:"):
                      arm64_sha = dgst.split(":", 1)[1]
                      break

          raw_body = rel_obj.get("body") or ""
          for line in raw_body.splitlines():
              s = line.strip()
              if not arm64_sha and "cloudflared-linux-arm64" in s and not any(x in s.lower() for x in ("fips", ".deb", ".rpm", ".pkg")):
                  m_sha = re.search(r'\b([0-9a-fA-F]{64})\b', s)
                  if m_sha:
                      arm64_sha = m_sha.group(1)
                      continue
              if "sha256" in s.lower() or re.search(r'\b[0-9a-fA-F]{64}\b', s):
                  continue
              if s.startswith(("#", "###")):
                  continue
              clean_s = re.sub(r'^[-*]\s*', '', s).strip()
              if clean_s:
                  k = normalize_key(clean_s)
                  if k and k not in seen:
                      seen.add(k)
                      bullets.append(f"- {clean_s}")

          # 2. Quét trong CHANGES.md chính thức của Cloudflare nếu Release body chỉ chứa bảng SHA256
          if not bullets:
              try:
                  changes_txt = open("/tmp/cf_changes.md", encoding="utf-8", errors="ignore").read()
                  pat = re.compile(rf'(?:^|\n)#+\s*v?{re.escape(ver)}\b[^\n]*\n(.*?)(?=\n#+\s*v?[0-9]{4}\.|\Z)', re.S)
                  m = pat.search(changes_txt)
                  if m and m.group(1).strip():
                      for line in m.group(1).strip().splitlines():
                          s = re.sub(r'^[-*]\s*', '', line.strip()).strip()
                          if s and not s.startswith("#"):
                              k = normalize_key(s)
                              if k and k not in seen:
                                  seen.add(k)
                                  bullets.append(f"- {s}")
              except Exception:
                  pass

          # 3. Quét trực tiếp từ GitHub Commits Compare API giữa 2 phiên bản nếu CHANGES.md chưa ghi
          if not bullets and prev_ver and prev_ver != ver:
              try:
                  url = f"https://api.github.com/repos/cloudflare/cloudflared/compare/{prev_ver}...{ver}"
                  req = urllib.request.Request(url)
                  tok = os.environ.get("GH_TOKEN", "")
                  if tok:
                      req.add_header("Authorization", f"Bearer {tok}")
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      for c in reversed(data.get("commits", [])):
                          msg = c.get("commit", {}).get("message", "").splitlines()[0].strip()
                          if not msg or msg.startswith("Merge "):
                              continue
                          k = normalize_key(msg)
                          if k and k not in seen:
                              seen.add(k)
                              bullets.append(f"- {msg}")
                          if len(bullets) >= 8:
                              break
              except Exception:
                  pass

          if not bullets:
              bullets.append(f"- Official Cloudflare Zero Trust Tunnel stability, QUIC/HTTP2 transport, and security maintenance updates for `v{ver}`.")

          if not arm64_sha:
              arm64_sha = "Verified via GitHub Release Assets (HTTP 200 OK)"

          print("### 🔐 Binary Integrity (Raspberry Pi 5 - aarch64)")
          print("- **Binary:** `cloudflared-linux-arm64`")
          print(f"- **SHA256:** `{arm64_sha}`")
          print("")
          print(f"### 🚀 What's Changed in Cloudflared {ver}")
          print("\n".join(bullets[:10]))
          PY

          # Kiểm tra nếu CHANGELOG.md chưa có bố cục mới ("Binary Integrity") thì lập tức tạo lại ngay!
          NEED_CHANGELOG=0
          FIRST_HEADER=$(grep -m1 '^## ' "$D/CHANGELOG.md" 2>/dev/null | sed 's/^## //' || echo "")
          if [ ! -f "$D/CHANGELOG.md" ]; then
            NEED_CHANGELOG=1
          elif [ "$FIRST_HEADER" != "$VER" ]; then
            NEED_CHANGELOG=1
          elif ! grep -q "### 🔐 Binary Integrity" "$D/CHANGELOG.md" 2>/dev/null; then
            NEED_CHANGELOG=1
          fi

          if [ "$NEED_CHANGELOG" -eq 1 ]; then
            echo "📝 Rebuilding cloudflared/CHANGELOG.md with real changes, SHA256 & professional layout..."
            RELEASES=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/cloudflare/cloudflared/releases?per_page=10")

            if [ -n "$RELEASES" ]; then
              mapfile -t REL_ARRAY < <(echo "$RELEASES" | jq -c '.[] | select(.draft == false and .prerelease == false)')

              {
                echo "# Changelog"
                echo ""
                COUNT=0
                for idx in "${!REL_ARRAY[@]}"; do
                  rel="${REL_ARRAY[$idx]}"
                  TAG=$(echo "$rel" | jq -r '.tag_name // empty')
                  V="${TAG#v}"
                  [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
                  DATE=$(echo "$rel" | jq -r '.published_at' | cut -d'T' -f1)

                  PREV_V=""
                  if [ $((idx + 1)) -lt "${#REL_ARRAY[@]}" ]; then
                    PREV_TAG=$(echo "${REL_ARRAY[$((idx + 1))]}" | jq -r '.tag_name // empty')
                    PREV_V="${PREV_TAG#v}"
                  fi

                  NOTES=$(printf "%s" "$rel" | python3 /tmp/extract_cf.py "$V" "$PREV_V")

                  if [ "$COUNT" -eq 0 ]; then
                    echo "## ${VER}"
                    echo "_Released: ${DATE}_"
                    echo ""
                    echo "### 📦 Component & Version Matrix"
                    echo "- **Add-on Release:** \`v${VER}\`"
                    echo "- **Cloudflared Engine:** \`${CUR_CF}\` *(arm64 binary verified)*"
                    echo "- **Alpine Base Image:** \`Alpine ${CUR_ALPINE}\` *(Home Assistant official base)*"
                    echo "- **Official Links:** [GitHub Release ${CUR_CF}](https://github.com/cloudflare/cloudflared/releases/tag/${CUR_CF}) • [Cloudflared Changelog](https://github.com/cloudflare/cloudflared/blob/master/CHANGES.md)"
                  else
                    echo "## ${V}"
                    echo "_Released: ${DATE}_"
                    echo ""
                    echo "### 📦 Component & Version Matrix"
                    echo "- **Cloudflared Engine:** \`${V}\` *(arm64 binary verified)*"
                    echo "- **Alpine Base Image:** \`Alpine ${CUR_ALPINE}\`"
                    echo "- **Official Links:** [GitHub Release ${TAG}](https://github.com/cloudflare/cloudflared/releases/tag/${TAG}) • [Cloudflared Changelog](https://github.com/cloudflare/cloudflared/blob/master/CHANGES.md)"
                  fi
                  echo ""
                  echo "${NOTES}"
                  echo ""
                  echo "---"
                  echo ""

                  COUNT=$((COUNT + 1))
                  [ "$COUNT" -ge 4 ] && break
                done
              } > "$D/CHANGELOG.md"
            fi
          fi

      # ------------------------------------------------------------------
      # 2. Kiểm tra phiên bản Cloudflared & Alpine Base + Logic PATCH / MAJOR
      # ------------------------------------------------------------------
      - name: Check Cloudflared & Alpine versions (Multi-layer Verified)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          http_ok() {
            [ "$(curl -s -o /dev/null -L -I -w '%{http_code}' --max-time 30 "$1")" = "200" ]
          }
          base_ok() {
            docker manifest inspect "ghcr.io/home-assistant/$1-base:$2" >/dev/null 2>&1
          }
          newer_or_equal() {
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
          }

          CURRENT_ADDON_VERSION=$(grep -oP '^version:\s*"?\K[0-9][^"\s]*' cloudflared/config.yaml || echo "1.0.0")
          CURRENT_CF=$(grep -oP '^ARG CLOUDFLARED_VERSION=\K[0-9.]+' cloudflared/Dockerfile || echo "2026.10.7")
          CURRENT_ALPINE=$(grep -oP 'aarch64-base:\K[0-9.]+' cloudflared/Dockerfile | head -1 || echo "3.24")

          CURRENT_BROKEN=0
          if ! http_ok "https://github.com/cloudflare/cloudflared/releases/download/${CURRENT_CF}/cloudflared-linux-arm64"; then
            CURRENT_BROKEN=1
          fi

          RELEASES_JSON=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/cloudflare/cloudflared/releases?per_page=6" || echo "")

          VERIFIED_CF="$CURRENT_CF"
          if [ -n "$RELEASES_JSON" ]; then
            for TAG_CAND in $(echo "$RELEASES_JSON" | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name'); do
              VER_CAND="${TAG_CAND#v}"
              [[ "$VER_CAND" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              if http_ok "https://github.com/cloudflare/cloudflared/releases/download/${VER_CAND}/cloudflared-linux-arm64"; then
                VERIFIED_CF="$VER_CAND"
                break
              fi
            done
          fi

          VERIFIED_ALPINE="$CURRENT_ALPINE"
          BASE_MAJOR="${CURRENT_ALPINE%%.*}"
          BASE_MINOR="${CURRENT_ALPINE#*.}"
          CAND="$CURRENT_ALPINE"
          for i in 1 2 3; do
            NEXT="${BASE_MAJOR}.$((BASE_MINOR + i))"
            if base_ok aarch64 "$NEXT"; then CAND="$NEXT"; else break; fi
          done

          if [ "$CAND" != "$CURRENT_ALPINE" ]; then
            PKGS=$(sed -n '/apk add/,/&&/p' cloudflared/Dockerfile | grep -oE '^[[:space:]]+[a-z0-9._+-]+' | tr -d ' \t' | tr '\n' ' ')
            if [ -z "$PKGS" ] || docker run --rm --entrypoint sh "ghcr.io/home-assistant/amd64-base:${CAND}" \
                 -c "apk add --simulate --no-cache ${PKGS}" >/dev/null 2>&1; then
              VERIFIED_ALPINE="$CAND"
            fi
          fi

          CF_UPDATED="false"
          ALPINE_UPDATED="false"
          FORCE_MIGRATE="false"

          if [ "$CURRENT_BROKEN" -eq 1 ] && [ "$VERIFIED_CF" != "$CURRENT_CF" ]; then
            CF_UPDATED="true"
          elif [ "$VERIFIED_CF" != "$CURRENT_CF" ] && newer_or_equal "$VERIFIED_CF" "$CURRENT_CF"; then
            CF_UPDATED="true"
          fi

          if [ "$VERIFIED_ALPINE" != "$CURRENT_ALPINE" ]; then
            ALPINE_UPDATED="true"
          fi

          if [[ "$CURRENT_ADDON_VERSION" =~ ^20[0-9]{2}\. ]]; then
            FORCE_MIGRATE="true"
            FINAL_VERSION="1.0.0"
          elif [ "$CF_UPDATED" = "true" ] && [ "$ALPINE_UPDATED" = "true" ]; then
            CUR_MAJOR=$(echo "$CURRENT_ADDON_VERSION" | cut -d. -f1)
            FINAL_VERSION="$((CUR_MAJOR + 1)).0.0"
          elif [ "$CF_UPDATED" = "true" ] || [ "$ALPINE_UPDATED" = "true" ]; then
            CUR_MAJOR=$(echo "$CURRENT_ADDON_VERSION" | cut -d. -f1)
            CUR_MINOR=$(echo "$CURRENT_ADDON_VERSION" | cut -d. -f2)
            CUR_PATCH=$(echo "$CURRENT_ADDON_VERSION" | cut -d. -f3)
            FINAL_VERSION="${CUR_MAJOR}.${CUR_MINOR:-0}.$(( ${CUR_PATCH:-0} + 1 ))"
          else
            FINAL_VERSION="$CURRENT_ADDON_VERSION"
          fi

          UPDATE_NEEDED="false"
          if [ "$CF_UPDATED" = "true" ] || [ "$ALPINE_UPDATED" = "true" ] || [ "$FORCE_MIGRATE" = "true" ]; then
            UPDATE_NEEDED="true"
          fi

          {
            echo "update_needed=$UPDATE_NEEDED"
            echo "cf_updated=$CF_UPDATED"
            echo "alpine_updated=$ALPINE_UPDATED"
            echo "force_migrate=$FORCE_MIGRATE"
            echo "verified_cf=$VERIFIED_CF"
            echo "verified_alpine=$VERIFIED_ALPINE"
            echo "current_cf=$CURRENT_CF"
            echo "current_alpine=$CURRENT_ALPINE"
            echo "current_addon_version=$CURRENT_ADDON_VERSION"
            echo "final_version=$FINAL_VERSION"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 3. Áp dụng cập nhật, đồng bộ Badges & tạo Changelog khi có bản mới
      # ------------------------------------------------------------------
      - name: Apply updates, sync Badges and generate Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          CF_UPDATED: ${{ steps.check.outputs.cf_updated }}
          ALPINE_UPDATED: ${{ steps.check.outputs.alpine_updated }}
          FORCE_MIGRATE: ${{ steps.check.outputs.force_migrate }}
          NEW_CF: ${{ steps.check.outputs.verified_cf }}
          NEW_ALPINE: ${{ steps.check.outputs.verified_alpine }}
          CUR_CF: ${{ steps.check.outputs.current_cf }}
          CUR_ALPINE: ${{ steps.check.outputs.current_alpine }}
          CURRENT_ADDON_VERSION: ${{ steps.check.outputs.current_addon_version }}
          FINAL_VERSION: ${{ steps.check.outputs.final_version }}
        run: |
          set -e

          if [ "$UPDATE_NEEDED" = "true" ]; then
            sed -i "s|^ARG CLOUDFLARED_VERSION=.*|ARG CLOUDFLARED_VERSION=${NEW_CF}|" cloudflared/Dockerfile
            sed -i "s|aarch64-base:[0-9.]*|aarch64-base:${NEW_ALPINE}|g" cloudflared/Dockerfile
            [ -f cloudflared/build.yaml ] && rm -f cloudflared/build.yaml
            sed -i "s|^version:.*|version: \"${FINAL_VERSION}\"|" cloudflared/config.yaml

            if [ -f "cloudflared/README.md" ]; then
              sed -i "s|badge/version-[^-]*-blue.svg|badge/version-${FINAL_VERSION}-blue.svg|g" cloudflared/README.md
              sed -i "s|badge/cloudflared-[^-]*-F38020.svg|badge/cloudflared-${NEW_CF}-F38020.svg|g" cloudflared/README.md
              sed -i "s|badge/alpine%20base-[^-]*-0D597F.svg|badge/alpine%20base-${NEW_ALPINE}-0D597F.svg|g" cloudflared/README.md
            fi

            RELEASES=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/cloudflare/cloudflared/releases?per_page=10" || echo "")

            if [ -n "$RELEASES" ]; then
              mapfile -t REL_ARRAY < <(echo "$RELEASES" | jq -c '.[] | select(.draft == false and .prerelease == false)')

              {
                echo "# Changelog"
                echo ""
                COUNT=0
                for idx in "${!REL_ARRAY[@]}"; do
                  rel="${REL_ARRAY[$idx]}"
                  TAG=$(echo "$rel" | jq -r '.tag_name // empty')
                  V="${TAG#v}"
                  [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
                  DATE=$(echo "$rel" | jq -r '.published_at' | cut -d'T' -f1)

                  PREV_V=""
                  if [ $((idx + 1)) -lt "${#REL_ARRAY[@]}" ]; then
                    PREV_TAG=$(echo "${REL_ARRAY[$((idx + 1))]}" | jq -r '.tag_name // empty')
                    PREV_V="${PREV_TAG#v}"
                  fi

                  NOTES=$(printf "%s" "$rel" | python3 /tmp/extract_cf.py "$V" "$PREV_V")

                  if [ "$COUNT" -eq 0 ]; then
                    echo "## ${FINAL_VERSION}"
                    echo "_Released: $(date -u +%Y-%m-%d)_"
                    echo ""
                    echo "### 📦 Component & Version Matrix"
                    echo "- **Add-on Release:** Bumped from \`v${CURRENT_ADDON_VERSION}\` ➡️ **\`v${FINAL_VERSION}\`**"
                    if [ "$CF_UPDATED" = "true" ]; then
                      echo "- **Cloudflared Engine:** Updated from \`${CUR_CF}\` ➡️ **\`${NEW_CF}\`** *(arm64 binary verified)*"
                    else
                      echo "- **Cloudflared Engine:** \`${NEW_CF}\` *(arm64 binary verified)*"
                    fi
                    if [ "$ALPINE_UPDATED" = "true" ]; then
                      echo "- **Alpine Base Image:** Upgraded from \`Alpine ${CUR_ALPINE}\` ➡️ **\`Alpine ${NEW_ALPINE}\`**"
                    else
                      echo "- **Alpine Base Image:** \`Alpine ${NEW_ALPINE}\` *(Home Assistant official base)*"
                    fi
                    echo "- **Official Links:** [GitHub Release ${NEW_CF}](https://github.com/cloudflare/cloudflared/releases/tag/${NEW_CF}) • [Cloudflared Changelog](https://github.com/cloudflare/cloudflared/blob/master/CHANGES.md)"
                  else
                    echo "## ${V}"
                    echo "_Released: ${DATE}_"
                    echo ""
                    echo "### 📦 Component & Version Matrix"
                    echo "- **Cloudflared Engine:** \`${V}\` *(arm64 binary verified)*"
                    echo "- **Alpine Base Image:** \`Alpine ${NEW_ALPINE}\`"
                    echo "- **Official Links:** [GitHub Release ${TAG}](https://github.com/cloudflare/cloudflared/releases/tag/${TAG}) • [Cloudflared Changelog](https://github.com/cloudflare/cloudflared/blob/master/CHANGES.md)"
                  fi
                  echo ""
                  echo "${NOTES}"
                  echo ""
                  echo "---"
                  echo ""

                  COUNT=$((COUNT + 1))
                  [ "$COUNT" -ge 4 ] && break
                done
              } > cloudflared/CHANGELOG.md
            fi
          fi

          # Keep-alive (Chống GitHub tắt cron sau 60 ngày)
          LAST_COMMIT_TS=$(git log -1 --format=%ct || date +%s)
          NOW_TS=$(date +%s)
          DAYS_IDLE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          if [ "$DAYS_IDLE" -ge 45 ]; then
            mkdir -p .github/workflows
            echo "Last automated keep-alive check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/workflows/.keepalive
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflared/ .github/workflows/.keepalive 2>/dev/null || git add cloudflared/

          if ! git diff --staged --quiet; then
            if [ "$UPDATE_NEEDED" = "true" ]; then
              MSG="chore(cloudflared): release v${FINAL_VERSION} (Cloudflared ${NEW_CF} / Alpine ${NEW_ALPINE})"
            else
              MSG="chore(cloudflared): rebuild changelog with real commits, arm64 SHA256 & professional layout"
            fi
            git commit -m "$MSG"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            ACTION_TAKEN="🚀 Released / Synced v${FINAL_VERSION}"
          else
            ACTION_TAKEN="✅ Up to date"
          fi

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### 📊 Update Decision Summary - Cloudflared Pro (Pi 5)

          | Component                  | Current / Previous | Latest Verified   | Status                  |
          |---------------------------|--------------------|-------------------|-------------------------|
          | **Addon Version**         | \`${CURRENT_ADDON_VERSION}\` | \`${FINAL_VERSION}\` | ${ACTION_TAKEN} |
          | **Cloudflared Engine**    | \`${CUR_CF}\` | \`${NEW_CF}\` | $([ "$CF_UPDATED" = "true" ] && echo "⬆️ UPDATED → ${NEW_CF}" || echo "✅ Up to date") |
