name: Auto Check Cloudflared & Alpine Base (Verified)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Icons, Logo, README & DOCS
        run: |
          # 1. Tự động tải Icon và Logo Cloudflare sắc nét nếu chưa có
          if [ ! -f cloudflared/icon.png ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/icon.png" -o cloudflared/icon.png
          fi
          if [ ! -f cloudflared/logo.png ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/logo.png" -o cloudflared/logo.png
          fi

          # 2. Tạo file README.md hiển thị ngoài màn hình chính của Add-on
          cat << 'EOF' > cloudflared/README.md
          # Cloudflare Pro (Raspberry Pi 5 Edition)

          ![Supports aarch64 Architecture][aarch64-shield]
          ![Cloudflare Zero Trust][cf-shield]

          Add-on **Cloudflare Tunnel (cloudflared)** chuyên biệt tối ưu hóa cho phần cứng **64-bit (`aarch64`) của Raspberry Pi 5** chạy Home Assistant OS.

          ## ✨ Tính năng nổi bật

          - 🚀 **Native ARM64 Binary:** Tải và chạy trực tiếp mã nguồn `cloudflared-linux-arm64` chính gốc từ Cloudflare.
          - 🔄 **Auto-Update Verified:** Tự động kiểm tra bản phát hành mới từ Cloudflare & Alpine Base mỗi 6 giờ (xác thực HTTP 200 trước khi báo Update lên Home Assistant).
          - 🛡️ **Zero Trust Dashboard & Local Mode:** Hỗ trợ song song chế độ chạy bằng **Tunnel Token** (quản lý tên miền trên web Cloudflare) hoặc **Local Ingress** (khai báo Subdomain ngay trên UI của Home Assistant).
          - 🔐 **Post-Quantum Cryptography:** Hỗ trợ bật mã hóa lượng tử bảo vệ đường truyền.
          - 📊 **Prometheus Metrics:** Tích hợp cổng xuất dữ liệu giám sát trạng thái Tunnel.

          [aarch64-shield]: https://img.shields.io/badge/aarch64-yes-green.svg
          [cf-shield]: https://img.shields.io/badge/Cloudflare-Zero_Trust-F38020?logo=cloudflare&logoColor=white
          EOF

          # 3. Tạo file DOCS.md hiển thị trong tab Documentation
          cat << 'EOF' > cloudflared/DOCS.md
          # Hướng dẫn cấu hình Cloudflare Pro

          ## Chế độ 1: Sử dụng Cloudflare Zero Trust Token (Khuyên dùng)
          1. Truy cập trang quản trị [Cloudflare Zero Trust](https://one.dash.cloudflare.com/) -> **Networks** -> **Tunnels**.
          2. Tạo một Tunnel mới (chọn loại **Cloudflared**) hoặc chọn Tunnel hiện có -> bấm **Configure**.
          3. Copy chuỗi **Token** (bắt đầu bằng `eyJ...`).
          4. Mở tab **Configuration** của Add-on này -> dán vào ô **Cloudflare Tunnel Token** -> bấm **Save** và khởi động Add-on.
          5. Trong mục **Public Hostname** trên web Cloudflare, trỏ tên miền của bạn về `http://localhost:8123`.

          ## Chế độ 2: Sử dụng Local Mode (Khai báo trực tiếp trên UI)
          - Để trống ô **Tunnel Token**.
          - Đặt file chứng thực `credentials.json` vào thư mục `/share/cloudflared/credentials.json`.
          - Nhập tên miền chính vào ô **External Hostname** và thêm các dịch vụ khác vào mục **Additional Hosts**.

          ## Lưu ý cho Home Assistant (`configuration.yaml`)
          Đừng quên thêm cấu hình `trusted_proxies` vào file `/config/configuration.yaml` của Home Assistant để cho phép kết nối qua Reverse Proxy:
          ```yaml
          http:
            use_x_forwarded_for: true
            trusted_proxies:
              - 172.30.33.0/24
              - 127.0.0.1
              - ::1
          ```
          EOF

      - name: Check & Verify Cloudflared arm64 and Alpine Base
        id: check_versions
        run: |
          CURRENT_VER_FULL=$(grep -oP '^version:\s*"\K[^"]+' cloudflared/config.yaml)
          CURRENT_CF=$(echo "$CURRENT_VER_FULL" | cut -d'-' -f1)
          LATEST_CF=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name' | sed 's/^v//')

          if [ -z "$LATEST_CF" ] || [ "$LATEST_CF" == "null" ]; then
            VERIFIED_CF="$CURRENT_CF"
          elif [ "$LATEST_CF" != "$CURRENT_CF" ]; then
            BINARY_URL="https://github.com/cloudflare/cloudflared/releases/download/${LATEST_CF}/cloudflared-linux-arm64"
            HTTP_STATUS=$(curl -sL -I -o /dev/null -w "%{http_code}" "$BINARY_URL")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              VERIFIED_CF="$LATEST_CF"
            else
              VERIFIED_CF="$CURRENT_CF"
            fi
          else
            VERIFIED_CF="$CURRENT_CF"
          fi

          CURRENT_ALPINE=$(grep -oP 'aarch64-base:\K[0-9]+\.[0-9]+' cloudflared/build.yaml)
          LATEST_ALPINE=$(curl -s https://raw.githubusercontent.com/home-assistant/docker-base/master/alpine/build.yaml | grep -oP 'amd64:\s*alpine:\K[0-9]+\.[0-9]+' | head -n 1)

          if [ -z "$LATEST_ALPINE" ]; then
            VERIFIED_ALPINE="$CURRENT_ALPINE"
          elif [ "$LATEST_ALPINE" != "$CURRENT_ALPINE" ]; then
            if docker manifest inspect "ghcr.io/home-assistant/aarch64-base:${LATEST_ALPINE}" > /dev/null 2>&1; then
              VERIFIED_ALPINE="$LATEST_ALPINE"
            else
              VERIFIED_ALPINE="$CURRENT_ALPINE"
            fi
          else
            VERIFIED_ALPINE="$CURRENT_ALPINE"
          fi

          echo "verified_cf=$VERIFIED_CF" >> $GITHUB_OUTPUT
          echo "current_cf=$CURRENT_CF" >> $GITHUB_OUTPUT
          echo "verified_alpine=$VERIFIED_ALPINE" >> $GITHUB_OUTPUT
          echo "current_alpine=$CURRENT_ALPINE" >> $GITHUB_OUTPUT

      - name: Apply Updates & Push
        run: |
          NEW_CF="${{ steps.check_versions.outputs.verified_cf }}"
          CUR_CF="${{ steps.check_versions.outputs.current_cf }}"
          NEW_ALPINE="${{ steps.check_versions.outputs.verified_alpine }}"
          CUR_ALPINE="${{ steps.check_versions.outputs.current_alpine }}"

          if [ "$NEW_CF" != "$CUR_CF" ]; then
            FINAL_VERSION="${NEW_CF}"
          elif [ "$NEW_ALPINE" != "$CUR_ALPINE" ]; then
            FINAL_VERSION="${NEW_CF}-alpine${NEW_ALPINE}"
          else
            FINAL_VERSION=$(grep -oP '^version:\s*"\K[^"]+' cloudflared/config.yaml)
          fi

          sed -i "s|aarch64-base:.*\"|aarch64-base:${NEW_ALPINE}\"|" cloudflared/build.yaml
          sed -i "s/^version: \".*\"/version: \"${FINAL_VERSION}\"/" cloudflared/config.yaml

          BODY=$(curl -s "https://api.github.com/repos/cloudflare/cloudflared/releases/tags/${NEW_CF}" | jq -r '.body // "Cập nhật bảo mật định kỳ."')
          printf "# What's Changed in %s\n\n* **Cloudflared Binary (arm64 verified):** \`%s\`\n* **Home Assistant Alpine Base:** \`Alpine %s\`\n\n---\n### Chi tiết bản phát hành từ Cloudflare (%s):\n%s\n" "$FINAL_VERSION" "$NEW_CF" "$NEW_ALPINE" "$NEW_CF" "$BODY" > cloudflared/CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloudflared/
          git diff --staged --quiet || git commit -m "chore(cloudflared): update assets and version to v${FINAL_VERSION}"
          git push
