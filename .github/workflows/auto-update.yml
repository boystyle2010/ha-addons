name: Auto Check Cloudflared & Alpine Base (Verified)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: auto-update-cloudflared
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Official Assets (Logo, Icon, DOCS)
        run: |
          echo "🔍 [1/4] Checking UI assets (icon, logo, DOCS)..."
          mkdir -p cloudflared
          if [ ! -f cloudflared/icon.png ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/icon.png" -o cloudflared/icon.png
            echo "  -> Downloaded icon.png"
          fi
          if [ ! -f cloudflared/logo.png ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/logo.png" -o cloudflared/logo.png
            echo "  -> Downloaded logo.png"
          fi
          if [ ! -f cloudflared/DOCS.md ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/DOCS.md" -o cloudflared/DOCS.md
            echo "  -> Downloaded DOCS.md"
          fi
          echo "✅ UI assets are ready!"

      - name: Check & Verify Cloudflared arm64 and Alpine Base
        id: check_versions
        run: |
          set -e

          echo "=========================================================="
          echo "🚀 [2/4] CHECKING CLOUDFLARED VERSION (ARM64 - Raspberry Pi 5)"
          echo "=========================================================="

          CURRENT_VER_FULL=$(grep -oP '^version:\s*"\K[^"]+' cloudflared/config.yaml || echo "2026.10.7")
          CURRENT_CF=$(echo "$CURRENT_VER_FULL" | cut -d'-' -f1)
          LATEST_CF=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name' | sed 's/^v//')

          echo "📌 Current Cloudflared version in repo : $CURRENT_CF"
          echo "🌐 Latest Cloudflared version on GitHub: $LATEST_CF"

          if [ -z "$LATEST_CF" ] || [ "$LATEST_CF" = "null" ]; then
            echo "⚠️ Failed to fetch GitHub API, keeping current version: $CURRENT_CF"
            VERIFIED_CF="$CURRENT_CF"
            CF_STATUS="⚠️ API Error (Keeping $CURRENT_CF)"
          elif [ "$LATEST_CF" != "$CURRENT_CF" ]; then
            BINARY_URL="https://github.com/cloudflare/cloudflared/releases/download/${LATEST_CF}/cloudflared-linux-arm64"
            HTTP_STATUS=$(curl -sL -I -o /dev/null -w "%{http_code}" "$BINARY_URL")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ New version detected ($LATEST_CF) and arm64 binary verified (HTTP 200 OK)!"
              VERIFIED_CF="$LATEST_CF"
              CF_STATUS="🆕 Updated ($CURRENT_CF → $LATEST_CF)"
            else
              echo "⏳ New version available ($LATEST_CF) but arm64 binary not ready yet (HTTP $HTTP_STATUS). Keeping $CURRENT_CF."
              VERIFIED_CF="$CURRENT_CF"
              CF_STATUS="⏳ Waiting for arm64 binary (Keeping $CURRENT_CF)"
            fi
          else
            echo "✅ Cloudflared is already at the latest version ($CURRENT_CF)."
            VERIFIED_CF="$CURRENT_CF"
            CF_STATUS="✅ Up to date ($CURRENT_CF)"
          fi

          echo ""
          echo "=========================================================="
          echo "🏔️ [3/4] CHECKING HOME ASSISTANT ALPINE BASE"
          echo "=========================================================="

          CURRENT_ALPINE=$(grep -oP 'aarch64-base:\K[0-9.]+' cloudflared/Dockerfile | head -1 || echo "3.22")
          echo "📌 Current Alpine Base in Dockerfile: $CURRENT_ALPINE"

          CANDIDATES="3.24 3.23 3.22"

          VERIFIED_ALPINE="$CURRENT_ALPINE"
          ALPINE_STATUS="✅ Up to date (Alpine $CURRENT_ALPINE)"

          for ver in $CANDIDATES; do
            if [ "$(printf '%s\n' "$ver" "$CURRENT_ALPINE" | sort -V | tail -1)" = "$ver" ] && [ "$ver" != "$CURRENT_ALPINE" ]; then
              echo "🔍 Checking availability of aarch64-base:$ver ..."
              if docker manifest inspect "ghcr.io/home-assistant/aarch64-base:${ver}" > /dev/null 2>&1; then
                echo "✅ Found Alpine $ver (available on GHCR)!"
                VERIFIED_ALPINE="$ver"
                ALPINE_STATUS="🆕 Updated (Alpine $CURRENT_ALPINE → $ver)"
                break
              else
                echo "⏳ Tag $ver is not available yet."
              fi
            fi
          done

          if [ "$VERIFIED_ALPINE" = "$CURRENT_ALPINE" ]; then
            echo "ℹ️ Alpine $CURRENT_ALPINE is still the latest verified version."
          fi

          echo "verified_cf=$VERIFIED_CF" >> $GITHUB_OUTPUT
          echo "current_cf=$CURRENT_CF" >> $GITHUB_OUTPUT
          echo "cf_status=$CF_STATUS" >> $GITHUB_OUTPUT
          echo "verified_alpine=$VERIFIED_ALPINE" >> $GITHUB_OUTPUT
          echo "current_alpine=$CURRENT_ALPINE" >> $GITHUB_OUTPUT
          echo "alpine_status=$ALPINE_STATUS" >> $GITHUB_OUTPUT

      - name: Apply Updates & Generate Summary Report
        run: |
          set -e

          echo "=========================================================="
          echo "⚙️ [4/4] APPLYING UPDATES & GENERATING REPORT"
          echo "=========================================================="

          NEW_CF="${{ steps.check_versions.outputs.verified_cf }}"
          CUR_CF="${{ steps.check_versions.outputs.current_cf }}"
          CF_STATUS="${{ steps.check_versions.outputs.cf_status }}"
          NEW_ALPINE="${{ steps.check_versions.outputs.verified_alpine }}"
          CUR_ALPINE="${{ steps.check_versions.outputs.current_alpine }}"
          ALPINE_STATUS="${{ steps.check_versions.outputs.alpine_status }}"

          CF_UPDATED=false
          ALPINE_UPDATED=false

          [ "$NEW_CF" != "$CUR_CF" ] && CF_UPDATED=true
          [ "$NEW_ALPINE" != "$CUR_ALPINE" ] && ALPINE_UPDATED=true

          # Determine final version
          if $CF_UPDATED; then
            FINAL_VERSION="${NEW_CF}"
          elif $ALPINE_UPDATED; then
            FINAL_VERSION="${NEW_CF}-alpine${NEW_ALPINE}"
          else
            FINAL_VERSION=$(grep -oP '^version:\s*"\K[^"]+' cloudflared/config.yaml)
          fi

          # Update Dockerfile
          sed -i "s|aarch64-base:[0-9.]*|aarch64-base:${NEW_ALPINE}|g" cloudflared/Dockerfile
          [ -f cloudflared/build.yaml ] && rm -f cloudflared/build.yaml

          # Update version
          sed -i "s/^version: \".*\"/version: \"${FINAL_VERSION}\"/" cloudflared/config.yaml

          # ==================== GENERATE CHANGELOG ====================
          echo "📝 Generating CHANGELOG.md..."

          NEW_SECTION="# What's Changed in ${FINAL_VERSION}

          * **Cloudflared Binary (arm64 verified):** \`${NEW_CF}\`
          * **Home Assistant Alpine Base:** \`Alpine ${NEW_ALPINE}\`
          "

          if $CF_UPDATED && $ALPINE_UPDATED; then
            NEW_SECTION+="
          ### Changes in this release
          - Updated Cloudflared to the latest version (\`${NEW_CF}\`)
          - Upgraded Home Assistant Alpine Base to \`${NEW_ALPINE}\`
          "
          elif $CF_UPDATED; then
            NEW_SECTION+="
          ### Changes in this release
          - Updated Cloudflared to the latest version (\`${NEW_CF}\`)
          "
          elif $ALPINE_UPDATED; then
            NEW_SECTION+="
          ### Changes in this release
          - Upgraded Home Assistant Alpine Base from \`${CUR_ALPINE}\` to \`${NEW_ALPINE}\`
          - Cloudflared remains at version \`${NEW_CF}\`
          "
          else
            NEW_SECTION+="
          ### Current Version Information
          - Cloudflared: \`${NEW_CF}\` (arm64 binary verified)
          - Alpine Base: \`${NEW_ALPINE}\` (official Home Assistant base image)
          - Optimized for Raspberry Pi 5 (aarch64)
          "
          fi

          # Cloudflare release notes
          if $CF_UPDATED; then
            BODY=$(curl -s "https://api.github.com/repos/cloudflare/cloudflared/releases/tags/${NEW_CF}" | jq -r '.body // empty' | sed '/SHA256 Checksums:/,$d' | sed '/^$/d')
            if [ -n "$BODY" ]; then
              NEW_SECTION+="
          ---
          ### Cloudflare Release Notes (${NEW_CF})

          ${BODY}
          "
            else
              NEW_SECTION+="
          ---
          ### Cloudflare Release Notes (${NEW_CF})
          - Security updates and bug fixes.
          - Full release notes: https://github.com/cloudflare/cloudflared/releases/tag/${NEW_CF}
          "
            fi
          else
            NEW_SECTION+="
          ---
          ### Cloudflare Release Notes (${NEW_CF})
          - This is the current stable version.
          - arm64 binary has been verified.
          - Full release notes: https://github.com/cloudflare/cloudflared/releases/tag/${NEW_CF}
          "
          fi

          NEW_SECTION+="
          ---
          "

          # Keep maximum 2 previous versions (total 3)
          OLD_CONTENT=""
          if [ -f cloudflared/CHANGELOG.md ]; then
            OLD_CONTENT=$(awk '
              BEGIN { section=0; print_section=0 }
              /^# What'\''s Changed in / {
                section++
                if (section == 1) { print_section=0; next }
                if (section <= 3) { print_section=1 }
                else { print_section=0 }
              }
              print_section { print }
            ' cloudflared/CHANGELOG.md)
          fi

          # Write final CHANGELOG
          {
            echo "$NEW_SECTION"
            if [ -n "$OLD_CONTENT" ]; then
              echo "$OLD_CONTENT"
            fi
          } > cloudflared/CHANGELOG.md

          # Keep-Alive (45 days)
          LAST_COMMIT_TS=$(git log -1 --format=%ct || date +%s)
          NOW_TS=$(date +%s)
          DAYS_IDLE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))

          if [ "$DAYS_IDLE" -ge 45 ]; then
            echo "💓 ${DAYS_IDLE} days without commit → Triggering Keep-Alive!"
            mkdir -p .github/workflows
            echo "Last automated keep-alive check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/workflows/.keepalive
          fi

          # Commit & Push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --staged --quiet; then
            git commit -m "chore(cloudflared): sync version v${FINAL_VERSION} (Alpine ${NEW_ALPINE})"
            git pull --rebase origin main
            git push
            ACTION_TAKEN="🚀 **Pushed new version \`v${FINAL_VERSION}\`**"
            echo "✅ Successfully committed and pushed v${FINAL_VERSION}"
          else
            ACTION_TAKEN="💤 **No changes (still on \`v${FINAL_VERSION}\`)**"
            echo "💤 Everything is already up to date."
          fi

          # Job Summary
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 📊 Auto Update Report - Cloudflared Pro (Pi 5)
          | Component | Current Version | Latest Version | Status |
          | :--- | :---: | :---: | :--- |
          | **Cloudflared (arm64)** | \`${CUR_CF}\` | \`${NEW_CF}\` | ${CF_STATUS} |
          | **Alpine Base Image** | \`Alpine ${CUR_ALPINE}\` | \`Alpine ${NEW_ALPINE}\` | ${ALPINE_STATUS} |

          * **Current Add-on Version:** \`${FINAL_VERSION}\`
          * **Idle Time:** \`${DAYS_IDLE} / 45 days\`
          * **Result:** ${ACTION_TAKEN}
          EOF
