name: Auto Check Cloudflared & Alpine Base (Verified)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: auto-update-cloudflared
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Official Assets (Logo, Icon, DOCS)
        run: |
          echo "🔍 [1/4] Kiểm tra tài nguyên giao diện (icon, logo, DOCS)..."
          [ ! -f cloudflared/icon.png ] && curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/icon.png" -o cloudflared/icon.png
          [ ! -f cloudflared/logo.png ] && curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/logo.png" -o cloudflared/logo.png
          [ ! -f cloudflared/DOCS.md ] && curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/DOCS.md" -o cloudflared/DOCS.md
          echo "✅ Tài nguyên giao diện đã đầy đủ!"

      - name: Check & Verify Cloudflared arm64 and Alpine Base
        id: check_versions
        run: |
          echo "=========================================================="
          echo "🚀 [2/4] KIỂM TRA PHIÊN BẢN CLOUDFLARED (ARM64 RASPBERRY PI 5)"
          echo "=========================================================="
          CURRENT_VER_FULL=$(grep -oP '^version:\s*"\K[^"]+' cloudflared/config.yaml || echo "2026.10.7")
          CURRENT_CF=$(echo "$CURRENT_VER_FULL" | cut -d'-' -f1)
          LATEST_CF=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name' | sed 's/^v//')

          echo "📌 Phiên bản Cloudflared hiện tại : $CURRENT_CF"
          echo "🌐 Phiên bản Cloudflared mới nhất : $LATEST_CF"

          if [ -z "$LATEST_CF" ] || [ "$LATEST_CF" == "null" ]; then
            VERIFIED_CF="$CURRENT_CF"
            CF_STATUS="⚠️ Lỗi API (Giữ nguyên $CURRENT_CF)"
          elif [ "$LATEST_CF" != "$CURRENT_CF" ]; then
            BINARY_URL="https://github.com/cloudflare/cloudflared/releases/download/${LATEST_CF}/cloudflared-linux-arm64"
            HTTP_STATUS=$(curl -sL -I -o /dev/null -w "%{http_code}" "$BINARY_URL")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              VERIFIED_CF="$LATEST_CF"
              CF_STATUS="🆕 Cập nhật mới ($CURRENT_CF ➔ $LATEST_CF)"
            else
              VERIFIED_CF="$CURRENT_CF"
              CF_STATUS="⏳ Chờ binary arm64 (Giữ $CURRENT_CF)"
            fi
          else
            VERIFIED_CF="$CURRENT_CF"
            CF_STATUS="✅ Đã mới nhất ($CURRENT_CF)"
          fi

          echo ""
          echo "=========================================================="
          echo "🏔️ [3/4] KIỂM TRA PHIÊN BẢN HOME ASSISTANT ALPINE BASE"
          echo "=========================================================="
          # Đọc phiên bản Alpine hiện tại trong Dockerfile hoặc CHANGELOG.md
          CURRENT_ALPINE=$(grep -oP 'aarch64-base:\K[0-9]+\.[0-9]+' cloudflared/Dockerfile || grep -oP 'Alpine \K[0-9]+\.[0-9]+' cloudflared/CHANGELOG.md | head -n 1 || echo "3.21")

          # Quét từ nhánh main (và master dự phòng) của home-assistant/docker-base giống bên Tailscale
          LATEST_ALPINE=$(curl -sL https://raw.githubusercontent.com/home-assistant/docker-base/main/alpine/build.yaml https://raw.githubusercontent.com/home-assistant/docker-base/master/alpine/build.yaml | grep -oP '3\.[0-9]+' | sort -V | tail -n 1)

          # Nếu GitHub raw bị trễ, quét thêm từ API tag của home-assistant/docker-base
          if [ -z "$LATEST_ALPINE" ]; then
            LATEST_ALPINE=$(curl -s https://api.github.com/repos/home-assistant/docker-base/releases/latest | grep -oP '3\.[0-9]+' | sort -V | tail -n 1)
          fi

          echo "📌 Phiên bản Alpine hiện tại : $CURRENT_ALPINE"
          echo "🌐 Phiên bản Alpine mới nhất : $LATEST_ALPINE"

          if [ -z "$LATEST_ALPINE" ] || [ "$LATEST_ALPINE" == "null" ]; then
            VERIFIED_ALPINE="$CURRENT_ALPINE"
            ALPINE_STATUS="⚠️ Giữ nguyên ($CURRENT_ALPINE)"
          elif [ "$LATEST_ALPINE" != "$CURRENT_ALPINE" ]; then
            echo "🆕 Phát hiện Alpine Base mới: $CURRENT_ALPINE ➔ $LATEST_ALPINE"
            VERIFIED_ALPINE="$LATEST_ALPINE"
            ALPINE_STATUS="🆕 Cập nhật mới ($CURRENT_ALPINE ➔ $LATEST_ALPINE)"
          else
            VERIFIED_ALPINE="$CURRENT_ALPINE"
            ALPINE_STATUS="✅ Đã mới nhất ($CURRENT_ALPINE)"
          fi

          echo "verified_cf=$VERIFIED_CF" >> $GITHUB_OUTPUT
          echo "current_cf=$CURRENT_CF" >> $GITHUB_OUTPUT
          echo "cf_status=$CF_STATUS" >> $GITHUB_OUTPUT
          echo "verified_alpine=$VERIFIED_ALPINE" >> $GITHUB_OUTPUT
          echo "current_alpine=$CURRENT_ALPINE" >> $GITHUB_OUTPUT
          echo "alpine_status=$ALPINE_STATUS" >> $GITHUB_OUTPUT

      - name: Apply Updates & Generate Summary Report
        run: |
          NEW_CF="${{ steps.check_versions.outputs.verified_cf }}"
          CUR_CF="${{ steps.check_versions.outputs.current_cf }}"
          CF_STATUS="${{ steps.check_versions.outputs.cf_status }}"
          NEW_ALPINE="${{ steps.check_versions.outputs.verified_alpine }}"
          CUR_ALPINE="${{ steps.check_versions.outputs.current_alpine }}"
          ALPINE_STATUS="${{ steps.check_versions.outputs.alpine_status }}"

          if [ "$NEW_CF" != "$CUR_CF" ]; then
            FINAL_VERSION="${NEW_CF}"
          elif [ "$NEW_ALPINE" != "$CUR_ALPINE" ]; then
            FINAL_VERSION="${NEW_CF}-alpine${NEW_ALPINE}"
          else
            FINAL_VERSION=$(grep -oP '^version:\s*"\K[^"]+' cloudflared/config.yaml)
          fi

          # Đảm bảo Dockerfile luôn được cập nhật đúng dòng FROM Alpine mới nhất
          if grep -q "aarch64-base:" cloudflared/Dockerfile; then
            sed -i "s|aarch64-base:[0-9.]*|aarch64-base:${NEW_ALPINE}|g" cloudflared/Dockerfile
          else
            sed -i "s|^ARG BUILD_FROM.*|ARG BUILD_FROM=ghcr.io/home-assistant/aarch64-base:${NEW_ALPINE}|g" cloudflared/Dockerfile
          fi

          [ -f cloudflared/build.yaml ] && rm -f cloudflared/build.yaml
          sed -i "s/^version: \".*\"/version: \"${FINAL_VERSION}\"/" cloudflared/config.yaml

          # Tạo lại CHANGELOG theo chuẩn gọn đẹp giống Tailscale (Tích hợp lịch sử phiên bản)
          if [ "$NEW_CF" != "$CUR_CF" ] || [ "$NEW_ALPINE" != "$CUR_ALPINE" ] || [ ! -f cloudflared/CHANGELOG.md ] || grep -q "SHA256 Checksums" cloudflared/CHANGELOG.md; then
            BODY=$(curl -s "https://api.github.com/repos/cloudflare/cloudflared/releases/tags/${NEW_CF}" | jq -r '.body // "Routine security update."' | sed '/SHA256 Checksums:/,$d')
            TODAY=$(date -u '+%Y-%m-%d')
            cat <<EOF > cloudflared/CHANGELOG.md
# Changelog

## ${FINAL_VERSION}
Released: ${TODAY}

### 📦 Component Updates
* **Cloudflared Engine (arm64 verified):** \`v${NEW_CF}\`
* **Home Assistant Alpine Base:** \`Alpine ${NEW_ALPINE}\` (Verified package compatibility)
* **Official Release Source:** [GitHub Release ${NEW_CF}](https://github.com/cloudflare/cloudflared/releases/tag/${NEW_CF})

### 📝 Upstream Release Notes (${NEW_CF})
${BODY}
EOF
          fi

          LAST_COMMIT_TS=$(git log -1 --format=%ct || date +%s)
          NOW_TS=$(date +%s)
          DAYS_IDLE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))

          if [ "$DAYS_IDLE" -ge 45 ]; then
            echo "Last automated keep-alive check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/workflows/.keepalive
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(cloudflared): sync version v${FINAL_VERSION} (Alpine ${NEW_ALPINE})"
            git pull --rebase origin main
            git push
            ACTION_TAKEN="🚀 **Đã đẩy bản cập nhật mới lên GitHub (\`v${FINAL_VERSION}\`)**"
          else
            ACTION_TAKEN="💤 **Không có thay đổi (Giữ nguyên \`v${FINAL_VERSION}\`)**"
          fi

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 📊 Báo cáo Kiểm tra Tự động Cloudflared Pro (Pi 5)
          | Thành phần | Phiên bản đang cài | Phiên bản mới nhất | Trạng thái xử lý |
          | :--- | :---: | :---: | :--- |
          | **Cloudflared (arm64)** | \`${CUR_CF}\` | \`${NEW_CF}\` | ${CF_STATUS} |
          | **Alpine Base Image** | \`Alpine ${CUR_ALPINE}\` | \`Alpine ${NEW_ALPINE}\` | ${ALPINE_STATUS} |

          * **Phiên bản Add-on hiện hành:** \`${FINAL_VERSION}\`
          * **Thời gian không hoạt động (Idle):** \`${DAYS_IDLE} / 45 ngày\`
          * **Kết quả thực thi:** ${ACTION_TAKEN}
          EOF
