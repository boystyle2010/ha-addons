name: Auto Check Cloudflared & Alpine Base (Verified)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: auto-update-cloudflared
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Official Assets (Logo, Icon, DOCS)
        run: |
          echo "🔍 [1/4] Kiểm tra tài nguyên giao diện (icon, logo, DOCS)..."
          mkdir -p cloudflared
          if [ ! -f cloudflared/icon.png ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/icon.png" -o cloudflared/icon.png
            echo "  -> Đã tải mới icon.png"
          fi
          if [ ! -f cloudflared/logo.png ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/logo.png" -o cloudflared/logo.png
            echo "  -> Đã tải mới logo.png"
          fi
          if [ ! -f cloudflared/DOCS.md ]; then
            curl -sL "https://raw.githubusercontent.com/brenner-tobias/addon-cloudflared/main/cloudflared/DOCS.md" -o cloudflared/DOCS.md
            echo "  -> Đã tải mới DOCS.md"
          fi
          echo "✅ Tài nguyên giao diện đã đầy đủ!"

      - name: Check & Verify Cloudflared arm64 and Alpine Base
        id: check_versions
        run: |
          set -e

          echo "=========================================================="
          echo "🚀 [2/4] KIỂM TRA PHIÊN BẢN CLOUDFLARED (ARM64 RASPBERRY PI 5)"
          echo "=========================================================="

          CURRENT_VER_FULL=$(grep -oP '^version:\s*"\K[^"]+' cloudflared/config.yaml || echo "2026.10.7")
          CURRENT_CF=$(echo "$CURRENT_VER_FULL" | cut -d'-' -f1)
          LATEST_CF=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name' | sed 's/^v//')

          echo "📌 Phiên bản Cloudflared hiện tại trong repo : $CURRENT_CF"
          echo "🌐 Phiên bản Cloudflared mới nhất trên GitHub: $LATEST_CF"

          if [ -z "$LATEST_CF" ] || [ "$LATEST_CF" = "null" ]; then
            echo "⚠️ Không lấy được API GitHub, giữ nguyên bản hiện tại: $CURRENT_CF"
            VERIFIED_CF="$CURRENT_CF"
            CF_STATUS="⚠️ Lỗi API (Giữ nguyên $CURRENT_CF)"
          elif [ "$LATEST_CF" != "$CURRENT_CF" ]; then
            BINARY_URL="https://github.com/cloudflare/cloudflared/releases/download/${LATEST_CF}/cloudflared-linux-arm64"
            HTTP_STATUS=$(curl -sL -I -o /dev/null -w "%{http_code}" "$BINARY_URL")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Đã phát hiện bản mới ($LATEST_CF) và xác thực file arm64 (HTTP 200 OK)!"
              VERIFIED_CF="$LATEST_CF"
              CF_STATUS="🆕 Cập nhật mới ($CURRENT_CF ➔ $LATEST_CF)"
            else
              echo "⏳ Có bản mới ($LATEST_CF) nhưng chưa có binary arm64 (HTTP $HTTP_STATUS). Tạm giữ $CURRENT_CF."
              VERIFIED_CF="$CURRENT_CF"
              CF_STATUS="⏳ Chờ binary arm64 (Giữ $CURRENT_CF)"
            fi
          else
            echo "✅ Cloudflared đang ở phiên bản mới nhất ($CURRENT_CF)."
            VERIFIED_CF="$CURRENT_CF"
            CF_STATUS="✅ Đã mới nhất ($CURRENT_CF)"
          fi

          echo ""
          echo "=========================================================="
          echo "🏔️ [3/4] KIỂM TRA PHIÊN BẢN HOME ASSISTANT ALPINE BASE"
          echo "=========================================================="

          CURRENT_ALPINE=$(grep -oP 'aarch64-base:\K[0-9.]+' cloudflared/Dockerfile | head -1 || echo "3.22")
          echo "📌 Alpine Base hiện tại trong Dockerfile: $CURRENT_ALPINE"

          CANDIDATES="3.24 3.23 3.22"

          VERIFIED_ALPINE="$CURRENT_ALPINE"
          ALPINE_STATUS="✅ Đã mới nhất (Alpine $CURRENT_ALPINE)"

          for ver in $CANDIDATES; do
            if [ "$(printf '%s\n' "$ver" "$CURRENT_ALPINE" | sort -V | tail -1)" = "$ver" ] && [ "$ver" != "$CURRENT_ALPINE" ]; then
              echo "🔍 Đang kiểm tra sự tồn tại của aarch64-base:$ver ..."
              if docker manifest inspect "ghcr.io/home-assistant/aarch64-base:${ver}" > /dev/null 2>&1; then
                echo "✅ Tìm thấy Alpine $ver (có sẵn trên GHCR)!"
                VERIFIED_ALPINE="$ver"
                ALPINE_STATUS="🆕 Cập nhật mới (Alpine $CURRENT_ALPINE ➔ $ver)"
                break
              else
                echo "⏳ Tag $ver chưa tồn tại hoặc chưa public."
              fi
            fi
          done

          if [ "$VERIFIED_ALPINE" = "$CURRENT_ALPINE" ]; then
            echo "ℹ️ Alpine $CURRENT_ALPINE vẫn là bản mới nhất được xác thực."
          fi

          echo "verified_cf=$VERIFIED_CF" >> $GITHUB_OUTPUT
          echo "current_cf=$CURRENT_CF" >> $GITHUB_OUTPUT
          echo "cf_status=$CF_STATUS" >> $GITHUB_OUTPUT
          echo "verified_alpine=$VERIFIED_ALPINE" >> $GITHUB_OUTPUT
          echo "current_alpine=$CURRENT_ALPINE" >> $GITHUB_OUTPUT
          echo "alpine_status=$ALPINE_STATUS" >> $GITHUB_OUTPUT

      - name: Apply Updates & Generate Summary Report
        run: |
          set -e

          echo "=========================================================="
          echo "⚙️ [4/4] ÁP DỤNG CẬP NHẬT & TẠO BÁO CÁO KẾT QUẢ"
          echo "=========================================================="

          NEW_CF="${{ steps.check_versions.outputs.verified_cf }}"
          CUR_CF="${{ steps.check_versions.outputs.current_cf }}"
          CF_STATUS="${{ steps.check_versions.outputs.cf_status }}"
          NEW_ALPINE="${{ steps.check_versions.outputs.verified_alpine }}"
          CUR_ALPINE="${{ steps.check_versions.outputs.current_alpine }}"
          ALPINE_STATUS="${{ steps.check_versions.outputs.alpine_status }}"

          CF_UPDATED=false
          ALPINE_UPDATED=false

          [ "$NEW_CF" != "$CUR_CF" ] && CF_UPDATED=true
          [ "$NEW_ALPINE" != "$CUR_ALPINE" ] && ALPINE_UPDATED=true

          # Quyết định version cuối cùng
          if $CF_UPDATED; then
            FINAL_VERSION="${NEW_CF}"
          elif $ALPINE_UPDATED; then
            FINAL_VERSION="${NEW_CF}-alpine${NEW_ALPINE}"
          else
            FINAL_VERSION=$(grep -oP '^version:\s*"\K[^"]+' cloudflared/config.yaml)
          fi

          # Cập nhật Dockerfile
          sed -i "s|aarch64-base:[0-9.]*|aarch64-base:${NEW_ALPINE}|g" cloudflared/Dockerfile
          [ -f cloudflared/build.yaml ] && rm -f cloudflared/build.yaml

          # Cập nhật version
          sed -i "s/^version: \".*\"/version: \"${FINAL_VERSION}\"/" cloudflared/config.yaml

          # ==================== TẠO CHANGELOG (GIỮ 3 BẢN GẦN NHẤT) ====================
          if $CF_UPDATED || $ALPINE_UPDATED || [ ! -f cloudflared/CHANGELOG.md ]; then
            echo "📝 Đang tạo CHANGELOG.md (giữ tối đa 3 phiên bản gần nhất)..."

            # Tạo phần changelog của bản mới
            NEW_SECTION=$(cat <<EOF
          # What's Changed in ${FINAL_VERSION}

          * **Cloudflared Binary (arm64 verified):** \`${NEW_CF}\`
          * **Home Assistant Alpine Base:** \`Alpine ${NEW_ALPINE}\`

          EOF
          )

            if $CF_UPDATED && $ALPINE_UPDATED; then
              NEW_SECTION+=$(cat <<EOF

          ### Cập nhật lần này
          - Nâng cấp Cloudflared lên phiên bản mới nhất
          - Nâng cấp Alpine Base Image lên ${NEW_ALPINE}

          EOF
          )
            elif $CF_UPDATED; then
              NEW_SECTION+=$(cat <<EOF

          ### Cập nhật lần này
          - Nâng cấp Cloudflared lên phiên bản mới nhất

          EOF
          )
            elif $ALPINE_UPDATED; then
              NEW_SECTION+=$(cat <<EOF

          ### Cập nhật lần này
          - Nâng cấp Home Assistant Alpine Base từ \`${CUR_ALPINE}\` lên \`${NEW_ALPINE}\`
          - Giữ nguyên phiên bản Cloudflared \`${NEW_CF}\`

          EOF
          )
            fi

            # Lấy release notes của Cloudflare nếu có update
            if $CF_UPDATED; then
              BODY=$(curl -s "https://api.github.com/repos/cloudflare/cloudflared/releases/tags/${NEW_CF}" | jq -r '.body // empty' | sed '/SHA256 Checksums:/,$d')
              if [ -n "$BODY" ]; then
                NEW_SECTION+=$(cat <<EOF

          ---
          ### Cloudflare Release Notes (${NEW_CF}):

          ${BODY}

          EOF
          )
              fi
            fi

            NEW_SECTION+=$'\n---\n'

            # Lấy các phần changelog cũ (bỏ phần đầu tiên nếu trùng version)
            OLD_CONTENT=""
            if [ -f cloudflared/CHANGELOG.md ]; then
              # Tách các section theo dòng bắt đầu bằng "# What's Changed"
              # Giữ tối đa 2 section cũ (cộng với bản mới = 3)
              OLD_CONTENT=$(awk '
                BEGIN { section=0; print_section=0 }
                /^# What'\''s Changed in / {
                  section++
                  if (section == 1) { print_section=0; next }
                  if (section <= 3) { print_section=1 }
                  else { print_section=0 }
                }
                print_section { print }
              ' cloudflared/CHANGELOG.md)
            fi

            # Ghi file mới: bản mới nhất + tối đa 2 bản cũ
            {
              echo "$NEW_SECTION"
              if [ -n "$OLD_CONTENT" ]; then
                echo "$OLD_CONTENT"
              fi
            } > cloudflared/CHANGELOG.md

            # Đảm bảo file kết thúc bằng dòng trống
            echo "" >> cloudflared/CHANGELOG.md
          fi

          # Keep-Alive 45 ngày
          LAST_COMMIT_TS=$(git log -1 --format=%ct || date +%s)
          NOW_TS=$(date +%s)
          DAYS_IDLE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))

          if [ "$DAYS_IDLE" -ge 45 ]; then
            echo "💓 Đã $DAYS_IDLE ngày không có commit mới -> Kích hoạt Keep-Alive!"
            mkdir -p .github/workflows
            echo "Last automated keep-alive check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/workflows/.keepalive
          fi

          # Commit & Push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --staged --quiet; then
            git commit -m "chore(cloudflared): sync version v${FINAL_VERSION} (Alpine ${NEW_ALPINE})"
            git pull --rebase origin main
            git push
            ACTION_TAKEN="🚀 **Đã đẩy bản cập nhật mới lên GitHub (\`v${FINAL_VERSION}\`)**"
            echo "✅ Đã commit và push bản cập nhật v${FINAL_VERSION} thành công!"
          else
            ACTION_TAKEN="💤 **Không có thay đổi (Giữ nguyên \`v${FINAL_VERSION}\`)**"
            echo "💤 Mọi thứ đều đã ở bản mới nhất."
          fi

          # Job Summary
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 📊 Báo cáo Kiểm tra Tự động Cloudflared Pro (Pi 5)
          | Thành phần | Phiên bản đang cài | Phiên bản mới nhất | Trạng thái xử lý |
          | :--- | :---: | :---: | :--- |
          | **Cloudflared (arm64)** | \`${CUR_CF}\` | \`${NEW_CF}\` | ${CF_STATUS} |
          | **Alpine Base Image** | \`Alpine ${CUR_ALPINE}\` | \`Alpine ${NEW_ALPINE}\` | ${ALPINE_STATUS} |

          * **Phiên bản Add-on hiện hành:** \`${FINAL_VERSION}\`
          * **Thời gian không hoạt động (Idle):** \`${DAYS_IDLE} / 45 ngày\`
          * **Kết quả thực thi:** ${ACTION_TAKEN}
          EOF
