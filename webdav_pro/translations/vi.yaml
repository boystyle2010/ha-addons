configuration:
  unified_root:
    name: Gom tất cả vào 1 đường dẫn gốc (Unified Root)
    description: Khi bật, bạn chỉ cần kết nối vào địa chỉ gốc "/" là thấy toàn bộ các thư mục (config, addon_configs, backup, media, share, ssl) và có thể di chuyển file qua lại giữa chúng. Tắt đi nếu bạn muốn phân quyền Chỉ đọc (Read-Only) riêng cho từng thư mục.
  ssl:
    name: Kích hoạt SSL (HTTPS)
    description: Bật mã hóa trực tiếp bằng chứng chỉ trong thư mục /ssl (Đặt là Tắt nếu bạn dùng qua Cloudflare Tunnel).
  certfile:
    name: File chứng chỉ (Certificate)
    description: Tên file chứng chỉ nằm trong thư mục /ssl.
  keyfile:
    name: File khóa riêng (Private Key)
    description: Tên file khóa riêng nằm trong thư mục /ssl.
  max_upload_size:
    name: Giới hạn dung lượng tải lên tối đa
    description: Đặt là "0" để không giới hạn dung lượng (hỗ trợ tải file Backup nhiều GB), hoặc điền ví dụ "5G".
  fancy_ui:
    name: Giao diện Web Dark Mode (FancyIndex)
    description: Hiển thị giao diện duyệt file hiện đại có thanh tìm kiếm nhanh khi mở bằng trình duyệt hoặc qua thanh bên Home Assistant (Ingress).
  show_dotfiles:
    name: Hiển thị file ẩn (Dotfiles)
    description: Cho phép nhìn thấy và chỉnh sửa các thư mục ẩn như .storage, .cloud trong Home Assistant.
  log_level:
    name: Mức độ ghi nhật ký (Log Level)
    description: Độ chi tiết của log hệ thống Nginx.
  users:
    name: Danh sách tài khoản (Users)
    description: Khai báo tài khoản và mật khẩu kết nối WebDAV (mã hóa chuẩn Bcrypt).
  shares:
    name: Danh sách thư mục hệ thống (Shares)
    description: Các phân vùng của Home Assistant được mở qua WebDAV.
network:
  8080/tcp: Cổng kết nối WebDAV Server
