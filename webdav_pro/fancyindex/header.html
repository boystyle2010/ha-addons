<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Assistant WebDAV Pro</title>
    <style>
        :root {
            --bg-color: #111111;
            --card-bg: #1c1c1c;
            --text-color: #e1e1e1;
            --accent-color: #03a9f4;
            --border-color: #2c2c2c;
            --hover-bg: #262626;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--accent-color);
            word-break: break-all;
        }
        .search-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 8px;
            outline: none;
            min-width: 240px;
        }
        .search-box:focus { border-color: var(--accent-color); }
        table#list {
            width: 100%;
            border-collapse: collapse;
        }
        #list th {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 2px solid var(--border-color);
            color: #9e9e9e;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        #list td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }
        #list tr:hover td { background-color: var(--hover-bg); }
        a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-block;
        }
        a:hover { color: var(--accent-color); }
        a[href$="/"] { color: #4fc3f7; font-weight: 600; }
        a[href$="/"]::before { content: "📁 "; }
        a:not([href$="/"])::before { content: "📄 "; }
        a[href="../"]::before { content: "⬅️ "; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
