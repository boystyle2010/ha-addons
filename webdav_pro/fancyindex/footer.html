  minimapWrap.addEventListener('mousedown', function (e) {

    var jump = function (ev) {
      var r = minimapWrap.getBoundingClientRect();
      var ratio = Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height));
      var targetRow = Math.floor(ratio * aceEditor.session.getLength());
      aceEditor.scrollToLine(targetRow, true, true, function () {});
      renderMinimap();
    };
    jump(e);
    var move = function (ev) { jump(ev); };
    var upEv = function () { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', upEv); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', upEv);
  });

  function validateYamlContent() {
    if (!/^(yaml|yml)$/i.test(currentExt) || !window.jsyaml) { yamlAlert.classList.remove('show'); return true; }
    try {
      var src = getEditorContent().replace(/![a-zA-Z_]+\s+/g, '');
      jsyaml.loadAll(src);
      yamlAlert.className = 'yaml-alert show yaml-ok';
      yamlAlert.textContent = '✓ Valid Home Assistant YAML syntax';
      return true;
    } catch (err) {
      yamlAlert.className = 'yaml-alert show';
      yamlAlert.textContent = '⚠️ YAML Error (Line ' + (err.mark ? err.mark.line + 1 : '?') + '): ' + err.reason;
      return false;
    }
  }

  function initAce() {
    if (aceEditor || !window.ace) return;
    ace.config.set('basePath', 'https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/');
    aceEditor = ace.edit('aceContainer');
    aceEditor.setTheme('ace/theme/one_dark');
    aceEditor.setOptions({
      fontSize: editorFontSize + 'px',
      fontFamily: '"SF Mono", Menlo, Monaco, Consolas, monospace',
      showPrintMargin: false,
      tabSize: 2,
      useSoftTabs: true,
      wrap: false,
      scrollPastEnd: 0.3,
      enableMultiselect: true
    });
    aceEditor.session.on('change', function () { validateYamlContent(); renderMinimap(); });
    aceEditor.session.on('changeScrollTop', function () { renderMinimap(); });
    aceEditor.selection.on('changeCursor', function () {
      var ranges = aceEditor.selection.getAllRanges ? aceEditor.selection.getAllRanges() : [];
      var curPos = aceEditor.getCursorPosition();
      edStatus.textContent = (ranges.length > 1 ? ranges.length + ' cursors • ' : '') + 'Ln ' + (curPos.row + 1) + ', Col ' + (curPos.column + 1);
    });
    aceEditor.commands.addCommand({ name: 'saveFile', bindKey: { win: 'Ctrl-S', mac: 'Command-S' }, exec: function () { saveCurrentFile(); } });
  }

  function getEditorContent() { return aceEditor ? aceEditor.getValue() : edArea.value; }
  function setEditorContent(val, ext) {
    initAce();
    if (aceEditor) {
      aceContainer.style.display = 'block'; edArea.style.display = 'none';
      minimapWrap.classList.toggle('show', minimapEnabled);
      aceEditor.session.setMode('ace/mode/' + (ACE_MODES[ext] || 'yaml'));
      aceEditor.setValue(val, -1); aceEditor.resize();
      setTimeout(renderMinimap, 60);
    } else {
      aceContainer.style.display = 'none'; minimapWrap.classList.remove('show'); edArea.style.display = 'block'; edArea.value = val;
    }
    validateYamlContent();
  }

  function toggleMarkdownPreview(forceState) {
    mdPreviewActive = typeof forceState === 'boolean' ? forceState : !mdPreviewActive;
    edMdToggle.classList.toggle('active', mdPreviewActive);
    edMdToggle.textContent = mdPreviewActive ? '✏️ Edit Code' : '👁️ Preview';
    if (mdPreviewActive) {

      mdView.innerHTML = window.marked ? marked.parse(rawMd) : '<pre>' + esc(rawMd) + '</pre>';

  function openSmartViewer(item) {
    var label = item.name, href = item.href;
    var extMatch = /\.([a-z0-9]+)$/i.exec(label), ext = extMatch ? extMatch[1].toLowerCase() : '';
    if (IMG_EXT.test(ext)) { openMediaModal(label, href, 'img', ext); return; }
    if (VID_EXT.test(ext)) { openMediaModal(label, href, 'vid', ext); return; }
    if (AUD_EXT.test(ext)) { openMediaModal(label, href, 'aud', ext); return; }
    if (ext === 'pdf') { openPdfJsModal(label, href); return; }
    if (ARCH_EXT.test(ext)) { openArchiveInspector(label, href, ext); return; }
    if (BIN_HEX_EXT.test(ext)) { openHexViewer(label, href); return; }
    if (EDITABLE_EXT.test(ext) || EDITABLE_EXT.test(label) || !ext) openCodeEditor(label, href, ext || 'yaml');
    else openHexViewer(label, href);
  }

  // 6A. Trình xem PDF trực tiếp bằng PDF.js Canvas
  function openPdfJsModal(label, href) {
    edTitle.textContent = label; edLang.textContent = 'PDF.JS DIRECT VIEWER';
    editorModal.classList.add('show');
    aceContainer.style.display = 'none'; minimapWrap.classList.remove('show'); edArea.style.display = 'none'; mdView.style.display = 'none';
    edSubbar.style.display = 'none'; edSave.style.display = 'none'; edMdToggle.style.display = 'none'; yamlAlert.classList.remove('show');
    edPreview.style.display = 'flex';
    edPreview.innerHTML =
      '<div class="pdf-toolbar">' +
        '<button id="pdfPrev" class="ed-chip" type="button">◀ Prev</button>' +
        '<span id="pdfPageInfo">Loading PDF...</span>' +
        '<button id="pdfNext" class="ed-chip" type="button">Next ▶</button>' +
        '<button id="pdfZoomOut" class="ed-chip" type="button">−</button>' +
        '<button id="pdfZoomIn" class="ed-chip" type="button">＋</button>' +
      '</div>' +
      '<div style="overflow:auto;max-width:100%;max-height:78vh;display:grid;place-items:center"><canvas id="pdfCanvas"></canvas></div>';

    if (!window.pdfjsLib) {
      edPreview.innerHTML = '<iframe src="' + href + '" style="width:100%;height:82vh;border:0;border-radius:8px;background:#fff"></iframe>';
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var pdfDoc = null, pageNum = 1, scale = 1.35;
    var canvas = document.getElementById('pdfCanvas'), ctx = canvas.getContext('2d'), info = document.getElementById('pdfPageInfo');

    function renderPage(num) {
      pdfDoc.getPage(num).then(function (page) {
        var viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height; canvas.width = viewport.width;
        page.render({ canvasContext: ctx, viewport: viewport });
        info.textContent = 'Page ' + num + ' / ' + pdfDoc.numPages + ' (' + Math.round(scale * 100) + '%)';
      });
    }
    pdfjsLib.getDocument(href).promise.then(function (doc) {
      pdfDoc = doc; renderPage(pageNum);
    }).catch(function () {
      edPreview.innerHTML = '<iframe src="' + href + '" style="width:100%;height:82vh;border:0;border-radius:8px;background:#fff"></iframe>';
    });

    document.getElementById('pdfPrev').addEventListener('click', function () { if (pdfDoc && pageNum > 1) { pageNum--; renderPage(pageNum); } });
    document.getElementById('pdfNext').addEventListener('click', function () { if (pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; renderPage(pageNum); } });
    document.getElementById('pdfZoomIn').addEventListener('click', function () { if (pdfDoc) { scale = Math.min(3.0, scale + 0.25); renderPage(pageNum); } });
    document.getElementById('pdfZoomOut').addEventListener('click', function () { if (pdfDoc) { scale = Math.max(0.6, scale - 0.25); renderPage(pageNum); } });
  }

  // 6B. Trình xem Hex / Binary cho file hệ thống
  function openHexViewer(label, href) {
    edTitle.textContent = label; edLang.textContent = 'HEX / BINARY INSPECTOR';
    editorModal.classList.add('show');
    aceContainer.style.display = 'none'; minimapWrap.classList.remove('show'); edArea.style.display = 'none'; mdView.style.display = 'none';
    edSubbar.style.display = 'none'; edSave.style.display = 'none'; edMdToggle.style.display = 'none'; yamlAlert.classList.remove('show');
    edPreview.style.display = 'flex';
    edPreview.innerHTML = '<div style="color:#8b949e">Reading binary stream...</div>';

    fetch(href, { headers: { 'Range': 'bytes=0-16383' } }).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
      var bytes = new Uint8Array(buf), maxLen = Math.min(bytes.length, 8192), rowsHtml = [];
      for (var offset = 0; offset < maxLen; offset += 16) {
        var offHex = ('00000000' + offset.toString(16)).slice(-8).toUpperCase();
        var hexPart = [], asciiPart = '';
        for (var i = 0; i < 16; i++) {
          if (offset + i < maxLen) {
            var b = bytes[offset + i];
            hexPart.push(('0' + b.toString(16)).slice(-2).toUpperCase());
            asciiPart += (b >= 32 && b <= 126) ? esc(String.fromCharCode(b)) : '·';
          } else {
            hexPart.push('  ');
            asciiPart += ' ';
          }
          if (i === 7) hexPart.push('');
        }
        rowsHtml.push('<div class="hex-row"><span class="hex-off">' + offHex + '</span><span class="hex-bytes">' + hexPart.join(' ') + '</span><span class="hex-ascii">' + asciiPart + '</span></div>');
      }
      var headNote = '<div style="display:flex;justify-content:space-between;margin-bottom:10px;color:#8b949e;font-size:12px"><span>Showing first ' + fmtBytes(maxLen) + ' (Total fetched: ' + fmtBytes(bytes.length) + ')</span><button id="btnForceTextEdit" class="ed-chip" type="button">✏️ Force Open in Text Editor</button></div>';
      edPreview.innerHTML = '<div class="hex-wrap">' + headNote + (rowsHtml.join('') || '<div>Empty file (0 bytes)</div>') + '</div>';
      var forceBtn = document.getElementById('btnForceTextEdit');
      if (forceBtn) forceBtn.addEventListener('click', function () { openCodeEditor(label, href, 'txt'); });
    }).catch(function (e) {
      edPreview.innerHTML = '<div style="color:var(--red)">Failed to read binary file: ' + esc(e.message) + '</div>';
    });
  }

  // 6C. Trình xem Archive (.zip / .tar)
  function openArchiveInspector(label, href, ext) {
    edTitle.textContent = label; edLang.textContent = ext.toUpperCase() + ' ARCHIVE INSPECTOR';
    editorModal.classList.add('show');
    aceContainer.style.display = 'none'; minimapWrap.classList.remove('show'); edArea.style.display = 'none'; mdView.style.display = 'none';
    edSubbar.style.display = 'none'; edSave.style.display = 'none'; edMdToggle.style.display = 'none'; yamlAlert.classList.remove('show');
    edPreview.style.display = 'flex'; edPreview.innerHTML = '<div style="color:#8b949e">Reading archive contents...</div>';

    fetch(href).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
      if (ext === 'zip' && window.JSZip) {
        return JSZip.loadAsync(buf).then(function (zip) {
          var items = [];
          zip.forEach(function (relPath, file) { items.push('<div class="arch-item"><span>' + (file.dir ? '📁 ' : '📄 ') + esc(relPath) + '</span><span>' + (file.dir ? 'DIR' : '') + '</span></div>'); });
          edPreview.innerHTML = '<div class="arch-list">' + (items.join('') || '<div class="arch-item">Empty archive</div>') + '</div>';
        });
      } else {
        var view = new Uint8Array(buf), pos = 0, items = [];
        while (pos + 512 <= view.length && items.length < 300) {
          var name = '';
          for (var i = 0; i < 100 && view[pos + i] !== 0; i++) name += String.fromCharCode(view[pos + i]);
          if (!name) break;
          var sizeOct = '';
          for (var j = 124; j < 136 && view[pos + j] !== 0 && view[pos + j] !== 32; j++) sizeOct += String.fromCharCode(view[pos + j]);
          var size = parseInt(sizeOct, 8) || 0;
          items.push('<div class="arch-item"><span>' + (/\/$/.test(name) ? '📁 ' : '📦 ') + esc(name) + '</span><span>' + (size ? (size / 1024).toFixed(1) + ' KB' : '') + '</span></div>');
          pos += 512 + Math.ceil(size / 512) * 512;
        }
        edPreview.innerHTML = '<div class="arch-list">' + (items.join('') || '<div class="arch-item">Compressed TAR archive — Download to extract</div>') + '</div>';
      }
    }).catch(function (e) { edPreview.innerHTML = '<div style="color:var(--red)">Could not inspect archive: ' + esc(e.message) + '</div>'; });
  }

  // 6D. Trình phát Media nâng cao (Tốc độ 0.5x -> 2.0x, Tua ±10s, Background Audio)

    var ctrlBar =
      '<div class="media-ctrl-bar">' +

    document.getElementById('medFwd10').addEventListener('click', function () { mediaEl.currentTime = Math.min(mediaEl.duration || 99999, mediaEl.currentTime + 10); });
    [].slice.call(edPreview.querySelectorAll('.spd-btn')).forEach(function (b) {

  function openCodeEditor(label, href, ext) {
    currentEditHref = href; currentExt = ext; edTitle.textContent = label;
    isMarkdownFile = /^(md|markdown)$/i.test(ext);
    edLang.textContent = (ext || 'TEXT').toUpperCase() + (isMarkdownFile ? ' • MARKDOWN' : '');
    editorModal.classList.add('show');
    edPreview.style.display = 'none'; edPreview.innerHTML = ''; mdView.style.display = 'none';
    edSubbar.style.display = 'flex'; edSave.style.display = 'inline-flex';
    edMdToggle.style.display = isMarkdownFile ? 'inline-flex' : 'none';
    mdPreviewActive = false; edMdToggle.classList.remove('active'); edMdToggle.textContent = '👁️ Preview';
    edStatus.textContent = 'Loading...';

    fetch(href, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(function (txt) {
      setEditorContent(txt, ext);
      edStatus.textContent = 'UTF-8 • ' + txt.split('\n').length + ' lines';
      if (isMarkdownFile) toggleMarkdownPreview(true);
    }).catch(function () { setEditorContent('', ext); edStatus.textContent = 'New File'; });
  }

  function saveCurrentFile() {
    if (!currentEditHref) return;
    if (!validateYamlContent() && !confirm('YAML syntax error detected! Save anyway?')) return;
    edSave.disabled = true; edStatus.textContent = 'Saving...';
    fetch(currentEditHref, { method: 'PUT', headers: { 'Content-Type': 'text/plain; charset=utf-8' }, body: getEditorContent() }).then(function (r) {
      edSave.disabled = false;
      if (r.ok || r.status === 201 || r.status === 204) {
        edStatus.textContent = 'Saved ' + new Date().toLocaleTimeString();
        showToast('✅ Saved ' + edTitle.textContent);
        if (isMarkdownFile && mdPreviewActive) toggleMarkdownPreview(true);
      } else throw new Error('HTTP ' + r.status);
    }).catch(function (err) { edSave.disabled = false; alert('Save error: ' + err.message); });
  }

  document.getElementById('btnSysTerm').addEventListener('click', function () {

        '<span style="font-size:12.5px;color:#8b949e">Working directory: <code>' + esc(p) + '</code></span>' +
        '<div style="display:flex;gap:6px">' +
          '<button id="btnQuickDf" class="ed-chip" type="button">df -h</button>' +

    function mountWebSocketIframe() {
      termHost.innerHTML = '<iframe src="' + ttydUrl + '" style="width:100%;height:100%;border:0;background:#000"></iframe>';
    }
    function mountXtermConsole(initialCmd) {
      termHost.innerHTML = '<div id="xtermBox" style="width:100%;height:365px;padding:6px"></div>' +
        '<form id="termCmdForm" style="display:flex;border-top:1px solid #30363d;background:#0d1117">' +
          '<span style="padding:8px 10px;color:#30d158;font-family:monospace;font-weight:700">$</span>' +

          '<button type="submit" class="ed-btn save" style="border-radius:0;height:36px">Run</button>' +
        '</form>';
      var term = window.Terminal ? new Terminal({ cursorBlink: true, fontSize: 13, theme: { background: '#000000' } }) : null;
      var box = document.getElementById('xtermBox');
      if (term) { term.open(box); term.writeln('\x1b[1;36mWebDAV Pro Interactive Shell\x1b[0m — CWD: ' + p); }

      function runCmd(cmd) {
        if (!cmd) return;
        if (term) term.writeln('\r\n\x1b[1;32m$ ' + cmd + '\x1b[0m');
        else box.textContent += '\n$ ' + cmd + '\n';
        fetch(apiUrl('exec'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd: cmd, cwd: p }) })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            var out = (res.output || '').replace(/\r?\n/g, '\r\n');
            if (term) term.write(out);
            else { box.textContent += res.output || ''; box.scrollTop = box.scrollHeight; }
          });
      }
      document.getElementById('termCmdForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var inp = document.getElementById('termCmdInput');
        var c = inp.value.trim(); inp.value = '';
        runCmd(c);
      });
      if (initialCmd) runCmd(initialCmd);
    }

    mountWebSocketIframe();
    document.getElementById('btnSwitchTermMode').addEventListener('click', function () {
      useIframe = !useIframe;
      if (useIframe) mountWebSocketIframe(); else mountXtermConsole();
    });
    document.getElementById('btnQuickDf').addEventListener('click', function () { useIframe = false; mountXtermConsole('df -h'); });

  document.getElementById('btnSysDisk').addEventListener('click', function () {

    fetch(apiUrl('disk')).then(function (r) { return r.json(); }).then(function (d) {
      if (d.error) throw new Error(d.error);
      var palette = ['#0a84ff', '#30d158', '#ff9f0a', '#bf5af2', '#ff453a', '#5ac8fa', '#ffd60a', '#64d2ff'];
      var folders = (d.folders || []).sort(function (a, b) { return b.bytes - a.bytes; });
      var R = 74, C = 2 * Math.PI * R, offset = 0;
      var circles = '', legend = '';
      var denom = Math.max(d.total || 1, 1);

      folders.forEach(function (f, idx) {
        var col = palette[idx % palette.length];
        var frac = Math.max(0, Math.min(1, f.bytes / denom));
        var dash = frac * C;
        circles += '<circle r="' + R + '" cx="95" cy="95" fill="transparent" stroke="' + col + '" stroke-width="24" stroke-dasharray="' + dash.toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 95 95)"/>';
        offset += dash;
        legend += '<div class="legend-item"><div class="legend-left"><span class="legend-dot" style="background:' + col + '"></span><b>/' + esc(f.name) + '</b></div><span>' + fmtBytes(f.bytes) + '</span></div>';
      });

      var usedPct = Math.round((d.used / denom) * 100);
      suiteBody.innerHTML =
        '<div style="display:flex;justify-content:space-between;background:#0d1117;padding:12px 16px;border-radius:10px;border:1px solid #21262d;margin-bottom:16px;flex-wrap:wrap;gap:10px">' +
          '<div><span style="color:#8b949e;font-size:12px">TOTAL NVME</span><div style="font-size:16px;font-weight:700">' + fmtBytes(d.total) + '</div></div>' +
          '<div><span style="color:#8b949e;font-size:12px">USED (' + usedPct + '%)</span><div style="font-size:16px;font-weight:700;color:var(--orange)">' + fmtBytes(d.used) + '</div></div>' +
          '<div><span style="color:#8b949e;font-size:12px">FREE AVAILABLE</span><div style="font-size:16px;font-weight:700;color:var(--green)">' + fmtBytes(d.free) + '</div></div>' +
        '</div>' +
        '<div class="disk-grid">' +
          '<div class="donut-box">' +
            '<svg width="190" height="190" viewBox="0 0 190 190">' +
              '<circle r="' + R + '" cx="95" cy="95" fill="transparent" stroke="#21262d" stroke-width="24"/>' +
              circles +
            '</svg>' +
            '<div class="donut-center"><b>' + usedPct + '%</b><span>Used</span></div>' +
          '</div>' +
          '<div class="legend-list">' + legend + '</div>' +
        '</div>';
    }).catch(function (e) {
      suiteBody.innerHTML = '<div style="color:var(--red)">Error loading disk analytics: ' + esc(e.message) + '</div>';
    });
  });

  // 7C. Quick Snapshot / Backup to Zip
  document.getElementById('btnSysSnap').addEventListener('click', function () {
    openSuiteModal('⚡ Quick Snapshot / Backup to Zip',
      '<p style="margin-top:0;color:#8b949e">Create an instant 1-tap <code>.zip</code> snapshot directly inside your <code>/backup</code> folder before editing YAML or code.</p>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0">' +
        '<button id="btnSnapConfig" class="act-btn primary" style="height:54px;font-size:14.5px" type="button">📦 Backup Entire /config</button>' +
        '<button id="btnSnapAuto" class="act-btn" style="height:54px;font-size:14.5px" type="button">⚙️ Backup Automations &amp; Scripts</button>' +
      '</div>' +
      '<div id="snapStatus" style="padding:12px;border-radius:10px;background:#0d1117;border:1px solid #21262d;font-family:monospace;font-size:13px;color:#8b949e">Ready to create snapshot.</div>'
    );
    function triggerSnap(target) {
      var st = document.getElementById('snapStatus');
      st.style.color = '#58a6ff';
      st.textContent = '⏳ Compressing files into /backup ... Please wait...';
      fetch(apiUrl('snapshot'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target: target }) })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.error || 'Snapshot failed');
          st.style.color = '#30d158';
          st.innerHTML = '✅ Snapshot created: <b>' + esc(res.path) + '</b> (' + res.size_kb + ' KB)';
          showToast('⚡ Saved to ' + res.path);
        }).catch(function (e) {
          st.style.color = 'var(--red)';
          st.textContent = '❌ Error: ' + e.message;
        });
    }
    document.getElementById('btnSnapConfig').addEventListener('click', function () { triggerSnap('config'); });
    document.getElementById('btnSnapAuto').addEventListener('click', function () { triggerSnap('automations'); });
  });

  // 7D. Audit Log & Active Share Links Manager
  function openAuditAndSharesModal() {
    openSuiteModal('🛡️ Security Audit Log &amp; Expiry Share Links', '<div style="text-align:center;padding:24px;color:#8b949e">Loading security records...</div>');
    Promise.all([
      fetch(apiUrl('shares')).then(function (r) { return r.json(); }),
      fetch(apiUrl('audit?limit=120')).then(function (r) { return r.json(); })
    ]).then(function (results) {
      var shares = (results[0] && results[0].shares) || [];
      var logs = (results[1] && results[1].logs) || [];

      var sharesHtml = shares.length ? shares.map(function (s) {
        var minsLeft = Math.max(0, Math.round((s.exp - Date.now() / 1000) / 60));
        var publicUrl = location.origin + '/s/' + s.token;
        return '<div class="legend-item" style="gap:10px;flex-wrap:wrap">' +
          '<div><b>📄 ' + esc(s.name) + '</b> <span style="color:#8b949e;font-size:12px">(' + esc(s.path) + ' • expires in ' + minsLeft + 'm)</span></div>' +
          '<div style="display:flex;gap:6px">' +
            '<button class="ed-chip copy-share-btn" data-url="' + esc(publicUrl) + '" type="button">🔗 Copy URL</button>' +
            '<button class="ed-chip revoke-share-btn" style="color:var(--red)" data-tok="' + esc(s.token) + '" type="button">Revoke</button>' +
          '</div>' +
        '</div>';
      }).join('') : '<div style="color:#8b949e;font-size:13px;padding:8px 0">No active temporary share links. Tap <b>⋯ → Create Expiry Share Link</b> on any file to create one.</div>';

      var logsHtml = logs.map(function (l) {
        var m = esc(l.method || 'INFO');
        return '<tr>' +
          '<td>' + esc((l.time || '').replace('T', ' ').slice(0, 19)) + '</td>' +
          '<td><b>' + esc(l.user || 'ingress') + '</b></td>' +
          '<td><span class="badge-m badge-' + m + '">' + m + '</span></td>' +
          '<td>' + esc(l.path || '') + '</td>' +
          '<td>' + esc(l.ip || '') + '</td>' +
        '</tr>';
      }).join('');

      suiteBody.innerHTML =
        '<div style="margin-bottom:18px">' +
          '<h4 style="margin:0 0 8px;color:#58a6ff">⏳ Active Expiry Share Links</h4>' +
          '<div class="legend-list">' + sharesHtml + '</div>' +
        '</div>' +
        '<div>' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
            '<h4 style="margin:0;color:#58a6ff">📋 Access &amp; Modification Audit Log</h4>' +
            '<button id="btnClearAudit" class="ed-chip" style="color:var(--red)" type="button">🗑️ Clear Log</button>' +
          '</div>' +
          '<div style="max-height:320px;overflow:auto;border:1px solid #21262d;border-radius:10px">' +
            '<table class="audit-table"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>File / Path</th><th>IP</th></tr></thead>' +
            '<tbody>' + (logsHtml || '<tr><td colspan="5" style="text-align:center;color:#8b949e">No audit events recorded yet</td></tr>') + '</tbody></table>' +
          '</div>' +
        '</div>';

      [].slice.call(suiteBody.querySelectorAll('.copy-share-btn')).forEach(function (b) {
        b.addEventListener('click', function () {
          var u = this.getAttribute('data-url');
          if (navigator.clipboard) navigator.clipboard.writeText(u);
          showToast('🔗 Copied Share Link!');
        });
      });
      [].slice.call(suiteBody.querySelectorAll('.revoke-share-btn')).forEach(function (b) {
        b.addEventListener('click', function () {
          var tok = this.getAttribute('data-tok');
          fetch(apiUrl('share'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'revoke', token: tok }) })
            .then(function () { openAuditAndSharesModal(); showToast('Revoked share link'); });
        });
      });
      var clrBtn = document.getElementById('btnClearAudit');
      if (clrBtn) clrBtn.addEventListener('click', function () {
        if (!confirm('Clear all audit log entries?')) return;
        fetch(apiUrl('audit_clear'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
          .then(function () { openAuditAndSharesModal(); });
      });
    });
  }
  document.getElementById('btnSysAudit').addEventListener('click', openAuditAndSharesModal);

  // 8. Tạo File, Tạo Folder, Upload, Kéo-Thả (Drag & Drop) & Dán Clipboard (Cmd+V)
  document.getElementById('btnNewFile').addEventListener('click', function () {
    var name = prompt('Enter new file name (e.g. script.yaml, README.md):');
    if (!name || !name.trim()) return;
    var clean = name.trim().replace(/^\/+/, ''), extMatch = /\.([a-z0-9]+)$/i.exec(clean), ext = extMatch ? extMatch[1].toLowerCase() : 'yaml';
    fetch(buildWebdavUrl(encodeURIComponent(clean)), { method: 'PUT', body: '' }).then(function (r) {
      if (r.ok || r.status === 201 || r.status === 204) openCodeEditor(clean, encodeURIComponent(clean), ext);
      else alert('Could not create file (HTTP ' + r.status + ')');
    });
  });

  document.getElementById('btnNewDir').addEventListener('click', function () {
    var name = prompt('Enter new folder name:');
    if (!name || !name.trim()) return;
    var clean = name.trim().replace(/^\/+|\/+$/g, '');
    fetch(buildWebdavUrl(encodeURIComponent(clean) + '/'), { method: 'MKCOL' }).then(function (r) {
      if (r.ok || r.status === 201) { showToast('📁 Folder created'); setTimeout(function () { location.reload(); }, 400); }
      else alert('Could not create folder (HTTP ' + r.status + ')');
    });
  });

  var fileInput = document.getElementById('fileInput'), uploadProg = document.getElementById('uploadProg'), uploadText = document.getElementById('uploadText'), progBar = document.getElementById('progBar');
  function uploadFileList(files) {
    if (!files || !files.length) return;
    uploadProg.classList.add('show'); var idx = 0;
    function next() {
      if (idx >= files.length) { showToast('✅ Uploaded ' + files.length + ' file(s)!'); setTimeout(function () { location.reload(); }, 400); return; }
      var f = files[idx++], xhr = new XMLHttpRequest();
      xhr.open('PUT', buildWebdavUrl(encodeURIComponent(f.name)), true);
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) { var pct = Math.round((e.loaded / e.total) * 100); uploadText.textContent = 'Uploading ' + f.name + ' (' + pct + '%)'; progBar.style.width = pct + '%'; }
      };
      xhr.onload = next; xhr.onerror = function () { alert('Failed uploading ' + f.name); next(); };
      xhr.send(f);
    }
    next();
  }
  document.getElementById('btnUpload').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { uploadFileList([].slice.call(this.files)); });

  window.addEventListener('dragover', function (e) { e.preventDefault(); document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', function (e) { if (e.relatedTarget === null) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); document.body.classList.remove('dragging');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) uploadFileList([].slice.call(e.dataTransfer.files));
  });
  window.addEventListener('paste', function (e) {
    if (editorModal.classList.contains('show') || suiteModal.classList.contains('show') || document.activeElement === document.getElementById('q')) return;
    var items = e.clipboardData && e.clipboardData.files;
    if (items && items.length) uploadFileList([].slice.call(items));
  });

  // 9. iOS Action Sheet, Hex Trigger, Expiry Share Link & Clipboard
  var backdrop = document.getElementById('backdrop'), sheet = document.getElementById('sheet'), selectedItem = null;
  function openActionSheet(item) {
    selectedItem = item;
    document.getElementById('sheetTitle').textContent = item.name + (item.isDir ? '/' : '');
    document.getElementById('actEdit').style.display = item.isDir ? 'none' : 'flex';
    document.getElementById('actHex').style.display = item.isDir ? 'none' : 'flex';
    document.getElementById('actShareLink').style.display = item.isDir ? 'none' : 'flex';
    document.getElementById('actDownload').style.display = item.isDir ? 'none' : 'flex';
    backdrop.classList.add('show'); sheet.classList.add('show');
  }
  function closeActionSheet() { backdrop.classList.remove('show'); sheet.classList.remove('show'); }
  backdrop.addEventListener('click', closeActionSheet);
  document.getElementById('actCancelSheet').addEventListener('click', closeActionSheet);

  document.getElementById('actEdit').addEventListener('click', function () {
    if (!selectedItem) return; closeActionSheet();
    var extMatch = /\.([a-z0-9]+)$/i.exec(selectedItem.name);
    openCodeEditor(selectedItem.name, selectedItem.href, extMatch ? extMatch[1].toLowerCase() : 'yaml');
  });
  document.getElementById('actHex').addEventListener('click', function () {
    if (!selectedItem) return; closeActionSheet();
    openHexViewer(selectedItem.name, selectedItem.href);
  });
  document.getElementById('actShareLink').addEventListener('click', function () {
    if (!selectedItem) return; var item = selectedItem; closeActionSheet();
    openSuiteModal('⏳ Create Temporary Share Link',
      '<p style="margin-top:0;color:#8b949e">Generate a direct download URL for <b>' + esc(item.name) + '</b> that automatically expires without exposing your WebDAV password.</p>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0">' +
        '<button class="act-btn ttl-btn" data-ttl="3600" type="button">1 Hour</button>' +
        '<button class="act-btn ttl-btn" data-ttl="21600" type="button">6 Hours</button>' +
        '<button class="act-btn primary ttl-btn" data-ttl="86400" type="button">24 Hours</button>' +
        '<button class="act-btn ttl-btn" data-ttl="604800" type="button">7 Days</button>' +
      '</div>' +
      '<div id="shareResultBox" style="padding:12px;border-radius:10px;background:#0d1117;border:1px solid #21262d;font-family:monospace;font-size:13px;color:#8b949e">Select an expiration duration above.</div>'
    );
    [].slice.call(suiteBody.querySelectorAll('.ttl-btn')).forEach(function (b) {
      b.addEventListener('click', function () {
        var ttl = parseInt(this.getAttribute('data-ttl'), 10);
        var box = document.getElementById('shareResultBox');
        box.textContent = 'Generating secure token...';
        fetch(apiUrl('share'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'create', path: decodeURIComponent(item.internalPath), ttl: ttl }) })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (!res.ok) throw new Error(res.error || 'Failed');
            var externalShareUrl = location.protocol + '//' + location.hostname + ':8090/s/' + res.token;
            var currentOriginUrl = location.origin + ingressPrefix + '/s/' + res.token;
            box.innerHTML =
              '<div style="color:#30d158;margin-bottom:8px">✅ Share link created!</div>' +
              '<div style="margin-bottom:8px"><b>Direct Port 8090 / Cloudflare URL:</b><br><input type="text" readonly value="' + esc(externalShareUrl) + '" style="width:100%;margin-top:4px;padding:7px;background:#161b22;border:1px solid #30363d;color:#fff;border-radius:6px;font-family:monospace"></div>' +
              '<div style="display:flex;gap:8px">' +
                '<button id="btnCopyExtShare" class="ed-btn save" type="button">🔗 Copy Public Link</button>' +
                '<button id="btnCopyIngShare" class="ed-btn close" type="button">Copy Ingress Link</button>' +
              '</div>';
            document.getElementById('btnCopyExtShare').addEventListener('click', function () {
              if (navigator.clipboard) navigator.clipboard.writeText(externalShareUrl);
              showToast('🔗 Copied Public Share URL!');
            });
            document.getElementById('btnCopyIngShare').addEventListener('click', function () {
              if (navigator.clipboard) navigator.clipboard.writeText(currentOriginUrl);
              showToast('🔗 Copied Ingress Share URL!');
            });
          }).catch(function (err) { box.style.color = 'var(--red)'; box.textContent = 'Error: ' + err.message; });
      });
    });
  });

  document.getElementById('actCopyPath').addEventListener('click', function () {
    if (!selectedItem) return; closeActionSheet();
    var cleanPath = decodeURIComponent(selectedItem.internalPath);
    if (navigator.clipboard) navigator.clipboard.writeText(cleanPath);
    showToast('🔗 Copied: ' + cleanPath);
  });
  document.getElementById('actDownload').addEventListener('click', function () {
    if (!selectedItem) return; closeActionSheet();
    var link = document.createElement('a'); link.href = selectedItem.href; link.download = selectedItem.name;
    document.body.appendChild(link); link.click(); link.remove();
  });
  document.getElementById('actDup').addEventListener('click', function () {
    if (!selectedItem) return; var item = selectedItem; closeActionSheet();
    var dupName = prompt('Duplicate "' + item.name + '" as:', 'copy_' + item.name);
    if (!dupName || !dupName.trim()) return;
    var destInternal = p + encodeURIComponent(dupName.trim()) + (item.isDir ? '/' : '');
    fetch(buildWebdavUrl(item.href), { method: 'COPY', headers: { 'Destination': buildDestinationHeader(destInternal), 'Overwrite': 'T' } }).then(function (r) {
      if (r.ok || r.status === 201 || r.status === 204) { showToast('📑 Duplicated'); setTimeout(function () { location.reload(); }, 400); }
    });
  });
  document.getElementById('actRename').addEventListener('click', function () {
    if (!selectedItem) return; var item = selectedItem; closeActionSheet();
    var newName = prompt('Rename "' + item.name + '" to:', item.name);
    if (!newName || !newName.trim() || newName.trim() === item.name) return;
    var destInternal = p + encodeURIComponent(newName.trim()) + (item.isDir ? '/' : '');
    fetch(buildWebdavUrl(item.href), { method: 'MOVE', headers: { 'Destination': buildDestinationHeader(destInternal), 'Overwrite': 'T' } }).then(function (r) {
      if (r.ok || r.status === 201 || r.status === 204) { showToast('🏷️ Renamed'); setTimeout(function () { location.reload(); }, 400); }
    });
  });
  document.getElementById('actDelete').addEventListener('click', function () {
    if (!selectedItem) return; var item = selectedItem; closeActionSheet();
    if (!confirm('Delete "' + item.name + '" permanently?')) return;
    fetch(buildWebdavUrl(item.href), { method: 'DELETE' }).then(function (r) {
      if (r.ok || r.status === 200 || r.status === 204) { showToast('🗑️ Deleted'); setTimeout(function () { location.reload(); }, 400); }
    });
  });

  var clipBar = document.getElementById('clipBar'), clipModeEl = document.getElementById('clipMode'), clipNameEl = document.getElementById('clipName');
  function refreshClipBar() {
    try {
      var raw = sessionStorage.getItem('wpro_clip');
      if (!raw) { clipBar.classList.remove('show'); return; }
      var clip = JSON.parse(raw);
      clipModeEl.textContent = clip.mode === 'MOVE' ? '✂️ READY TO MOVE' : '📋 COPIED TO CLIPBOARD';
      clipNameEl.textContent = clip.items.length === 1 ? clip.items[0].name : clip.items.length + ' items';
      clipBar.classList.add('show');
    } catch (e) { clipBar.classList.remove('show'); }
  }
  refreshClipBar();
  function setClip(mode, items) { sessionStorage.setItem('wpro_clip', JSON.stringify({ mode: mode, items: items })); refreshClipBar(); }

  document.getElementById('actCopy').addEventListener('click', function () { if (selectedItem) { setClip('COPY', [selectedItem]); closeActionSheet(); showToast('📋 Copied'); } });
  document.getElementById('actCut').addEventListener('click', function () { if (selectedItem) { setClip('MOVE', [selectedItem]); closeActionSheet(); showToast('✂️ Cut'); } });
  document.getElementById('btnBatchCopy').addEventListener('click', function () { if (selectedSet.length) { setClip('COPY', selectedSet.slice()); btnSelectMode.click(); } });
  document.getElementById('btnBatchMove').addEventListener('click', function () { if (selectedSet.length) { setClip('MOVE', selectedSet.slice()); btnSelectMode.click(); } });
  document.getElementById('btnBatchDel').addEventListener('click', function () {
    if (!selectedSet.length || !confirm('Delete ' + selectedSet.length + ' item(s)?')) return;
    Promise.all(selectedSet.map(function (it) { return fetch(ingressPrefix + it.internalPath, { method: 'DELETE' }); })).then(function () { location.reload(); });
  });
  document.getElementById('btnCancelClip').addEventListener('click', function () { sessionStorage.removeItem('wpro_clip'); refreshClipBar(); });
  document.getElementById('btnPaste').addEventListener('click', function () {
    var raw = sessionStorage.getItem('wpro_clip'); if (!raw) return; var clip = JSON.parse(raw);
    Promise.all(clip.items.map(function (it) {
      var destInternal = p + encodeURIComponent(it.name) + (it.isDir ? '/' : '');
      if (destInternal === it.internalPath) destInternal = p + encodeURIComponent('copy_' + it.name) + (it.isDir ? '/' : '');
      return fetch(ingressPrefix + it.internalPath, { method: clip.mode, headers: { 'Destination': buildDestinationHeader(destInternal), 'Overwrite': 'T' } });
    })).then(function () { if (clip.mode === 'MOVE') sessionStorage.removeItem('wpro_clip'); location.reload(); });
  });

  // 10. Search, Sort & Grid/List View
  var qInput = document.getElementById('q'), clearBtn = document.getElementById('clearBtn'), emptyEl = document.getElementById('empty');
  function filterRows() {
    var v = qInput.value.trim().toLowerCase(); clearBtn.classList.toggle('show', v.length > 0); var c = 0;
    rows.forEach(function (tr) { var n = tr.getAttribute('data-n'); if (n === null) return; var m = !v || n.indexOf(v) !== -1; tr.style.display = m ? '' : 'none'; if (m) c++; });
    emptyEl.classList.toggle('show', c === 0 && (nd + nf) > 0);
  }
  qInput.addEventListener('input', filterRows);
  clearBtn.addEventListener('click', function () { qInput.value = ''; filterRows(); qInput.focus(); });

  var s = document.getElementById('sort'), cur = location.search.replace(/^\?/, '');
  if (cur) for (var i = 0; i < s.options.length; i++) if (s.options[i].value === cur) s.selectedIndex = i;
  s.addEventListener('change', function () { location.search = '?' + this.value; });

  var viewBtn = document.getElementById('viewBtn'), viewIcon = document.getElementById('viewIcon');
  var gridSvg = '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>';
  var listSvg = '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>';
  function applyView(mode) { var g = mode === 'grid'; document.body.classList.toggle('grid-mode', g); viewIcon.innerHTML = g ? listSvg : gridSvg; }
  var savedView = localStorage.getItem('wpro_view') || 'list'; applyView(savedView);
  viewBtn.addEventListener('click', function () { savedView = document.body.classList.contains('grid-mode') ? 'list' : 'grid'; localStorage.setItem('wpro_view', savedView); applyView(savedView); });
})();
</script>
</body>
