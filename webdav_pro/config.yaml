name: "WebDAV Server Pro"
version: "2.0.15"
slug: "webdav_pro"
description: "High-performance, security-hardened WebDAV server with FancyIndex Dark UI, Ingress, and multi-user permissions for Home Assistant."
url: "https://github.com/boystyle2010/ha-addons"
arch:
  - aarch64
  - amd64
init: false
apparmor: true
auth_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:folder-network"
panel_title: "WebDAV Pro"
watchdog: "tcp://[HOST]:[PORT:8080]"
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: "WebDAV Server Port (iOS/macOS/Windows/Cloudflare Tunnel)"
map:
  - homeassistant_config:rw
  - all_addon_configs:rw
  - addons:rw
  - backup:rw
  - media:rw
  - share:rw
  - ssl:rw
  - data:rw
options:
  unified_root: true
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
  max_upload_size: "0"
  fancy_ui: true
  show_dotfiles: true
  log_level: "info"
  users:
    - username: "admin"
      password: "changeme_strong_password"
  shares:
    - name: "config"
      path: "/homeassistant"
      read_only: false
      allowed_users: []
    - name: "addon_configs"
      path: "/addon_configs"
      read_only: false
      allowed_users: []
    - name: "addons"
      path: "/addons"
      read_only: false
      allowed_users: []
    - name: "backup"
      path: "/backup"
      read_only: false
      allowed_users: []
    - name: "media"
      path: "/media"
      read_only: false
      allowed_users: []
    - name: "share"
      path: "/share"
      read_only: false
      allowed_users: []
    - name: "ssl"
      path: "/ssl"
      read_only: false
      allowed_users: []
schema:
  unified_root: bool
  ssl: bool
  certfile: str
  keyfile: str
  max_upload_size: str
  fancy_ui: bool
  show_dotfiles: bool
  log_level: list(debug|info|notice|warn|error)
  users:
    - username: str
      password: password
  shares:
    - name: match(^[a-zA-Z0-9_-]+$)
      path: str
      read_only: bool
      allowed_users:
        - str?
