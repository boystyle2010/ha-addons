name: "Cloudflared Pro"
description: "Use a Cloudflare Tunnel to remotely connect to Home Assistant without opening any ports"
version: "2026.10.5"
slug: "cloudflared_pro"
url: "https://github.com/boystyle2010/ha-addons"
init: false
arch:
  - aarch64
apparmor: true
startup: services
boot: auto
map:
  - ssl:ro
  - share:rw
options:
  tunnel_token: ""
  protocol: "auto"
  ha_Edge_IP_Version: "Auto"
  post_quantum: false
  log_level: "info"
  retries: 5
  grace_period: "30s"
  metrics_port: 0
  external_hostname: ""
  additional_hosts: []
  catch_all_service: "http://homeassistant:8123"
  custom_flags: []
schema:
  tunnel_token: "password?"
  protocol: "list(auto|quic|http2)"
  ha_Edge_IP_Version: "list(Auto|IPv4|IPv6)"
  post_quantum: "bool"
  log_level: "list(debug|info|warn|error|fatal)"
  retries: "int(1,20)"
  grace_period: "str"
  metrics_port: "int(0,65535)?"
  external_hostname: "str?"
  additional_hosts:
    - hostname: "str"
      service: "str"
      no_tls_verify: "bool?"
      http_host_header: "str?"
  catch_all_service: "str?"
  custom_flags:
    - "str"
