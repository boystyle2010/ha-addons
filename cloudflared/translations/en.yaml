configuration:
  tunnel_token:
    name: "Cloudflare Tunnel Token (Zero Trust Dashboard)"
    description: "Paste your tunnel token from the Cloudflare Zero Trust Dashboard. When provided, remote routing rules on Cloudflare take precedence."
  protocol:
    name: "Connection Protocol"
    description: "Protocol used to connect to Cloudflare Edge servers (Recommended: auto or http2 for stability)."
  ha_Edge_IP_Version:
    name: "Edge IP Version"
    description: "Specify the IP address family (Auto, IPv4, or IPv6) for connecting to Cloudflare Edge."
  post_quantum:
    name: "Post-Quantum Cryptography"
    description: "Enable post-quantum hybrid key exchange for the tunnel connection."
  log_level:
    name: "Log Level"
    description: "Verbosity level of the cloudflared logs."
  retries:
    name: "Maximum Retries"
    description: "Maximum number of retries for establishing the connection before backing off (Default: 5)."
  grace_period:
    name: "Shutdown Grace Period"
    description: "Time to wait for active requests to finish before shutting down the tunnel (e.g., 30s)."
  metrics_port:
    name: "Prometheus Metrics Port"
    description: "Internal port to expose Prometheus metrics (Set to 0 or leave blank to disable)."
  external_hostname:
    name: "[Local Mode] Primary External Hostname"
    description: "Only used if Tunnel Token is empty and you manage credentials.json locally in /share/cloudflared/."
  additional_hosts:
    name: "[Local Mode] Additional Public Hostnames"
    description: "Define extra internal services (e.g., Scrypted, Portainer, Z-Wave) when running in Local Mode."
  catch_all_service:
    name: "[Local Mode] Catch-All Service"
    description: "Default fallback service when no hostname matches (e.g., http://homeassistant:8123 or http_status:404)."
  custom_flags:
    name: "Custom CLI Flags"
    description: "Additional command-line flags passed directly to cloudflared."
