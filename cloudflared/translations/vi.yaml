configuration:
  tunnel_token:
    name: Tunnel Token (tuỳ chọn)
    description: "Token của tunnel tạo trong bảng điều khiển Cloudflare Zero Trust. Khi điền, các tuyến đường được quản lý ở Cloudflare và các tuỳ chọn cục bộ bên dưới (tên miền, catch-all, Nginx Proxy Manager) sẽ bị bỏ qua."
  protocol:
    name: Giao thức kết nối
    description: "Giao thức dùng để kết nối tới Cloudflare. auto để cloudflared tự chọn, quic nhanh nhất, http2 hữu ích khi mạng chặn UDP."
  edge_ip_version:
    name: Phiên bản IP kết nối
    description: "Phiên bản IP dùng để kết nối tới mạng Cloudflare. Chọn IPv4 nếu IPv6 trên mạng của bạn không ổn định."
  post_quantum:
    name: Mã hoá hậu lượng tử
    description: "Bật mã hoá hậu lượng tử cho kết nối tunnel."
  log_level:
    name: Mức độ ghi nhật ký
    description: "Độ chi tiết của log cloudflared. Chỉ dùng debug khi cần tìm lỗi."
  retries:
    name: Số lần thử kết nối lại
    description: "Số lần thử lại tối đa khi kết nối tới Cloudflare thất bại (1 đến 20)."
  grace_period:
    name: Thời gian chờ khi tắt
    description: "Thời gian cloudflared chờ các yêu cầu đang chạy hoàn tất khi dừng, ví dụ 30s."
  metrics_port:
    name: Cổng metrics
    description: "0 giữ metrics ở bên trong. Đặt một cổng như 2000 để phục vụ metrics cho Prometheus; muốn truy cập từ ngoài Home Assistant, hãy chọn thêm cổng máy chủ trong mục Network."
  tunnel_name:
    name: Tên tunnel (chế độ cục bộ)
    description: "Tên tunnel được tạo ở lần khởi động đầu tiên trong chế độ cục bộ. Phải là duy nhất trong tài khoản Cloudflare của bạn."
  external_hostname:
    name: Tên miền Home Assistant (chế độ cục bộ)
    description: "Tên miền công khai dẫn tới Home Assistant, ví dụ ha.example.com. Để trống nếu chỉ muốn chia sẻ các host bổ sung."
  additional_hosts:
    name: Host bổ sung (chế độ cục bộ)
    description: "Các dịch vụ khác chia sẻ qua cùng một tunnel, mỗi tên miền một mục."
    fields:
      hostname:
        name: Tên miền
        description: "Tên miền công khai, ví dụ nas.example.com."
      service:
        name: Địa chỉ dịch vụ
        description: "Nơi lưu lượng được chuyển tới, ví dụ http://192.168.1.20:5000 hoặc https://192.168.1.2:5001."
      no_tls_verify:
        name: Bỏ qua kiểm tra TLS
        description: "Bật để chấp nhận chứng chỉ tự ký trên dịch vụ HTTPS."
      http_host_header:
        name: HTTP Host Header
        description: "Giá trị tuỳ chọn gửi làm Host header tới dịch vụ."
  catch_all_service:
    name: Dịch vụ mặc định (chế độ cục bộ)
    description: "Việc xảy ra với các tên miền chưa khai báo. Mặc định http_status:404 trả về trang 404; nhập một địa chỉ để chuyển lưu lượng tới dịch vụ đó."
  nginx_proxy_manager:
    name: Dùng Nginx Proxy Manager (chế độ cục bộ)
    description: "Chuyển các tên miền chưa khai báo sang add-on Nginx Proxy Manager chính thức. Ghi đè dịch vụ mặc định."
  overwrite_dns:
    name: Ghi đè bản ghi DNS đã có (chế độ cục bộ)
    description: "Tắt (khuyên dùng): bản ghi DNS trùng tên đã tồn tại được giữ nguyên và log sẽ cảnh báo. Bật: bản ghi đó bị thay để trỏ về tunnel này."
  custom_flags:
    name: Cờ cloudflared tuỳ chỉnh
    description: "Các cờ dòng lệnh bổ sung cho cloudflared, mỗi mục một cờ, ví dụ --region=us. Không lặp lại các tuỳ chọn đã có cài đặt riêng."
network:
  2000/tcp: Metrics cho Prometheus (đặt tuỳ chọn Cổng metrics là 2000)
